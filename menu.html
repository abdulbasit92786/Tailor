<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مینیو</title><link rel="stylesheet" href="style.css"><style>
.menu-card{padding:18px}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.backup-actions button{width:100%}.info-list{margin-top:14px}.info-list div{padding:10px 0;border-bottom:1px solid #e5eaf0}.apk-card{background:linear-gradient(135deg,#eef4ff,#f8fbff);border:1px solid #d8e4f5}.apk-card h2{margin:0 0 7px}.note{font-size:14px;line-height:1.8;color:#59677b}@media(max-width:560px){.backup-actions{grid-template-columns:1fr}.menu-card{padding:14px}}
</style></head><body><div id="app"></div>
<script type="module">
import{requireAuth,nav,bindNav,db,collection,getDocs,doc,writeBatch,Timestamp,lang,$}from'./app.js';
requireAuth(async u=>{
const en=lang()==='en',T=(ur,eng)=>en?eng:ur;
document.getElementById('app').innerHTML=nav('menu')+`<main class="wrap">
<div class="hero"><h1>☰ ${T('مینیو','Menu')}</h1><p>${T('بیک اپ، امپورٹ، ایکسپورٹ اور ایپ کی معلومات','Backup, import, export and app tools')}</p></div>
<div class="card menu-card"><h2>💾 ${T('بیک اپ اور بحالی','Backup & Restore')}</h2><p class="muted">${T('اپنے محفوظ کسٹمرز اور تمام آرڈرز کا مکمل ڈیٹا JSON فائل میں محفوظ کریں۔','Save customers and all orders in a JSON backup file.')}</p>
<div class="info-list"><div>${T('محفوظ کسٹمرز','Saved Customers')}: <b id="cc">0</b></div><div>${T('کل آرڈرز','Total Orders')}: <b id="oc">0</b></div></div>
<div class="backup-actions"><button id="export" class="primary">📤 ${T('Export Backup','Export Backup')}</button><button id="import" class="secondary">📥 ${T('Import Backup','Import Backup')}</button></div>
<input id="file" type="file" accept=".json,application/json" hidden><div id="msg" class="muted"></div></div>
<div class="card apk-card"><h2>📱 ${T('موبائل APK','Mobile APK')}</h2><p class="note">${T('ابھی APK فائل اس ویب پروجیکٹ کے اندر موجود نہیں ہے۔ ویب ایپ کو APK میں تبدیل کرنے کے بعد APK فائل کو اپنے hosting/server پر رکھ کر اسی جگہ Download بٹن کا لنک لگایا جائے گا۔','The APK is not generated inside this web project yet. After converting the web app to an APK, host the APK file and place its download link here.')}</p><button class="secondary" id="apkBtn">📥 ${T('APK Download','APK Download')}</button></div>
<div class="card"><h2>${T('اہم بات','Important')}</h2><p class="note">${T('Import موجودہ data کو ختم نہیں کرتا۔ ایک ہی Customer ID یا ایک ہی فون والے Customer کو دوبارہ الگ customer نہیں بنایا جائے گا۔ Orders میں موجود ID بھی دوبارہ استعمال ہونے پر duplicate نہیں بنائے گی۔','Import does not delete existing data. A customer with the same ID or phone is merged instead of duplicated. Orders with the same ID are updated instead of duplicated.')}</p></div>
</main>`;
bindNav();
const usersRef=collection(db,'users',u.uid);
async function counts(){try{const [c,o]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);$('cc').textContent=c.size;$('oc').textContent=o.size}catch(e){}}
function ser(v){if(v instanceof Timestamp)return{__type:'timestamp',seconds:v.seconds,nanoseconds:v.nanoseconds};if(Array.isArray(v))return v.map(ser);if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v))o[k]=ser(v[k]);return o}return v}
function des(v){if(Array.isArray(v))return v.map(des);if(v&&typeof v==='object'){if(v.__type==='timestamp')return Timestamp.fromMillis((Number(v.seconds)||0)*1000+Math.floor((Number(v.nanoseconds)||0)/1000000));const o={};for(const k of Object.keys(v))o[k]=des(v[k]);return o}return v}
const phone=v=>String(v??'').replace(/\D/g,'');
$('export').onclick=async()=>{try{$('msg').textContent=T('بیک اپ بن رہا ہے...','Creating backup...');const[c,o]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);const data={backupVersion:'3.0',backupType:'Tailor Manager Full Backup',createdAt:new Date().toISOString(),sourceUser:u.uid,data:{customers:c.docs.map(d=>({id:d.id,data:ser(d.data())})),orders:o.docs.map(d=>({id:d.id,data:ser(d.data())}))}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tailor-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);$('msg').textContent=T('✓ بیک اپ تیار ہے۔','✓ Backup created.')}catch(e){$('msg').textContent=T('مسئلہ: ','Error: ')+e.message}};
$('import').onclick=()=>$('#file').click();
$('file').onchange=async ev=>{const f=ev.target.files?.[0];ev.target.value='';if(!f)return;try{$('import').disabled=true;$('export').disabled=true;$('msg').textContent=T('امپورٹ ہو رہا ہے...','Importing...');const b=JSON.parse(await f.text());if(!b?.data?.customers||!b?.data?.orders)throw new Error(T('غلط بیک اپ فائل','Invalid backup file'));
const [existingC,existingO]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);
const byId=new Map(existingC.docs.map(d=>[d.id,d]));const byPhone=new Map(existingC.docs.map(d=>[phone(d.data().phone),d.id]).filter(x=>x[0]));
const customerMap=new Map();let batch=writeBatch(db),n=0;
async function commit(){if(n){await batch.commit();batch=writeBatch(db);n=0}}
for(const item of b.data.customers){if(!item?.id||!item.data)continue;const data=des(item.data),ph=phone(data.phone);let target=byId.get(item.id)?.id||byPhone.get(ph)||item.id;customerMap.set(item.id,target);batch.set(doc(db,'users',u.uid,'customers',target),data,{merge:true});n++;if(n>=400)await commit()}
await commit();
const existingOrderIds=new Set(existingO.docs.map(d=>d.id));batch=writeBatch(db);n=0;
for(const item of b.data.orders){if(!item?.id||!item.data)continue;const data=des(item.data);if(data.customerId&&customerMap.has(data.customerId))data.customerId=customerMap.get(data.customerId);const target=item.id;batch.set(doc(db,'users',u.uid,'orders',target),data,{merge:true});n++;if(n>=400)await commit()}
await commit();await counts();$('msg').textContent=T('✓ Import مکمل۔ موجودہ کسٹمرز/آرڈرز merge ہوئے، duplicate IDs نہیں بنیں۔','✓ Import complete. Existing customers/orders were merged; duplicate IDs were not created.')}catch(e){$('msg').textContent=T('مسئلہ: ','Error: ')+e.message}finally{$('import').disabled=false;$('export').disabled=false}};
$('apkBtn').onclick=()=>alert(T('APK ابھی تیار نہیں ہے۔ ویب ایپ مکمل ہونے کے بعد اسے APK میں تبدیل کیا جائے گا۔','The APK is not generated yet. The web app will be converted to APK after the web version is finalized.'));
counts();
});
</script></body></html>
