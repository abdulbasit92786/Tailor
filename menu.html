<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="hero"><h2>☰ مینو</h2><p>صرف ڈیٹا Backup کے لیے Import / Export</p></div><div class="section"><h3>💾 Backup</h3><div class="actions"><button id="export" class="primary">⬇️ Export Backup</button><button id="importBtn" class="warning">⬆️ Import Backup</button><input id="file" type="file" accept="application/json" hidden></div><p id="msg" class="muted"></p></div></main><nav><a href="index.html">🏠<span>ہوم</span></a><a href="add-order.html">➕<span>نیا آرڈر</span></a><a href="customers.html">👥<span>کسٹمرز</span></a><a href="new-users.html">🆕<span>نیو یوزرز</span></a><a class="on" href="menu.html">☰<span>مینو</span></a></nav><script type="module">import{requireUser,$,db,allOrders,allCustomers}from'./app.js';import{collection,getDocs,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser();$('#export').onclick=async()=>{const [orders,customers]=await Promise.all([allOrders(u),allCustomers(u)]);const data={version:1,exportedAt:new Date().toISOString(),customers,orders};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tailor-backup.json';a.click();URL.revokeObjectURL(a.href);$('#msg').textContent='✅ Backup Export ہوگیا'};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async()=>{const f=$('#file').files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.customers)||!Array.isArray(data.orders))throw Error('invalid');for(const c of data.customers){const x={...c};delete x.id;await setDoc(doc(db,'users',u.uid,'customers',c.id||crypto.randomUUID()),x)}for(const o of data.orders){const x={...o};delete x.id;await setDoc(doc(db,'users',u.uid,'orders',o.id||crypto.randomUUID()),x)}$('#msg').textContent='✅ Backup Import ہوگیا؛ صفحہ دوبارہ کھولیں'}catch(e){$('#msg').textContent='❌ Backup فائل درست نہیں'}};</script></body></html>
