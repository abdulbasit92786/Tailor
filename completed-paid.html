<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment History</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="hero"><h2>💳 Payment History</h2><p>مکمل Paid کپڑے</p></div><div id="list"></div></main><script type="module">import{requireUser,$,esc,n,money,dt,allOrders,orderPieces}from'./app.js';const u=await requireUser(),orders=await allOrders(u),xs=orders.flatMap(o=>orderPieces(o).map(p=>({o,p}))).filter(x=>n(x.p.receivedAmount)>=n(x.p.totalAmount));$('#list').innerHTML=xs.map(x=>`<div class="card" style="padding:15px;margin-bottom:10px"><b>${esc(x.o.customerName)}</b> <span class="badge paid">Paid</span><div class="muted">کپڑا نمبر ${x.p.pieceNo} · ${dt(x.p.paymentEvents?.at(-1)?.at)}</div><div class="detail">کل ${money(x.p.totalAmount)} · وصول ${money(x.p.receivedAmount)} · بقایا 0</div></div>`).join('')||'<div class="empty">ابھی Paid History نہیں</div>';</script></body></html>
