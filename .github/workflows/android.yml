name: Build Tailor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare web files
        run: |
          mkdir www
          cp *.html www/
          cp *.js www/
          cp *.css www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          npx cap init "Tailor Manager" "com.abdulbasit92786.tailor" --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Copy Web App
        run: npx cap copy android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tailor-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
