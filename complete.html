<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مکمل</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{db,requireAuth,nav,bindNav,$,collection,getDocs,esc,fields,designs,dateText}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('complete')+`<main class="wrap"><div class="hero"><h1>مکمل کپڑے</h1><p>یہاں مکمل کیے گئے کپڑوں کی سالوں تک تاریخ محفوظ رہے گی۔</p></div><div id="summary"></div><div id="list"><div class="loading">لوڈ ہو رہا ہے...</div></div></main>`;bindNav();async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'orders'));const a=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>Number(o.completedQuantity||0)>0||o.status==='ready'||o.status==='delivered');let total=a.reduce((n,o)=>n+Number(o.completedQuantity||o.quantity||0),0);$('summary').innerHTML=`<div class="summary"><div class="card"><small>کل مکمل کپڑے</small><b>${total}</b></div><div class="card"><small>مکمل آرڈرز</small><b>${a.length}</b></div><div class="card"><small>سال</small><b>${new Date().getFullYear()}</b></div></div>`;$('list').innerHTML=a.length?a.sort((x,y)=>String(y.completedAt||y.readyAt||y.createdAt||'').localeCompare(String(x.completedAt||x.readyAt||x.createdAt||''))).map(o=>`<article class="card order"><div class="order-head"><div><b style="font-size:20px">${esc(o.name||'-')}</b><div class="muted">${o.customerType==='new'?'🆕 نیا یوزر':'👤 محفوظ کسٹمر'} • ${esc(o.phone||'')}</div><div class="muted">${esc(o.area||'-')} • ${esc(o.address||'-')}</div></div><span class="badge">${Number(o.completedQuantity||o.quantity||0)} مکمل</span></div><div class="history-item"><strong>کب:</strong> ${dateText(o.completedAt||o.readyAt||o.createdAt)}<br><span class="muted">کل آرڈر: ${Number(o.quantity)||1} کپڑے • مکمل: ${Number(o.completedQuantity||o.quantity||0)}</span></div><div class="detail-section"><h3>ناپ</h3>${fields.map(([k,n])=>`<div class="detail-line"><span>${n}</span><b>${esc(o.measurements?.[k]||'-')}</b></div>`).join('')}</div><div class="detail-section"><h3>ڈیزائن</h3><div class="design-list">${designs.filter(([k])=>o.designs?.[k]).map(([,n])=>`<span>${n}</span>`).join('')||'<span>-</span>'}</div></div></article>`).join(''):'<div class="card empty">ابھی کوئی مکمل کپڑا نہیں</div>'}catch(e){$('list').innerHTML='<div class="card empty">مکمل ریکارڈ لوڈ نہیں ہو سکا۔</div>'}}load()});</script></body></html>
