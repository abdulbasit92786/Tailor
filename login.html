<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tailor Login</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap" style="max-width:520px;padding-top:12vh"><div class="hero"><div class="brandmark">✂</div><h1>Tailor Manager</h1><p>اپنے محفوظ کسٹمر اور آرڈرز تک رسائی حاصل کریں</p></div><div class="card"><form id="f" class="form"><label>ای میل<input id="email" type="email" required></label><label>پاس ورڈ<input id="password" type="password" required></label><button class="primary">لاگ اِن</button><div id="err" class="muted"></div></form></div></main><script type="module">import{auth,onAuthStateChanged,signInWithEmailAndPassword,$}from'./app.js';onAuthStateChanged(auth,u=>{if(u)location.replace('index.html')});$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);location.replace('index.html')}catch(x){$('err').textContent='ای میل یا پاس ورڈ درست نہیں، یا اکاؤنٹ دستیاب نہیں۔'}}</script></body></html>
