<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Tailor Management System - Login</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
    --bg1:#020617;
    --bg2:#0f172a;
    --blue:#6366f1;
    --blue2:#4f46e5;
    --text:#f8fafc;
    --muted:#94a3b8;
}

html,body{min-height:100%;}

body{
    min-height:100vh;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 10%,rgba(99,102,241,.30),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(14,165,233,.20),transparent 32%),
        linear-gradient(145deg,var(--bg1),var(--bg2) 55%,#111827);
}

/* Decorative background */
.bg-orb{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(1px);
    opacity:.55;
}
.orb1{
    width:280px;height:280px;
    top:-150px;right:-110px;
    background:radial-gradient(circle,rgba(129,140,248,.32),transparent 68%);
}
.orb2{
    width:360px;height:360px;
    bottom:-190px;left:-150px;
    background:radial-gradient(circle,rgba(56,189,248,.20),transparent 68%);
}

/* Main */
.login-wrap{
    width:100%;
    max-width:430px;
    position:relative;
    z-index:2;
}

.login-card{
    position:relative;
    overflow:hidden;
    padding:34px 30px 27px;
    border-radius:30px;
    text-align:center;
    background:rgba(15,23,42,.78);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 30px 80px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    animation:cardIn .65s ease both;
}

.login-card::before{
    content:"";
    position:absolute;
    width:180px;height:180px;
    top:-120px;left:-100px;
    border-radius:50%;
    background:rgba(99,102,241,.20);
    filter:blur(5px);
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(22px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* Brand */
.brand-icon{
    width:86px;height:86px;
    margin:0 auto 19px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    font-size:45px;
    background:linear-gradient(145deg,#818cf8,#4f46e5);
    border:1px solid rgba(255,255,255,.20);
    box-shadow:
        0 15px 35px rgba(79,70,229,.38),
        inset 0 1px 0 rgba(255,255,255,.25);
    transform:rotate(-3deg);
}

.brand-icon span{
    transform:rotate(3deg);
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 13px;
    margin-bottom:15px;
    border-radius:999px;
    color:#c7d2fe;
    background:rgba(99,102,241,.12);
    border:1px solid rgba(129,140,248,.20);
    font-size:11px;
    font-weight:700;
}

.badge-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,.12);
}

h1{
    font-size:26px;
    line-height:1.35;
    font-weight:800;
    letter-spacing:-.3px;
}

.subtitle{
    margin:8px 0 25px;
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

/* Google button */
.google-btn{
    width:100%;
    min-height:58px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    background:#fff;
    color:#1f2937;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:0 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.20);
    transition:transform .2s,box-shadow .2s,background .2s;
}

.google-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(0,0,0,.28);
    background:#f8fafc;
}

.google-btn:active{transform:scale(.985)}
.google-btn:disabled{opacity:.72;cursor:not-allowed;transform:none}

.google-logo{width:21px;height:21px;flex:none}

.loading{
    width:20px;height:20px;
    border:3px solid #dbeafe;
    border-top-color:#4f46e5;
    border-radius:50%;
    animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Security row */
.security{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:20px;
    color:#94a3b8;
    font-size:11px;
}

.security-icon{
    width:27px;height:27px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.14);
}

/* Error */
.error-box{
    display:none;
    margin-top:14px;
    padding:12px 13px;
    border-radius:13px;
    background:rgba(239,68,68,.10);
    border:1px solid rgba(248,113,113,.20);
    color:#fecaca;
    font-size:11px;
    line-height:1.7;
    text-align:right;
}

/* Footer */
.footer{
    margin-top:24px;
    padding-top:19px;
    border-top:1px solid rgba(255,255,255,.08);
    color:#64748b;
    font-size:10px;
    line-height:1.8;
}

.footer strong{color:#94a3b8}
.footer .line2{margin-top:2px}

/* Mobile */
@media(max-width:480px){
    body{padding:14px}
    .login-card{
        padding:29px 20px 23px;
        border-radius:25px;
    }
    .brand-icon{
        width:76px;height:76px;
        border-radius:22px;
        font-size:39px;
    }
    h1{font-size:22px}
    .subtitle{font-size:12px;margin-bottom:22px}
    .google-btn{min-height:55px;font-size:13px}
}

@media(max-height:650px){
    .login-card{padding-top:22px;padding-bottom:19px}
    .brand-icon{width:65px;height:65px;font-size:33px;margin-bottom:12px}
    .subtitle{margin-bottom:17px}
    .security{margin-top:13px}
    .footer{margin-top:16px;padding-top:13px}
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<main class="login-wrap">
<section class="login-card">

    <div class="brand-icon" aria-hidden="true">
        <span>✂️</span>
    </div>

    <div class="badge">
        <span class="badge-dot"></span>
        محفوظ اور آسان لاگ اِن
    </div>

    <h1>درزی مینجمنٹ سسٹم</h1>

    <p class="subtitle">
        اپنے آرڈرز، کسٹمرز اور کاروبار کو<br>
        ایک جگہ آسانی سے مینج کریں
    </p>

    <button id="googleLoginBtn" class="google-btn" type="button">
        <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.5-.39-2.24s.14-1.52.39-2.24V6.6H1.18C.43 8.13 0 9.87 0 11.7s.43 3.57 1.18 5.1l4.09 2.56z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        <span id="loginText">گوگل کے ذریعے لاگ اِن کریں</span>
    </button>

    <div id="errorBox" class="error-box"></div>

    <div class="security">
        <span class="security-icon">🔒</span>
        <span>آپ کی لاگ اِن معلومات محفوظ ہیں</span>
    </div>

    <footer class="footer">
        <div>© 2026 <strong>Tailor Management System</strong></div>
        <div class="line2">Smart • Simple • Professional</div>
    </footer>

</section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={
    apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
    authDomain:"tailor-web-f1f1c.firebaseapp.com",
    projectId:"tailor-web-f1f1c",
    storageBucket:"tailor-web-f1f1c.firebasestorage.app",
    messagingSenderId:"129811668871",
    appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const loginButton=document.getElementById("googleLoginBtn");
const loginText=document.getElementById("loginText");
const errorBox=document.getElementById("errorBox");

loginButton.addEventListener("click",async()=>{
    try{
        loginButton.disabled=true;
        errorBox.style.display="none";
        loginText.innerHTML='<span class="loading"></span> لاگ اِن ہو رہا ہے...';

        await signInWithPopup(auth,provider);

        window.location.replace("index.html");
    }catch(error){
        console.error("Google Login Error:",error);

        loginButton.disabled=false;
        loginText.textContent="گوگل کے ذریعے لاگ اِن کریں";

        errorBox.style.display="block";

        let message="لاگ اِن میں مسئلہ آیا ہے۔ دوبارہ کوشش کریں۔";

        if(error?.code==="auth/popup-closed-by-user"){
            message="لاگ اِن ونڈو بند کر دی گئی۔ دوبارہ کوشش کریں۔";
        }else if(error?.code==="auth/popup-blocked"){
            message="براؤزر نے لاگ اِن ونڈو روک دی ہے۔ Popup کی اجازت دے کر دوبارہ کوشش کریں۔";
        }else if(error?.message){
            message="لاگ اِن میں مسئلہ آیا ہے: "+error.message;
        }

        errorBox.textContent=message;
    }
});
</script>

</body>
</html>
