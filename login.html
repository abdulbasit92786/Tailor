<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tailor - لاگ ان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .btn-google { background-color: #4285F4; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
        .btn-google:hover { background-color: #357ae8; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Tailor لاگ ان</h2>
        <p>اپنے گوگل اکاؤنٹ سے شروع کریں</p>
        <button id="googleLoginBtn" class="btn-google">گوگل کے ذریعے لاگ ان</button>
    </div>

    <!-- فائر بیس کی کنفیگریشن اور لاگ ان کا لاجک -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
            authDomain: "tailor-web-f1f1c.firebaseapp.com",
            projectId: "tailor-web-f1f1c",
            storageBucket: "tailor-web-f1f1c.firebasestorage.app",
            messagingSenderId: "129811668871",
            appId: "1:129811668871:web:586357e9e696a9652ffd22"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById("googleLoginBtn").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then(() => {
                    window.location.href = "index.html"; // کامیاب لاگ ان کے بعد انڈیکس پر جائیں
                })
                .catch((error) => {
                    alert("لاگ ان میں مسئلہ: " + error.message);
                });
        });
    </script>
</body>
</html>
