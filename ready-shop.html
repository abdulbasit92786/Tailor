<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ready In Shop - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,"Segoe UI",sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at top left,#334155 0%,transparent 34%),radial-gradient(circle at bottom right,#312e81 0%,transparent 42%),linear-gradient(145deg,#020617,#0f172a);padding:16px 16px 105px}
button,input{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top-btn{width:46px;height:46px;border-radius:15px;border:1px solid #ffffff20;background:#ffffff12;color:#fff;display:grid;place-items:center;font-size:20px;text-decoration:none}.title{flex:1;text-align:center}.title h1{font-size:20px}.title p{font-size:11px;color:#94a3b8;margin-top:4px}.refresh{font-size:18px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.summary-card{padding:15px;border-radius:19px;background:#ffffff0b;border:1px solid #ffffff14;box-shadow:0 10px 25px #0003;text-align:center}.summary-card b{display:block;font-size:23px;margin-bottom:4px}.summary-card span{font-size:10px;color:#94a3b8}
.search{width:100%;padding:14px 15px;border-radius:16px;outline:none;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;margin-bottom:14px;font-size:13px}.search::placeholder{color:#718096}.search:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f122}.msg{text-align:center;min-height:20px;margin:5px 0 10px;font-size:11px;color:#a7f3d0}
.empty{padding:35px 15px;text-align:center;border-radius:22px;background:#ffffff09;border:1px solid #ffffff12;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:8px}
.order{border-radius:22px;background:#ffffff0b;border:1px solid #ffffff14;box-shadow:0 10px 28px #0004;margin-bottom:12px;overflow:hidden}.order-head{padding:15px;display:flex;align-items:center;gap:11px}.avatar{width:50px;height:50px;min-width:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:21px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.name{font-size:15px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#94a3b8;line-height:1.7}.badge{font-size:9px;padding:6px 8px;border-radius:10px;white-space:nowrap;background:#8b5cf622;color:#ddd6fe;border:1px solid #8b5cf633}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 15px 14px}.quick div{padding:9px 5px;border-radius:12px;background:#0003;text-align:center}.quick b{display:block;font-size:12px;margin-bottom:3px}.quick span{font-size:9px;color:#94a3b8}
.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 16px}.order.open .details{display:block}.section{font-size:13px;font-weight:700;margin:15px 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{padding:10px;border-radius:11px;background:#0003;font-size:10px;color:#cbd5e1;min-height:46px}.d b{display:block;color:#fff;font-size:10px;margin-bottom:4px}.tag{display:inline-block;font-size:10px;color:#c7d2fe;background:#6366f122;border:1px solid #6366f133;border-radius:10px;padding:7px 9px;margin:2px}.actions{margin-top:15px;padding-top:13px;border-top:1px solid #ffffff12}.action{width:100%;border:0;border-radius:14px;padding:13px;color:#fff;font-weight:700;font-size:12px}.receive{background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 8px 20px #22c55e33}.deliver{background:linear-gradient(135deg,#0ea5e9,#0369a1);box-shadow:0 8px 20px #0ea5e933}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:14px}.modal.show{display:flex}.sheet{width:100%;max-width:480px;background:#111827;border:1px solid #ffffff18;border-radius:24px 24px 18px 18px;padding:18px;box-shadow:0 -15px 45px #0008}.sheet h2{font-size:17px;margin-bottom:6px}.sheet p{font-size:10px;color:#94a3b8;margin-bottom:15px;line-height:1.6}.field{margin-bottom:10px}.field label{display:block;font-size:10px;color:#cbd5e1;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff18;color:#fff;outline:none}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions button{flex:1;border:0;border-radius:12px;padding:12px;color:#fff;font-weight:700}.cancel{background:#ffffff12}.confirm{background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.bottom{position:fixed;left:0;right:0;bottom:0;height:75px;background:#020617f5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}.nav a{color:#94a3b8;text-decoration:none;font-size:9px;text-align:center;min-width:45px;direction:rtl}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}.nav .active i{filter:drop-shadow(0 0 6px #818cf8)}
@media(max-width:360px){.grid{grid-template-columns:1fr}.quick div{padding:8px 3px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><a href="index.html" class="top-btn">←</a><div class="title"><h1>🏪 Ready In Shop</h1><p>تیار کپڑے دکان میں موجود ہیں</p></div><button id="refreshBtn" class="top-btn refresh" title="Refresh">↻</button></div>
<div class="summary"><div class="summary-card"><b id="total">0</b><span>Ready Orders</span></div><div class="summary-card"><b id="unpaid">0</b><span>Payment Pending</span></div></div>
<input id="search" class="search" type="search" placeholder="🔍 نام، موبائل، Account No. یا Order No. تلاش کریں" autocomplete="off">
<div id="msg" class="msg"></div><div id="list"><div class="empty"><strong>⏳ Ready In Shop لوڈ ہو رہا ہے...</strong>براہ کرم انتظار کریں۔</div></div>
</div>
<div class="bottom"><div class="nav"><a href="index.html"><i>🏠</i>Home</a><a href="add-order.html"><i>➕</i>Add Order</a><a href="customers.html"><i>👥</i>Customers</a><a href="new-users.html"><i>🆕</i>New Users</a><a href="menu.html" class="active"><i>☰</i>Menu</a></div></div>
<div id="deliveryModal" class="modal"><div class="sheet"><h2>👕 کپڑے Deliver کریں</h2><p id="deliveryHint">Delivery کی معلومات درج کریں۔</p><div class="field"><label>کس کو دیا گیا؟</label><input id="receivedBy" placeholder="مثلاً: خود Customer / بھائی / والد"></div><div class="field"><label>کس کے ذریعے / طریقہ</label><input id="deliveryMethod" placeholder="مثلاً: دکان سے خود وصول / نمائندہ"></div><div class="sheet-actions"><button class="cancel" id="cancelDelivery">Cancel</button><button class="confirm" id="confirmDelivery">✓ Confirm Delivery</button></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,all=[],selected=null;const $=id=>document.getElementById(id);const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function first(...v){return v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=="")}
function statusOf(o){return String(first(o.status,o.orderStatus,o.currentStatus,"")||"").toLowerCase().replace(/[\s-]/g,"_")}
function isReady(o){const s=statusOf(o);return ["ready","ready_in_shop","readyinshop","ready_shop"].includes(s)||o.readyInShop===true||o.ready===true}
function isPaid(o){return o.paymentReceived===true||o.paid===true||["paid","complete_paid","completed_paid","received"].includes(String(first(o.paymentStatus,o.payment,"")||"").toLowerCase().replace(/[\s-]/g,"_"))}
function dateText(o){const x=first(o.orderDate,o.createdAt,o.date,o.createdAtText);if(x?.toDate){try{return x.toDate().toLocaleDateString("en-GB")}catch{}}return x?String(x):"—"}
function typeText(o){const t=String(first(o.customerType,o.userType,o.sourceType,o.type,"")||"").toLowerCase();if(t.includes("new"))return"New User";if(t.includes("old")||t.includes("customer")||t.includes("regular"))return"Customer";return first(o.isNewUser?"New User":null,o.newUser?"New User":null,"Customer")}
function measurements(o){return o.measurements||o.measurement||o.nap||{}}
const measureFields=[["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],["chest","چھاتی"],["waist","کمر"],["daman","دامن"],["shalwarLength","شلوار لمبائی"],["pancha","پانچہ"],["shalwar","شلوار"],["qameez","قمیض"]];
const designNames={twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"};
function designs(o){const d=o.designs||o.design||{};return Object.keys(designNames).filter(k=>d[k]).map(k=>`<span class="tag">${esc(designNames[k])}</span>`).join("")}
async function load(){try{$("msg").textContent="⏳ Orders لوڈ ہو رہے ہیں...";all=[];const snap=await getDocs(collection(db,"users",user.uid,"orders"));all=snap.docs.map(x=>({id:x.id,...x.data()})).filter(isReady);$("total").textContent=all.length;$("unpaid").textContent=all.filter(o=>!isPaid(o)).length;$("msg").textContent="";render(all)}catch(error){console.error(error);$("msg").textContent="❌ Ready In Shop لوڈ نہیں ہو سکا: "+error.message}}
function render(data){const list=$("list");list.innerHTML="";if(!data.length){list.innerHTML=`<div class="empty"><strong>🏪 ابھی کوئی Ready Order نہیں</strong>Pending سے Complete ہونے والے کپڑے یہاں نظر آئیں گے۔</div>`;return}data.forEach(o=>{const m=measurements(o),paid=isPaid(o),type=typeText(o),name=first(o.customerName,o.name,o.customer?.name,"Unknown Customer"),phone=first(o.phone,o.customerPhone,o.customer?.phone,"—"),account=first(o.accountNo,o.customerAccountNo,o.customer?.accountNo,"—"),orderNo=first(o.orderNo,o.orderNumber,o.orderId,o.id,"—"),total=first(o.totalAmount,o.amount,o.price,o.total,"0"),photo=first(o.photo,o.customerPhoto,o.customer?.photo,"");const card=document.createElement("div");card.className="order";card.innerHTML=`<div class="order-head"><div class="avatar">${photo?`<img src="${esc(photo)}" alt="Customer" onerror="this.style.display='none'">`:"👤"}</div><div class="info"><div class="name">${esc(name)}</div><div class="meta">📱 ${esc(phone)}<br>📅 ${esc(dateText(o))} · Order #${esc(orderNo)}</div></div><div class="badge">${esc(type)}</div></div><div class="quick"><div><b>💰 ${esc(total)}</b><span>${paid?"Payment Received":"Payment Pending"}</span></div><div><b>#${esc(account)}</b><span>Account No.</span></div><div><b>🧵 Ready</b><span>دکان میں</span></div></div><div class="details"><div class="section">👤 Customer / Order</div><div class="grid"><div class="d"><b>نام</b>${esc(name)}</div><div class="d"><b>فون نمبر</b>${esc(phone)}</div><div class="d"><b>Customer Type</b>${esc(type)}</div><div class="d"><b>Order Date</b>${esc(dateText(o))}</div><div class="d"><b>Account No.</b>${esc(account)}</div><div class="d"><b>Order No.</b>${esc(orderNo)}</div></div><div class="section">📏 کپڑوں کے ناپ</div><div class="grid">${measureFields.map(([k,n])=>`<div class="d"><b>${n}</b>${esc(m[k]??m[n]??"—")}</div>`).join("")}</div><div class="section">✂️ کپڑے / ڈیزائن</div><div>${designs(o)||`<span style="color:#64748b;font-size:10px">کوئی ڈیزائن محفوظ نہیں</span>`}</div><div class="section">📦 موجودہ Status</div><div class="d"><b>Ready In Shop</b>کپڑے تیار ہیں اور دکان میں موجود ہیں۔</div><div class="actions">${paid?`<button class="action deliver">👕 Deliver Order</button>`:`<button class="action receive">💵 Receive Payment</button>`}</div></div>`;card.querySelector(".order-head").onclick=()=>card.classList.toggle("open");if(paid){card.querySelector(".deliver").onclick=e=>{e.stopPropagation();selected=o;$("deliveryHint").textContent=`${name} کا Order #${orderNo} Deliver کرنے کے لیے معلومات درج کریں۔`;$("receivedBy").value="";$("deliveryMethod").value="";$("deliveryModal").classList.add("show")}}else{card.querySelector(".receive").onclick=async e=>{e.stopPropagation();await receivePayment(o)}}list.appendChild(card)})}
async function receivePayment(o){const name=first(o.customerName,o.name,"Customer"),amount=first(o.totalAmount,o.amount,o.price,o.total,"0");if(!confirm(`${name} کی Payment (${amount}) Receive ہوگئی؟\n\nOK دبانے سے Order Paid ہوگا اور Ready In Shop میں Deliver کا بٹن آئے گا۔`))return;try{await updateDoc(doc(db,"users",user.uid,"orders",o.id),{paymentReceived:true,paymentStatus:"paid",status:"ready_in_shop",paymentReceivedAt:serverTimestamp()});$("msg").textContent="✅ Payment Receive ہوگئی۔";await load()}catch(error){console.error(error);$("msg").textContent="❌ Payment update نہیں ہو سکی: "+error.message}}
$("cancelDelivery").onclick=()=>$("deliveryModal").classList.remove("show");$("confirmDelivery").onclick=async()=>{if(!selected)return;const by=$("receivedBy").value.trim(),method=$("deliveryMethod").value.trim();if(!by){alert("براہ کرم 'کس کو دیا گیا؟' ضرور لکھیں۔");return}try{await updateDoc(doc(db,"users",user.uid,"orders",selected.id),{status:"delivered",orderStatus:"delivered",delivered:true,deliveredTo:by,deliveryMethod:method||"Shop",deliveredAt:serverTimestamp()});$("deliveryModal").classList.remove("show");$("msg").textContent="✅ Order Delivered ہوگیا۔";selected=null;await load()}catch(error){console.error(error);$("msg").textContent="❌ Delivery update نہیں ہو سکی: "+error.message}};
$("refreshBtn").onclick=load;$("search").oninput=()=>{const q=$("search").value.toLowerCase().trim();if(!q){render(all);return}render(all.filter(o=>[o.customerName,o.name,o.phone,o.customerPhone,o.accountNo,o.orderNo,o.orderNumber,o.id].some(v=>String(v??"").toLowerCase().includes(q))))};onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;await load()});
</script>
</body>
</html>
