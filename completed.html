<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مکمل</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div>
<script type="module">
import{requireAuth,nav,bindNav,db,collection,getDocs,$,esc,fields,designs,lang,dateText}from'./app.js';
requireAuth(async u=>{
const en=lang()==='en',T=(ur,eng)=>en?eng:ur;
document.getElementById('app').innerHTML=nav('complete')+`<main class="wrap"><div class="hero"><h1>${T('مکمل کپڑے','Completed Clothes')}</h1><p>${T('مکمل کپڑوں کی تاریخ محفوظ رہے گی۔','Completed clothes stay in history.')}</p></div><div id="totalBox" class="total-box"><div class="stat" id="total">0</div><div>${T('کل مکمل کپڑے','Total Completed Clothes')}</div></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" placeholder="${T('نام، فون، علاقہ یا پتہ تلاش کریں','Search name, phone, area or address')}"></div></div><div id="list"><div class="loading">${T('لوڈ ہو رہا ہے...','Loading...')}</div></div></main>`;
bindNav();let all=[];
async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'orders'));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>Number(o.completedQuantity)>0);$('total').textContent=all.reduce((n,o)=>n+(Number(o.completedQuantity)||0),0);render()}catch(e){$('list').innerHTML=`<div class="card empty">${T('تاریخ لوڈ نہیں ہو سکی۔','Could not load history.')}<br>${esc(e.message)}</div>`}}
function render(){const q=String($('q').value??'').toLowerCase().trim();const a=all.filter(o=>[o.name,o.phone,o.area,o.address,o.color].some(v=>String(v??'').toLowerCase().includes(q)));
$('list').innerHTML=a.length?a.map(o=>{const done=Number(o.completedQuantity)||0,total=Math.max(1,Number(o.quantity)||1),left=Math.max(0,total-done);return `<article class="card"><details><summary class="order-head"><div class="summary-main"><strong>${esc(o.name||'-')}</strong><div class="muted">${o.customerType==='new'?'🆕 '+T('نیا یوزر','New User'):'👤 '+T('محفوظ کسٹمر','Saved Customer')} • ${esc(o.phone||'-')}</div><div class="muted">📅 ${dateText(o.createdAt)} • 📍 ${esc(o.area||'-')}</div><div class="muted">🟢 ${T('اسٹیٹس','Status')}: ${esc(o.status||'completed')}</div></div><div class="count-box"><b>${done}</b><span class="muted">${T('مکمل','Done')}</span></div></summary>
<div class="detail">${T('پتہ','Address')}: ${esc(o.address||'-')}<br>${T('کل کپڑے','Total')}: ${total} • ${T('مکمل','Done')}: ${done} • ${T('باقی','Left')}: ${left}</div>
<div class="detail"><b>${T('ناپ','Measurements')}</b><br>${fields.map(([k,ur,eng])=>`${en?eng:ur}: ${esc(o.measurements?.[k]||'-')}`).join('<br>')}</div>
<div class="detail"><b>${T('ڈیزائن','Design')}</b><br>${designs.filter(([k])=>o.designs?.[k]).map(([,ur,eng])=>en?eng:ur).join(', ')||'-'}<br>${T('رنگ','Color')}: ${esc(o.color||'-')}</div>
<button class="secondary show-history" data-id="${esc(o.id)}">${T('مزید دیکھیں','Show More')}</button><div id="extra-${esc(o.id)}" class="hidden"></div>
</details></article>`}).join(''):`<div class="card empty">${T('ابھی کوئی مکمل کپڑا نہیں۔','No completed clothes yet.')}</div>`;
document.querySelectorAll('.show-history').forEach(b=>b.onclick=()=>{const o=all.find(x=>x.id===b.dataset.id);const box=$('extra-'+b.dataset.id);box.classList.toggle('hidden');b.textContent=box.classList.contains('hidden')?T('مزید دیکھیں','Show More'):T('بند کریں','Hide');if(!box.classList.contains('hidden'))box.innerHTML=`<div class="detail"><b>${T('مکمل تاریخ','Completion Date')}:</b> ${dateText(o.lastCompletedAt||o.readyAt||o.createdAt)}<br><b>${T('کپڑوں کی مکمل تفصیل','Completed Details')}:</b> ${doneSafe(o)}<br><b>${T('آرڈر کی تاریخ','Order Date')}:</b> ${dateText(o.createdAt)}</div>`});
}
function doneSafe(o){return `${Number(o.completedQuantity)||0} ${T('کپڑے مکمل','clothes completed')}`;}
$('q').oninput=render;load();
});
</script></body></html>
