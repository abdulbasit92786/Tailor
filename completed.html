<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مکمل</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,$,esc,fields,designs}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('complete')+`<main class="wrap"><div class="hero"><h1>مکمل کپڑے</h1><p>ہر مکمل کیے گئے کپڑے کی تاریخ اور تفصیل محفوظ رہے گی۔</p></div><div class="card"><div class="stat" id="total">0</div><div class="muted">کل مکمل کپڑے</div><div class="searchbar"><span>🔎</span><input id="q" placeholder="نام، فون یا علاقہ تلاش کریں"></div></div><div id="list"></div></main>`;bindNav();let all=[];async function load(){const s=await getDocs(collection(db,'users',u.uid,'orders'));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>Number(o.completedQuantity)>0||(o.status||'')==='ready');total.textContent=all.reduce((n,o)=>n+Number(o.completedQuantity||0),0);render()}function render(){const q=$('q').value.trim().toLowerCase();const a=all.filter(o=>[o.name,o.phone,o.area,o.address].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=a.length?a.map(o=>`<article class="card"><details><summary><b style="font-size:20px">${esc(o.name||'-')}</b> <span class="pill">${Number(o.completedQuantity)||0} کپڑے مکمل</span><div class="muted">${o.customerType==='new'?'🆕 نیا صارف':'👤 محفوظ کسٹمر'} • ${esc(o.phone||'')} • ${esc(o.area||'')}</div></summary><div class="detail" style="margin-top:12px">پتہ: ${esc(o.address||'-')}\nرنگ: ${esc(o.color||'-')}\nتاریخ: ${o.readyAt?new Date(o.readyAt).toLocaleDateString('ur-PK'):'-'}</div><div class="detail">ناپ:\n${fields.map(([k,n])=>`${n}: ${esc(o.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail">ڈیزائن: ${designs.filter(([k])=>o.designs?.[k]).map(([,n])=>n).join('، ')||'-'}</div></details></article>`).join(''):'<div class="card empty">کوئی مکمل کپڑا نہیں</div>'}q.oninput=render;load()});</script></body></html>
