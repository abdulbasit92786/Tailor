<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مکمل</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,$,esc,fields,designs,lang,dateText}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('complete')+`<main class="wrap"><div class="hero"><h1>${en?'Completed Clothes':'مکمل کپڑے'}</h1><p>${en?'Completed quantity is kept in history for later review.':'مکمل کپڑوں کا حساب تاریخ کے ساتھ محفوظ رہے گا۔'}</p></div><div id="totalBox" class="total-box"><div class="stat" id="total">0</div><div>${en?'Total Completed Clothes':'کل مکمل کپڑے'}</div></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" placeholder="${en?'Search name, phone, area or address':'نام، فون، علاقہ یا پتہ تلاش کریں'}"></div></div><div id="list"><div class="loading">${en?'Loading...':'لوڈ ہو رہا ہے...'}</div></div></main>`;bindNav();let all=[];async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'orders'));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>Number(o.completedQuantity)>0);$('total').textContent=all.reduce((n,o)=>n+Math.max(0,Number(o.completedQuantity)||0),0);render()}catch(e){$('list').innerHTML=`<div class="card empty">${en?'Could not load history.':'تاریخ لوڈ نہیں ہو سکی۔'}</div>`}}function render(){const q=$('q').value.toLowerCase().trim();const a=all.filter(o=>[o.name,o.phone,o.area,o.address].some(v=>String(v??'').toLowerCase().includes(q)));$('list').innerHTML=a.length?a.map(o=>{const done=Number(o.completedQuantity)||0;return `<article class="card"><details><summary class="order-head"><div class="summary-main"><strong>${esc(o.name||'-')}</strong><div class="muted">${o.customerType==='new'?'🆕 '+(en?'New User':'نیا یوزر'):'👤 '+(en?'Saved Customer':'محفوظ کسٹمر')} • ${esc(o.phone||'-')} • ${esc(o.area||'-')}</div></div><div class="count-box"><b>${done}</b><span class="muted">${en?'done':'مکمل'}</span></div></summary><div class="detail">${en?'Address':'پتہ'}: ${esc(o.address||'-')}\n${en?'Completed Date':'مکمل تاریخ'}: ${dateText(o.lastCompletedAt||o.readyAt)}</div><div class="detail"><b>${en?'Measurements':'ناپ'}</b>\n${fields.map(([k,ur,eng])=>`${en?eng:ur}: ${esc(o.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail"><b>${en?'Design':'ڈیزائن'}</b>\n${designs.filter(([k])=>o.designs?.[k]).map(([,ur,eng])=>en?eng:ur).join(', ')||'-'}</div></details></article>`}).join(''):`<div class="card empty">${en?'No completed clothes yet.':'ابھی کوئی مکمل کپڑا نہیں۔'}</div>`}$('q').oninput=render;load()});</script></body></html>
