<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Customer - Tailor Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;min-height:100vh;color:#fff;
background:linear-gradient(145deg,#020617,#172554,#312e81);
padding:16px 16px 100px
}
.card{
max-width:480px;margin:auto;background:#ffffff10;
border:1px solid #ffffff20;border-radius:25px;padding:20px;
box-shadow:0 20px 50px #0006;backdrop-filter:blur(18px)
}
.back{
display:inline-flex;width:44px;height:44px;border-radius:14px;
align-items:center;justify-content:center;background:#ffffff15;
color:#fff;text-decoration:none;font-size:22px
}
h1{text-align:center;font-size:23px;margin:8px 0}
.sub{text-align:center;color:#aebbd0;font-size:12px;margin-bottom:22px}

.section{
margin-top:20px;padding:16px;border-radius:20px;
background:#0003;border:1px solid #ffffff12
}
.section h2{font-size:16px;margin-bottom:14px;color:#fff}

label{
display:block;color:#cbd5e1;font-size:12px;margin-bottom:6px
}
input{
width:100%;padding:13px;border-radius:13px;
border:1px solid #ffffff20;background:#ffffff0d;
color:#fff;outline:none;font-size:14px;margin-bottom:13px
}
input::placeholder{color:#718096}

.grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.grid input{margin-bottom:3px}

.color-row{
display:flex;gap:10px;align-items:center
}
#color{
width:55px;height:45px;padding:2px;margin:0;
cursor:pointer
}
#colorName{flex:1}

.options{
display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.option{
position:relative
}
.option input{
display:none
}
.option label{
display:block;padding:13px 10px;margin:0;
border:1px solid #ffffff18;border-radius:13px;
background:#ffffff08;text-align:center;
cursor:pointer;color:#dbeafe;font-size:12px
}
.option input:checked+label{
background:linear-gradient(135deg,#6366f1,#4338ca);
border-color:#818cf8;color:#fff;
box-shadow:0 5px 18px #6366f155
}

.add{
width:100%;margin-top:22px;padding:16px;
border:0;border-radius:16px;
background:linear-gradient(135deg,#22c55e,#15803d);
color:#fff;font-weight:bold;font-size:15px;
cursor:pointer;box-shadow:0 8px 25px #22c55e44
}
.add:disabled{opacity:.6}

.msg{
text-align:center;min-height:22px;margin-top:12px;
font-size:12px;color:#a7f3d0;line-height:1.6
}

.bottom{
position:fixed;bottom:0;left:0;right:0;height:75px;
background:#020617f5;border-top:1px solid #ffffff15;
display:flex;align-items:center;justify-content:center;
z-index:10
}
.nav{
width:100%;max-width:480px;display:flex;
justify-content:space-around;text-align:center
}
.nav a{
color:#94a3b8;text-decoration:none;font-size:9px
}
.nav i{
display:block;font-style:normal;font-size:20px;margin-bottom:3px
}
.nav .active{color:#fff}

@media(max-width:360px){
.grid,.options{grid-template-columns:1fr}
.card{padding:15px}
}
</style>
</head>

<body>

<div class="card">

<a href="add-order.html" class="back">→</a>

<h1>🆕 نیا کسٹمر</h1>
<div class="sub">New Customer & New Order</div>


<!-- CUSTOMER -->
<div class="section">

<h2>👤 کسٹمر کی معلومات</h2>

<label>نام</label>
<input id="name" placeholder="کسٹمر کا نام">

<label>فون نمبر</label>
<input id="phone" type="tel" placeholder="03XXXXXXXXX">

<label>پتہ / علاقہ</label>
<input id="address" placeholder="علاقہ اور مکمل پتہ">

</div>


<!-- MEASUREMENTS -->
<div class="section">

<h2>📏 ناپ</h2>

<div class="grid">

<div>
<label>لمبائی</label>
<input id="length" placeholder="مثلاً 40">
</div>

<div>
<label>تیرا</label>
<input id="tera" placeholder="ناپ">
</div>

<div>
<label>آستین</label>
<input id="sleeve" placeholder="ناپ">
</div>

<div>
<label>گلہ</label>
<input id="neck" placeholder="ناپ">
</div>

<div>
<label>چھاتی</label>
<input id="chest" placeholder="ناپ">
</div>

<div>
<label>کمر</label>
<input id="waist" placeholder="ناپ">
</div>

<div>
<label>دامن</label>
<input id="daman" placeholder="ناپ">
</div>

<div>
<label>شلوار لمبائی مکمل</label>
<input id="shalwarLength" placeholder="ناپ">
</div>

<div>
<label>پانچہ</label>
<input id="pancha" placeholder="ناپ">
</div>

</div>
</div>


<!-- COLOR -->
<div class="section">

<h2>🎨 کپڑے کا رنگ</h2>

<div class="color-row">

<input id="color" type="color" value="#000000">

<input id="colorName" placeholder="رنگ کا نام، مثلاً Black / کالا">

</div>

</div>


<!-- DESIGN -->
<div class="section">

<h2>✂️ ڈیزائن / آپشنز</h2>

<div class="options">

<div class="option">
<input type="checkbox" id="twoPiece">
<label for="twoPiece">ٹو پیس</label>
</div>

<div class="option">
<input type="checkbox" id="band">
<label for="band">بین</label>
</div>

<div class="option">
<input type="checkbox" id="roundDaman">
<label for="roundDaman">گول دامن</label>
</div>

<div class="option">
<input type="checkbox" id="squareDaman">
<label for="squareDaman">چورس دامن</label>
</div>

<div class="option">
<input type="checkbox" id="bothSides">
<label for="bothSides">دوبغل</label>
</div>

<div class="option">
<input type="checkbox" id="front">
<label for="front">سامنے</label>
</div>

<div class="option">
<input type="checkbox" id="shalwarPocket">
<label for="shalwarPocket">شلوار جیب</label>
</div>

<div class="option">
<input type="checkbox" id="tilaGoot">
<label for="tilaGoot">تیلا گوٹ</label>
</div>

<div class="option">
<input type="checkbox" id="fitCuff">
<label for="fitCuff">فیٹ کف</label>
</div>

<div class="option">
<input type="checkbox" id="simpleSleeve">
<label for="simpleSleeve">سادہ آستین</label>
</div>

<div class="option">
<input type="checkbox" id="cuffed">
<label for="cuffed">کف دار</label>
</div>

</div>
</div>


<button id="addOrder" class="add">
➕ Add Order — Pending میں بھیجیں
</button>

<div id="msg" class="msg"></div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom">

<div class="nav">

<a href="index.html"><i>🏠</i>Home</a>

<a href="add-order.html" class="active"><i>➕</i>Add Order</a>

<a href="customers.html"><i>👥</i>Customers</a>

<a href="new-users.html"><i>🆕</i>New Users</a>

<a href="history.html"><i>📋</i>History</a>

<a href="menu.html"><i>☰</i>Menu</a>

</div>

</div>


<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import{
getAuth,onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import{
getFirestore,collection,addDoc,serverTimestamp
}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

const $=id=>document.getElementById(id);

function val(id){
return $(id).value.trim();
}

function checked(id){
return $(id).checked;
}

onAuthStateChanged(auth,user=>{
if(!user){
location.replace("login.html");
return;
}
currentUser=user;
});


$("addOrder").onclick=async()=>{

if(!currentUser){
$("msg").textContent="پہلے Google سے Login کریں۔";
return;
}

const name=val("name");
const phone=val("phone");

if(!name){
$("msg").textContent="براہ کرم کسٹمر کا نام لکھیں۔";
return;
}

if(!phone){
$("msg").textContent="براہ کرم فون نمبر لکھیں۔";
return;
}

const btn=$("addOrder");
btn.disabled=true;
btn.textContent="⏳ Order محفوظ ہو رہا ہے...";

try{

/* CUSTOMER DATA */

const customer={

name:name,
phone:phone,
address:val("address"),

measurements:{
length:val("length"),
tera:val("tera"),
sleeve:val("sleeve"),
neck:val("neck"),
chest:val("chest"),
waist:val("waist"),
daman:val("daman"),
shalwarLength:val("shalwarLength"),
pancha:val("pancha")
},

userId:currentUser.uid,
createdAt:serverTimestamp()

};


/* SAVE CUSTOMER */

const customerRef=await addDoc(
collection(db,"users",currentUser.uid,"customers"),
customer
);


/* DESIGN DATA */

const designs={
twoPiece:checked("twoPiece"),
band:checked("band"),
roundDaman:checked("roundDaman"),
squareDaman:checked("squareDaman"),
bothSides:checked("bothSides"),
front:checked("front"),
shalwarPocket:checked("shalwarPocket"),
tilaGoot:checked("tilaGoot"),
fitCuff:checked("fitCuff"),
simpleSleeve:checked("simpleSleeve"),
cuffed:checked("cuffed")
};


/* ORDER */

await addDoc(
collection(db,"users",currentUser.uid,"orders"),
{

customerId:customerRef.id,

customerName:name,

phone:phone,

address:val("address"),

measurements:customer.measurements,

color:{
name:val("colorName"),
hex:$("color").value
},

designs:designs,

status:"pending",

createdAt:serverTimestamp(),

userId:currentUser.uid

}
);


$("msg").textContent=
"✅ کسٹمر محفوظ ہوگیا اور Order Pending میں شامل ہوگیا۔";

btn.textContent="✅ Order Added";


setTimeout(()=>{
location.href="pending.html";
},1200);


}catch(error){

console.error(error);

$("msg").textContent=
"❌ محفوظ کرنے میں مسئلہ: "+error.message;

btn.disabled=false;
btn.textContent="➕ Add Order — Pending میں بھیجیں";

}

};

</script>

</body>
  </html>
