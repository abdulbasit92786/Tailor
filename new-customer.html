<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نیا کسٹمر</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="top"><a class="back" href="add-order.html">→</a><div class="title"><h1>🆕 نیا یوزر</h1><p>کسٹمر + ناپ + ڈیزائن + کپڑے</p></div></div><div class="section"><h3>👤 کسٹمر معلومات</h3><label>نام *</label><input id="name"><label>فون نمبر *</label><input id="phone" type="tel"><label>پتہ</label><textarea id="address"></textarea></div><div class="section"><h3>📏 ناپ</h3><div class="grid"><div><label>لمبائی</label><input id="length"></div><div><label>تیرا</label><input id="tera"></div><div><label>آستین</label><input id="sleeve"></div><div><label>گلہ</label><input id="neck"></div><div><label>چھاتی</label><input id="chest"></div><div><label>کمر</label><input id="waist"></div><div><label>دامن</label><input id="daman"></div><div><label>شلوار لمبائی</label><input id="shalwarLength"></div><div><label>پانچہ</label><input id="pancha"></div></div></div><div class="section"><h3>✂️ ڈیزائن</h3><div class="options"><div class="opt"><input type="checkbox" id="twoPiece"> ٹو پیس</div><div class="opt"><input type="checkbox" id="band"> بین</div><div class="opt"><input type="checkbox" id="roundDaman"> گول دامن</div><div class="opt"><input type="checkbox" id="squareDaman"> چورس دامن</div><div class="opt"><input type="checkbox" id="bothSides"> دوبغل</div><div class="opt"><input type="checkbox" id="front"> سامنے جیب</div><div class="opt"><input type="checkbox" id="shalwarPocket"> شلوار جیب</div><div class="opt"><input type="checkbox" id="tilaGoot"> تیلا گوٹ</div><div class="opt"><input type="checkbox" id="fitCuff"> فٹ کف</div><div class="opt"><input type="checkbox" id="simpleSleeve"> سادہ آستین</div><div class="opt"><input type="checkbox" id="cuffed"> کف دار</div></div></div><div class="section"><h3>👕 کپڑے</h3><div id="pieces"></div><button id="addPiece" class="success" type="button">+ کپڑا شامل کریں</button></div><div class="section"><h3>💵 رقم</h3><label>فی کپڑا قیمت</label><input id="price" type="number" min="0" value="0"></div><button id="save" class="primary">💾 آرڈر Pending میں محفوظ کریں</button><p id="msg" class="muted"></p></main><nav><a href="index.html" class="">🏠<span>ہوم</span></a><a href="add-order.html" class="on">➕<span>نیا آرڈر</span></a><a href="customers.html" class="">👥<span>کسٹمرز</span></a><a href="new-users.html" class="">🆕<span>نیو یوزرز</span></a><a href="menu.html" class="">☰<span>مینو</span></a></nav><script type="module">import{requireUser,$,val,n,MEAS,DES,esc,money,dt,allOrders,allCustomers,db,stamp}from './app.js';import{collection,doc,getDocs,getDoc,addDoc,setDoc,updateDoc,deleteDoc,serverTimestamp}from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser();
const params=new URLSearchParams(location.search);const oldId=params.get('customerId');const saveOnly=params.get('saveOnly')==='1';
if(oldId){const c=(await getDoc(doc(db,'users',u.uid,'customers',oldId))).data(); if(c){document.querySelector('#name').value=c.name||'';document.querySelector('#phone').value=c.phone||'';document.querySelector('#address').value=c.address||'';const m=c.measurements||{};MEAS.forEach(([k])=>document.querySelector('#'+k).value=m[k]||'');const d=c.designs||{};DES.forEach(([k])=>document.querySelector('#'+k).checked=!!d[k]);}}const $p=id=>document.getElementById(id);let pieces=[];function addPiece(){const i=pieces.length+1;pieces.push({pieceNo:i,color:{name:'',hex:'#000000'}});render()}function render(){document.querySelector('#pieces').innerHTML=pieces.map((p,i)=>`<div class="piece"><b>کپڑا نمبر ${i+1}</b><label>رنگ</label><input class="pc" data-i="${i}" placeholder="مثلاً سفید، براؤن"><label>رنگ کوڈ</label><input class="ph" data-i="${i}" type="color" value="${p.color.hex}"></div>`).join('');document.querySelectorAll('.pc').forEach(x=>x.oninput=()=>pieces[x.dataset.i].color.name=x.value);document.querySelectorAll('.ph').forEach(x=>x.oninput=()=>pieces[x.dataset.i].color.hex=x.value)}addPiece();$p('addPiece').onclick=addPiece;document.querySelector('#save').onclick=async()=>{const name=val('name'),phone=val('phone');if(!name||!phone)return $p('msg').textContent='نام اور فون ضروری ہے';const measurements={};MEAS.forEach(([k])=>measurements[k]=val(k));const designs={};DES.forEach(([k])=>designs[k]=!!$p(k).checked);const customerId=oldId||doc(collection(db,'users',u.uid,'customers')).id;if(saveOnly&&!oldId){await setDoc(doc(db,'users',u.uid,'customers',customerId),{name,phone,address:val('address'),measurements,designs,customerType:'customer',status:'active',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href='customers.html';return}if(!oldId)await setDoc(doc(db,'users',u.uid,'customers',customerId),{name,phone,address:val('address'),measurements,designs,customerType:'new',status:'new',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});else await updateDoc(doc(db,'users',u.uid,'customers',customerId),{name,phone,address:val('address'),measurements,designs,updatedAt:serverTimestamp()});const price=n(val('price'));const ps=pieces.map((p,i)=>({pieceNo:i+1,color:p.color,measurements,designs,totalAmount:price,receivedAmount:0,remainingAmount:price,status:'pending',events:[{status:'pending',at:stamp()}]}));await addDoc(collection(db,'users',u.uid,'orders'),{customerId,customerName:name,phone,address:val('address'),pieces:ps,status:'pending',customerType:'new',createdAt:serverTimestamp(),createdAtIso:stamp(),updatedAt:serverTimestamp()});location.href='pending.html'};</script></body></html>
