<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer - Tailor Manager</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:linear-gradient(145deg,#020617,#0f172a);color:#fff;padding:16px 16px 100px}.app{max-width:480px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{width:46px;height:46px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff20;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:22px}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p,.sub{font-size:11px;color:#94a3b8;margin-top:4px}.section{margin-top:14px;padding:17px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14}h2{font-size:16px;margin-bottom:14px}label{display:block;font-size:12px;color:#cbd5e1;margin-bottom:6px}input{width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff;outline:0;margin-bottom:12px}.grid,.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photo{display:flex;align-items:center;gap:12px}.preview{width:78px;height:78px;border-radius:20px;background:#ffffff0d;display:grid;place-items:center;overflow:hidden;font-size:30px}.preview img{width:100%;height:100%;object-fit:cover}.pick{background:#6366f1;padding:10px 12px;border-radius:12px;font-size:11px;display:inline-block}#photo{display:none}.option input{display:none}.option label{padding:13px 7px;border:1px solid #ffffff18;background:#ffffff08;border-radius:13px;text-align:center}.option input:checked+label{background:#4f46e5;border-color:#818cf8}.save{width:100%;margin-top:18px;padding:16px;border:0;border-radius:17px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:bold;font-size:15px}.msg{text-align:center;min-height:25px;margin-top:10px;font-size:12px}@media(max-width:360px){.grid,.options{grid-template-columns:1fr}}</style></head><body><div class="app">
<div class="top"><a href="customers.html" class="back">→</a><div class="title"><h1 id="title">👤 نیا کسٹمر</h1><p id="sub">New Customer Profile</p></div></div>
<div class="section"><h2>👤 کسٹمر کی معلومات</h2><label>نام</label><input id="name"><label>فون نمبر</label><input id="phone" type="tel"><label>علاقہ / مکمل پتہ</label><input id="address"></div>
<div class="section"><h2>📷 تصویر</h2><div class="sub">اختیاری۔ تصویر کے لیے Firebase Storage استعمال ہوگا۔</div><div class="photo" style="margin-top:12px"><div class="preview" id="preview">👤</div><div><label class="pick" for="photo">📷 تصویر منتخب کریں</label><input id="photo" type="file" accept="image/*" capture="environment"></div></div></div>
<div class="section"><h2>📏 کسٹمر کا ناپ</h2><div class="sub">اوپر سے نیچے ترتیب</div><div class="grid"><div><label>لمبائی</label><input id="length"></div><div><label>تیرا</label><input id="tera"></div><div><label>آستین</label><input id="sleeve"></div><div><label>گلہ</label><input id="neck"></div><div><label>چھاتی</label><input id="chest"></div><div><label>کمر</label><input id="waist"></div><div><label>دامن</label><input id="daman"></div><div><label>شلوار لمبائی مکمل</label><input id="shalwarLength"></div><div><label>پانچہ</label><input id="pancha"></div></div></div>
<div class="section"><h2>✂️ مستقل ڈیزائن / پسند</h2><div class="options"><div class="option"><input id="twoPiece" type="checkbox"><label for="twoPiece">ٹو پیس</label></div><div class="option"><input id="band" type="checkbox"><label for="band">بین</label></div><div class="option"><input id="roundDaman" type="checkbox"><label for="roundDaman">گول دامن</label></div><div class="option"><input id="squareDaman" type="checkbox"><label for="squareDaman">چورس دامن</label></div><div class="option"><input id="bothSides" type="checkbox"><label for="bothSides">دوبغل</label></div><div class="option"><input id="front" type="checkbox"><label for="front">سامنے</label></div><div class="option"><input id="shalwarPocket" type="checkbox"><label for="shalwarPocket">شلوار جیب</label></div><div class="option"><input id="tilaGoot" type="checkbox"><label for="tilaGoot">تیلا گوٹ</label></div><div class="option"><input id="fitCuff" type="checkbox"><label for="fitCuff">فیٹ کف</label></div><div class="option"><input id="simpleSleeve" type="checkbox"><label for="simpleSleeve">سادہ آستین</label></div><div class="option"><input id="cuffed" type="checkbox"><label for="cuffed">کف دار</label></div></div></div>
<button id="save" class="save">💾 کسٹمر محفوظ کریں</button><div id="msg" class="msg"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,addDoc,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);let user,editId=new URLSearchParams(location.search).get("edit"),file=null,oldPhoto="";const $=x=>document.getElementById(x),V=x=>$(x).value.trim(),fields=["length","tera","sleeve","neck","chest","waist","daman","shalwarLength","pancha"],designs=["twoPiece","band","roundDaman","squareDaman","bothSides","front","shalwarPocket","tilaGoot","fitCuff","simpleSleeve","cuffed"];
onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html");user=u;if(editId)await loadEdit()});
async function loadEdit(){try{let s=await getDoc(doc(db,"users",user.uid,"customers",editId));if(!s.exists())return $("msg").textContent="❌ Customer نہیں ملا";let c=s.data(),m=c.measurements||{},d=c.designs||{};$("title").textContent="✏️ Customer Edit";$("sub").textContent="موجودہ معلومات تبدیل کریں";$("save").textContent="🔄 Customer Update کریں";$("name").value=c.name||"";$("phone").value=c.phone||"";$("address").value=c.address||"";oldPhoto=c.photo||"";if(oldPhoto)$("preview").innerHTML=`<img src="${oldPhoto}">`;fields.forEach(x=>$(x).value=m[x]||"");designs.forEach(x=>$(x).checked=!!d[x])}catch(e){$("msg").textContent="❌ Data لوڈ نہیں ہوا: "+e.message}}
function compress(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let max=700,w=i.width,h=i.height,q=Math.min(1,max/w,max/h);w=Math.round(w*q);h=Math.round(h*q);let c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);c.toBlob(b=>b?ok(b):no(new Error("Image failed")),"image/jpeg",.68)};i.src=r.result};r.readAsDataURL(f)})}
$("photo").onchange=e=>{file=e.target.files[0]||null;if(file){let r=new FileReader;r.onload=()=>$("preview").innerHTML=`<img src="${r.result}">`;r.readAsDataURL(file)}};
$("save").onclick=async()=>{let name=V("name"),phone=V("phone");if(!name||!phone)return $("msg").textContent="❌ نام اور فون نمبر ضروری ہیں";let b=$("save");b.disabled=true;b.textContent="⏳ محفوظ ہو رہا ہے...";try{let photo=oldPhoto;if(file){let blob=await compress(file),r=ref(storage,`customers/${user.uid}/${editId||Date.now()}.jpg`);await uploadBytes(r,blob,{contentType:"image/jpeg"});photo=await getDownloadURL(r)}let m={};fields.forEach(x=>m[x]=V(x));let d={};designs.forEach(x=>d[x]=$(x).checked);let data={name,phone,address:V("address"),measurements:m,designs:d,photo,userId:user.uid,updatedAt:serverTimestamp()};if(editId)await setDoc(doc(db,"users",user.uid,"customers",editId),data,{merge:true});else{let s=await getDocs(collection(db,"users",user.uid,"customers")),max=0;s.forEach(x=>max=Math.max(max,Number(x.data().accountNo||0)));data.accountNo=max+1;data.createdAt=serverTimestamp();await addDoc(collection(db,"users",user.uid,"customers"),data)}$("msg").textContent=editId?"✅ Customer Update ہوگیا":"✅ Customer محفوظ ہوگیا";setTimeout(()=>location.href="customers.html",800)}catch(e){console.error(e);$("msg").textContent="❌ محفوظ نہیں ہوا: "+e.message;b.disabled=false;b.textContent=editId?"🔄 Customer Update کریں":"💾 کسٹمر محفوظ کریں"}};
</script></body></html>
