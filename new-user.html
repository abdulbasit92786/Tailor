<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نیا آرڈر</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,addDoc,$,fields,designs,esc,value,checked,serverTimestamp,lang}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('new')+`<main class="wrap"><div class="hero"><h1>${en?'New Order':'نیا آرڈر'}</h1><p>${en?'Choose a new user or a saved customer. Saved details will fill automatically.':'نیا یوزر یا محفوظ کسٹمر منتخب کریں۔ محفوظ کسٹمر کا ڈیٹا خود بخود بھر جائے گا۔'}</p></div><div class="card form"><label>${en?'Order for':'آرڈر کس کے لیے؟'}<select id="type"><option value="new">${en?'New User':'نیا یوزر'}</option><option value="saved">${en?'Saved Customer':'محفوظ کسٹمر'}</option></select></label><div id="savedBox" class="hidden"><label>${en?'Select Saved Customer':'محفوظ کسٹمر منتخب کریں'}<select id="customer"><option value="">${en?'Select':'منتخب کریں'}</option></select></label></div><div class="grid2"><label>${en?'Name':'نام'}<input id="name"></label><label>${en?'Phone Number':'فون نمبر'}<input id="phone" inputmode="tel"></label></div><div class="grid2"><label>${en?'Area':'علاقہ'}<input id="area"></label><label>${en?'Clothes Quantity':'کپڑوں کی تعداد'}<input id="qty" type="number" min="1" value="1"></label></div><label>${en?'Address':'پتہ'}<textarea id="address"></textarea></label><h2 class="section-title">${en?'Measurements':'ناپ'}</h2><div class="measure-list">${fields.map(([k,ur,eng])=>`<div class="measure"><label>${en?eng:ur}</label><input id="m_${k}"></div>`).join('')}</div><h2 class="section-title">${en?'Design':'ڈیزائن'}</h2><div class="checks">${designs.map(([k,ur,eng])=>`<label class="check"><input id="d_${k}" type="checkbox">${en?eng:ur}</label>`).join('')}</div><div class="grid2"><label>${en?'Cloth Color':'کپڑے کا رنگ'}<input id="color"></label><label>${en?'Total Amount':'کل رقم'}<input id="amount" type="number" min="0"></label></div><button id="save" class="primary">${en?'Save to Pending':'آرڈر پینڈنگ میں محفوظ کریں'}</button><div id="msg" class="muted"></div></div></main>`;bindNav();let customers=[];try{const cs=await getDocs(collection(db,'users',u.uid,'customers'));customers=cs.docs.map(d=>({id:d.id,...d.data()}));$('customer').innerHTML='<option value="">'+(en?'Select':'منتخب کریں')+'</option>'+customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'-')} — ${esc(c.phone||'')}</option>`).join('')}catch(e){}function fill(c){if(!c)return;['name','phone','area','address'].forEach(k=>$(k).value=String(c[k]??''));fields.forEach(([k])=>$("m_"+k).value=String(c.measurements?.[k]??''));designs.forEach(([k])=>$("d_"+k).checked=!!c.designs?.[k])}$('type').onchange=()=>{$('savedBox').classList.toggle('hidden',$('type').value!=='saved')};$('customer').onchange=()=>fill(customers.find(c=>c.id===$('customer').value));const cid=new URLSearchParams(location.search).get('customer');if(cid){$('type').value='saved';$('savedBox').classList.remove('hidden');$('customer').value=cid;fill(customers.find(c=>c.id===cid))}$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;try{const measurements={};fields.forEach(([k])=>measurements[k]=value('m_'+k));const ds={};designs.forEach(([k])=>ds[k]=checked('d_'+k));const qty=Math.max(1,parseInt(value('qty'),10)||1);const isSaved=$('type').value==='saved';const clean={customerId:isSaved?String($('customer').value||''):null,customerType:isSaved?'saved':'new',name:value('name'),phone:value('phone'),area:value('area'),address:value('address'),quantity:qty,completedQuantity:0,color:value('color'),amount:Number($('amount').value)||0,measurements,designs:ds,status:'pending',createdAt:serverTimestamp()};if(!clean.name){throw new Error(en?'Name is required.':'نام ضروری ہے۔')}await addDoc(collection(db,'users',u.uid,'orders'),clean);location.href='pending.html'}catch(e){$('msg').textContent=(en?'Error: ':'مسئلہ: ')+e.message;btn.disabled=false}}});</script></body></html>
