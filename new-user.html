<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نیا آرڈر</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{auth,db,requireAuth,nav,$,collection,getDocs,addDoc,doc,getDocs as gd,serverTimestamp,fields,designs,esc}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('new')+`<main class="wrap"><div class="hero"><h1>نیا آرڈر</h1><p>محفوظ کسٹمر منتخب کریں یا نیا صارف درج کریں۔</p></div><div class="card form"><label>کسٹمر کی قسم<select id="type"><option value="new">نیا صارف</option><option value="saved">محفوظ کسٹمر</option></select></label><div id="savedBox" style="display:none"><label>محفوظ کسٹمر<select id="customer"><option value="">منتخب کریں</option></select></label></div><div class="row"><label>نام<input id="name"></label><label>فون نمبر<input id="phone"></label></div><div class="row"><label>علاقہ<input id="area"></label><label>کپڑوں کی تعداد<input id="qty" type="number" min="1" value="1"></label></div><label>پتہ<textarea id="address"></textarea></label><h2 class="section-title">ناپ</h2><div class="measure-list">${fields.map(([k,n])=>`<div class="measure"><label>${n}</label><input id="m_${k}"></div>`).join('')}</div><h2 class="section-title">ڈیزائن</h2><div class="checks">${designs.map(([k,n])=>`<label class="check"><input id="d_${k}" type="checkbox">${n}</label>`).join('')}</div><div class="row"><label>کپڑے کا رنگ<input id="color"></label><label>کل رقم<input id="amount" type="number" min="0"></label></div><button id="save" class="primary">آرڈر پینڈنگ میں محفوظ کریں</button><div id="msg" class="muted"></div></div></main>`;let customers=[];const cs=await getDocs(collection(db,'users',u.uid,'customers'));customers=cs.docs.map(d=>({id:d.id,...d.data()}));$('customer').innerHTML+='<option></option>'+customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'-')} — ${esc(c.phone||'')}</option>`).join('');$('type').onchange=()=>{$('savedBox').style.display=$('type').value==='saved'?'block':'none'};$('customer').onchange=()=>{const c=customers.find(x=>x.id===$('customer').value);if(!c)return;$('name').value=c.name||'';$('phone').value=c.phone||'';$('area').value=c.area||'';$('address').value=c.address||'';fields.forEach(([k])=>{if(c.measurements?.[k])$('m_'+k).value=c.measurements[k]});designs.forEach(([k])=>{$('d_'+k).checked=!!c.designs?.[k]})};$('save').onclick=async()=>{try{$('save').disabled=true;const measurements={};fields.forEach(([k])=>measurements[k]=$('m_'+k).value.trim());const ds={};designs.forEach(([k])=>ds[k]=$('d_'+k).checked);const isSaved=$('type').value==='saved';await addDoc(collection(db,'users',u.uid,'orders'),{customerId:isSaved?$('customer').value:null,customerType:isSaved?'saved':'new',name:$('name').value.trim(),phone:$('phone').value.trim(),area:$('area').value.trim(),address:$('address').value.trim(),quantity:Number($('qty').value)||1,color:$('color').value.trim(),amount:Number($('amount').value)||0,measurements,designs,status:'pending',createdAt:serverTimestamp()});$('msg').textContent='✓ آرڈر محفوظ ہو گیا';setTimeout(()=>location.href='pending.html',500)}catch(e){$('msg').textContent='مسئلہ: '+e.message;$('save').disabled=false}}});</script></body></html>
