<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نیا آرڈر</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{db,requireAuth,nav,bindNav,$,collection,getDocs,addDoc,updateDoc,doc,serverTimestamp,fields,designs,esc}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('new')+`<main class="wrap"><div class="hero"><h1>نیا آرڈر</h1><p>نیا یوزر یا محفوظ کسٹمر منتخب کریں۔ محفوظ کسٹمر کا ناپ خود آ جائے گا۔</p></div><div class="card form"><label>کسٹمر کی قسم<select id="type"><option value="new">نیا یوزر</option><option value="saved">محفوظ کسٹمر</option></select></label><div id="savedBox" style="display:none"><label>محفوظ کسٹمر<select id="customer"><option value="">منتخب کریں</option></select></label></div><div class="row"><label>نام<input id="name"></label><label>فون نمبر<input id="phone"></label></div><div class="row"><label>علاقہ<input id="area"></label><label>کپڑوں کی تعداد<input id="qty" type="number" min="1" value="1"></label></div><label>پتہ<textarea id="address"></textarea></label><h2 class="section-title">ناپ</h2><div class="measure-list">${fields.map(([k,u,e])=>`<div class="measure"><label>${u}</label><input id="m_${k}" placeholder="${u}"></div>`).join('')}</div><h2 class="section-title">ڈیزائن</h2><div class="checks">${designs.map(([k,u,e])=>`<label class="check"><input id="d_${k}" type="checkbox">${u}</label>`).join('')}</div><div class="row"><label>کپڑے کا رنگ<input id="color"></label><label>کل رقم<input id="amount" type="number" min="0"></label></div><button id="save" class="primary">آرڈر پینڈنگ میں محفوظ کریں</button><div id="msg" class="muted"></div></div></main>`;bindNav();let customers=[];try{const cs=await getDocs(collection(db,'users',u.uid,'customers'));customers=cs.docs.map(d=>({id:d.id,...d.data()}));$('customer').innerHTML='<option value="">منتخب کریں</option>'+customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'-')} — ${esc(c.phone||'')}</option>`).join('')}catch(e){}const params=new URLSearchParams(location.search);if(params.get('customer')){$('type').value='saved';$('savedBox').style.display='block';$('customer').value=params.get('customer');fill()};$('type').onchange=()=>{$('savedBox').style.display=$('type').value==='saved'?'block':'none'};$('customer').onchange=fill;function fill(){const c=customers.find(x=>x.id===$('customer').value);if(!c)return;$('name').value=c.name||'';$('phone').value=c.phone||'';$('area').value=c.area||'';$('address').value=c.address||'';fields.forEach(([k])=>$('m_'+k).value=c.measurements?.[k]||'');designs.forEach(([k])=>$('d_'+k).checked=!!c.designs?.[k])}$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;try{const measurements={};fields.forEach(([k])=>measurements[k]=$('m_'+k).value.trim());const ds={};designs.forEach(([k])=>ds[k]=$('d_'+k).checked);const saved=$('type').value==='saved';await addDoc(collection(db,'users',u.uid,'orders'),{customerId:saved?$('customer').value:null,customerType:saved?'saved':'new',name:$('name').value.trim(),phone:$('phone').value.trim(),area:$('area').value.trim(),address:$('address').value.trim(),quantity:Math.max(1,Number($('qty').value)||1),color:$('color').value.trim(),amount:Math.max(0,Number($('amount').value)||0),measurements,designs,status:'pending',completedQuantity:0,remainingQuantity:Math.max(1,Number($('qty').value)||1),createdAt:serverTimestamp()});$('msg').textContent='✓ آرڈر محفوظ ہو گیا';setTimeout(()=>location.href='pending.html',350)}catch(e){$('msg').textContent='مسئلہ: '+e.message;btn.disabled=false}}});</script></body></html>
