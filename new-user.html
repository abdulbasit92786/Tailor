<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نیا آرڈر</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,addDoc,$,fields,designs,esc,serverTimestamp}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('new')+`<main class="wrap"><div class="hero"><h1>نیا آرڈر</h1><p>نیا صارف یا محفوظ کسٹمر منتخب کریں۔</p></div><div class="card form"><label>آرڈر کس کے لیے؟<select id="type"><option value="new">نیا صارف</option><option value="saved">محفوظ کسٹمر</option></select></label><div id="savedBox" class="hidden"><label>محفوظ کسٹمر<select id="customer"><option value="">منتخب کریں</option></select></label></div><div class="grid2"><label>نام<input id="name"></label><label>فون نمبر<input id="phone"></label></div><div class="grid2"><label>علاقہ<input id="area"></label><label>کپڑوں کی تعداد<input id="qty" type="number" min="1" value="1"></label></div><label>پتہ<textarea id="address"></textarea></label><h2>ناپ</h2><div class="measure-list">${fields.map(([k,n])=>`<div class="measure"><label>${n}</label><input id="m_${k}"></div>`).join('')}</div><h2>ڈیزائن</h2><div class="checks">${designs.map(([k,n])=>`<label class="check"><input id="d_${k}" type="checkbox">${n}</label>`).join('')}</div><div class="grid2"><label>کپڑے کا رنگ<input id="color"></label><label>کل رقم<input id="amount" type="number" min="0"></label></div><button id="save" class="primary">آرڈر پینڈنگ میں محفوظ کریں</button><div id="msg" class="muted"></div></div></main>`;bindNav();let customers=[];try{const cs=await getDocs(collection(db,'users',u.uid,'customers'));customers=cs.docs.map(d=>({id:d.id,...d.data()}));customer.innerHTML='<option value="">منتخب کریں</option>'+customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'-')} — ${esc(c.phone||'')}</option>`).join('')}catch(e){}function fill(c){if(!c)return;name.value=c.name||'';phone.value=c.phone||'';area.value=c.area||'';address.value=c.address||'';fields.forEach(([k])=>m(k).value=c.measurements?.[k]||'');designs.forEach(([k])=>$('d_'+k).checked=!!c.designs?.[k])}function m(k){return $('m_'+k)}type.onchange=()=>{savedBox.classList.toggle('hidden',type.value!=='saved')};customer.onchange=()=>fill(customers.find(c=>c.id===customer.value));const cid=new URLSearchParams(location.search).get('customer');if(cid){type.value='saved';savedBox.classList.remove('hidden');customer.value=cid;fill(customers.find(c=>c.id===cid))}save.onclick=async()=>{try{save.disabled=true;const measurements={};fields.forEach(([k])=>measurements[k]=m(k).value.trim());const ds={};designs.forEach(([k])=>ds[k]=!!$('d_'+k).checked);const isSaved=type.value==='saved';const clean={customerId:isSaved?customer.value:null,customerType:isSaved?'saved':'new',name:name.value.trim(),phone:phone.value.trim(),area:area.value.trim(),address:address.value.trim(),quantity:Math.max(1,Number(qty.value)||1),completedQuantity:0,color:color.value.trim(),amount:Number(amount.value)||0,measurements,designs,status:'pending',createdAt:serverTimestamp()};await addDoc(collection(db,'users',u.uid,'orders'),clean);location.href='pending.html'}catch(e){msg.textContent='مسئلہ: '+e.message;save.disabled=false}}});</script></body></html>
