<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Edit</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="hero"><h2>✏️ کسٹمر میں ترمیم</h2><p>نام، نمبر، پتہ، ناپ اور ڈیزائن</p></div><div class="section"><label>نام</label><input id="name"><label>فون نمبر</label><input id="phone"><label>پتہ</label><textarea id="address"></textarea></div><div class="section"><h3>📏 ناپ</h3><div class="grid" id="m"></div></div><div class="section"><h3>✂️ ڈیزائن</h3><div class="options" id="d"></div></div><button id="save" class="primary">💾 محفوظ کریں</button><p id="msg" class="muted"></p></main><script type="module">import{requireUser,$,MEAS,DES,db}from'./app.js';import{doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser(),id=new URLSearchParams(location.search).get('edit');if(!id)location.href='customers.html';const c=(await getDoc(doc(db,'users',u.uid,'customers',id))).data();$('#name').value=c?.name||'';$('#phone').value=c?.phone||'';$('#address').value=c?.address||'';$('#m').innerHTML=MEAS.map(([k,l])=>`<div><label>${l}</label><input id="m_${k}" value="${c?.measurements?.[k]||''}"></div>`).join('');$('#d').innerHTML=DES.map(([k,l])=>`<div class="opt"><input id="d_${k}" type="checkbox" ${c?.designs?.[k]?'checked':''}> ${l}</div>`).join('');$('#save').onclick=async()=>{const measurements={};MEAS.forEach(([k])=>measurements[k]=$('#m_'+k).value.trim());const designs={};DES.forEach(([k])=>designs[k]=$('#d_'+k).checked);await updateDoc(doc(db,'users',u.uid,'customers',id),{name:$('#name').value.trim(),phone:$('#phone').value.trim(),address:$('#address').value.trim(),measurements,designs,updatedAt:serverTimestamp()});$('#msg').textContent='✅ محفوظ ہوگیا';setTimeout(()=>location.href='customers.html',600)};</script></body></html>
