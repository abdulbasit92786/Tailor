<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تلاش</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,$,esc,fields,designs}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('')+`<main class="wrap"><div class="hero"><h1>تلاش</h1><p>نام، فون نمبر، علاقہ یا آرڈر کی معلومات سے تلاش کریں۔</p></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" placeholder="نام، فون نمبر یا علاقہ"></div><div id="list"></div></div></main>`;bindNav();let customers=[],orders=[];const [cs,os]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);customers=cs.docs.map(x=>({id:x.id,...x.data()}));orders=os.docs.map(x=>({id:x.id,...x.data()}));function render(){let q=$('q').value.trim().toLowerCase();let a=customers.filter(c=>[c.name,c.phone,c.area,c.address].some(v=>String(v||'').toLowerCase().includes(q)));let b=orders.filter(o=>[o.name,o.phone,o.area,o.address,o.color].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=(a.length?'<h3>محفوظ کسٹمرز</h3>'+a.map(c=>`<div class="card"><b>${esc(c.name||'-')}</b><div class="muted">${esc(c.phone||'')} • ${esc(c.area||'')}</div><div class="muted">${esc(c.address||'')}</div></div>`).join(''):'')+(b.length?'<h3>آرڈرز</h3>'+b.map(o=>`<div class="card"><b>${esc(o.name||'-')}</b><div class="muted">${esc(o.phone||'')} • ${esc(o.area||'')}</div><div class="pill">${esc(o.status||'pending')}</div> <span class="pill">${Number(o.quantity)||1} کپڑے</span></div>`).join(''):'')||'<div class="empty">کوئی نتیجہ نہیں ملا</div>'}q.oninput=render;render()});</script></body></html>
