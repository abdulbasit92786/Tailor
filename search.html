<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تلاش</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff">
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("pwabuilder-sw.js").catch(()=>{});}</script></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,$,esc,lang}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('')+`<main class="wrap"><div class="hero"><h1>${en?'Search':'تلاش'}</h1><p>${en?'Search customers and orders by name, phone, area or address.':'نام، فون، علاقہ یا پتہ سے کسٹمر اور آرڈر تلاش کریں۔'}</p></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" autofocus placeholder="${en?'Type name, phone or area...':'نام، فون یا علاقہ لکھیں...'}"></div><div id="list"></div></div></main>`;bindNav();let customers=[],orders=[];try{const [cs,os]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);customers=cs.docs.map(x=>({id:x.id,...x.data()}));orders=os.docs.map(x=>({id:x.id,...x.data()}));render()}catch(e){$('list').innerHTML=`<div class="empty">${en?'Could not load search data.':'تلاش کا ڈیٹا لوڈ نہیں ہو سکا۔'}</div>`}function render(){const q=$('q').value.toLowerCase().trim();const a=customers.filter(c=>[c.name,c.phone,c.area,c.address].some(v=>String(v??'').toLowerCase().includes(q)));const b=orders.filter(o=>[o.name,o.phone,o.area,o.address,o.color].some(v=>String(v??'').toLowerCase().includes(q)));$('list').innerHTML=(a.length?`<h3>${en?'Saved Customers':'محفوظ کسٹمرز'}</h3>`+a.map(c=>`<article class="card"><a class="small-link" href="new-user.html?customer=${encodeURIComponent(c.id)}">${esc(c.name||'-')}</a><div class="muted">📞 ${esc(c.phone||'-')} • 📍 ${esc(c.area||'-')}</div></article>`).join(''):'')+(b.length?`<h3>${en?'Orders':'آرڈرز'}</h3>`+b.map(o=>`<article class="card"><b>${esc(o.name||'-')}</b><div class="muted">📞 ${esc(o.phone||'-')} • 📍 ${esc(o.area||'-')}</div><span class="pill">${esc(o.status||'pending')}</span> <span class="pill">${Number(o.quantity)||1} ${en?'clothes':'کپڑے'}</span></article>`).join(''):'')||`<div class="empty">${en?'No results found.':'کوئی نتیجہ نہیں ملا۔'}</div>`}$('q').oninput=render});</script></body></html>
