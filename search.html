<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Arial,"Segoe UI",sans-serif;min-height:100vh;color:#fff;padding:14px 14px 95px;background:radial-gradient(circle at 10% 0,#334155 0,transparent 34%),radial-gradient(circle at 100% 100%,#312e81 0,transparent 40%),linear-gradient(145deg,#020617,#0f172a)}button,input{font:inherit}.app{max-width:520px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#ffffff10;border:1px solid #ffffff18;color:#fff;text-decoration:none;font-size:21px}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:10px;color:#94a3b8;margin-top:4px}.search{width:100%;padding:14px;border-radius:16px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;outline:none;font-size:14px}.search:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f122}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat{padding:11px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff12;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:#94a3b8}.msg{text-align:center;min-height:20px;margin:8px 0;font-size:11px;color:#a7f3d0}.card{margin-bottom:10px;border-radius:18px;background:#ffffff0b;border:1px solid #ffffff14;overflow:hidden}.head{padding:13px;display:flex;gap:10px;align-items:center}.icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:19px}.info{flex:1;min-width:0}.name{font-size:14px;font-weight:700}.meta{font-size:9px;color:#94a3b8;line-height:1.7;margin-top:3px}.badge{font-size:8px;padding:5px 7px;border-radius:8px;background:#ffffff10;color:#cbd5e1}.details{border-top:1px solid #ffffff10;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.d{padding:8px;border-radius:9px;background:#0003;font-size:9px;color:#cbd5e1}.d b{display:block;color:#fff;margin-bottom:3px}.empty{padding:35px 15px;text-align:center;border-radius:18px;background:#ffffff09;border:1px solid #ffffff12;color:#94a3b8}.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;background:#020617f4;border-top:1px solid #ffffff12;backdrop-filter:blur(18px);z-index:10}.nav{height:100%;max-width:520px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}.nav a{color:#94a3b8;text-decoration:none;font-size:8px;text-align:center;direction:rtl}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}.nav .active{color:#fff}@media(max-width:360px){.row{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<div class="top"><a class="btn" href="index.html">←</a><div class="title"><h1>🔍 Search</h1><p>Customers اور تمام Orders تلاش کریں</p></div><a class="btn" href="index.html">⌂</a></div>
<input id="search" class="search" autofocus placeholder="نام، موبائل، Account، Order، رنگ یا تعداد تلاش کریں" autocomplete="off">
<div class="stats"><div class="stat"><b id="customers">0</b><span>Customers</span></div><div class="stat"><b id="orders">0</b><span>Orders</span></div></div><div id="msg" class="msg"></div><div id="list"><div class="empty">⏳ Data لوڈ ہو رہا ہے...</div></div></div>
<div class="bottom"><div class="nav"><a href="index.html"><i>🏠</i>Home</a><a href="add-order.html"><i>➕</i>Add Order</a><a href="customers.html"><i>👥</i>Customers</a><a href="new-users.html"><i>🆕</i>New Users</a><a href="menu.html"><i>☰</i>Menu</a></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user,customers=[],orders=[];const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");const dt=v=>{if(!v)return"-";if(v?.toDate)return v.toDate().toLocaleString("ur-PK");if(v?.seconds)return new Date(v.seconds*1000).toLocaleString("ur-PK");const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString("ur-PK")};
function status(o){let s=String(o.status||o.orderStatus||"pending").toLowerCase();if(s.includes("deliver"))return"Delivered";if(s.includes("ready"))return"Ready In Shop";if(s.includes("cancel"))return"Cancelled";if(s.includes("complete"))return"Completed";return"Pending"}
function render(){const q=$("search").value.toLowerCase().trim();const rows=[];orders.forEach(o=>{const c=customers.find(x=>x.id===o.customerId)||{};const vals=[o.customerName,o.phone,o.address,o.accountNo,o.orderNo,o.orderNumber,o.id,o.quantity,o.qty,o.pieces,o.color?.name,o.color?.hex,o.colour,o.colorName,status(o),c.name,c.phone,c.address,c.accountNo];if(!q||vals.some(v=>String(v??"").toLowerCase().includes(q)))rows.push({o,c});});$("customers").textContent=q?new Set(rows.map(x=>x.c.id||x.o.customerId||x.o.customerName)).size:customers.length;$("orders").textContent=rows.length;const list=$("list");if(!rows.length){list.innerHTML='<div class="empty"><strong>🔍 کوئی نتیجہ نہیں ملا</strong><br>دوسرا نام، موبائل، Order، رنگ یا Account نمبر آزمائیں۔</div>';return}list.innerHTML=rows.map(({o,c})=>{const color=o.color?.name||o.colour||o.colorName||"-",qty=Number(o.quantity||o.qty||o.pieces||1),name=o.customerName||c.name||"-",phone=o.phone||c.phone||"-",address=o.address||c.address||"-";return `<div class="card"><div class="head"><div class="icon">🧵</div><div class="info"><div class="name">${esc(name)}</div><div class="meta">📱 ${esc(phone)}<br>📍 ${esc(address)}<br>🎨 ${esc(color)} · 👕 ${qty} Piece · 🧾 #${esc(o.orderNo||o.orderNumber||o.id)}</div></div><div class="badge">${esc(status(o))}</div></div><div class="details"><div class="row"><div class="d"><b>Account No.</b>${esc(o.accountNo||c.accountNo||"-")}</div><div class="d"><b>Order Date</b>${esc(dt(o.orderDate||o.createdAt))}</div><div class="d"><b>Color</b>${esc(color)}</div><div class="d"><b>Quantity</b>${qty} Piece${qty===1?"":"s"}</div><div class="d"><b>Total</b>Rs ${Number(o.totalAmount??o.totalPrice??o.amount??o.price??0).toLocaleString("en-PK")}</div><div class="d"><b>Received</b>Rs ${Number(o.paymentReceivedAmount??o.amountReceived??o.receivedAmount??o.paidAmount??o.received??0).toLocaleString("en-PK")}</div><div class="d"><b>Remaining</b>Rs ${Math.max(0,Number(o.totalAmount??o.totalPrice??o.amount??o.price??0)-Number(o.paymentReceivedAmount??o.amountReceived??o.receivedAmount??o.paidAmount??o.received??0)).toLocaleString("en-PK")}</div><div class="d"><b>Status</b>${esc(status(o))}</div></div></div></div>`}).join("")}
$("search").oninput=render;onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;try{const[cs,os]=await Promise.all([getDocs(collection(db,"users",u.uid,"customers")),getDocs(collection(db,"users",u.uid,"orders"))]);customers=cs.docs.map(d=>({id:d.id,...d.data()}));orders=os.docs.map(d=>({id:d.id,...d.data()}));$("customers").textContent=customers.length;$("orders").textContent=orders.length;$("msg").textContent="";render()}catch(e){$("msg").textContent="❌ Data load نہیں ہو سکا: "+e.message}});
</script></body></html>
