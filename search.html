<!doctype html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search • Tailor Manager</title><style>body{margin:0;padding:16px;font-family:Arial;color:#fff;background:linear-gradient(145deg,#020617,#0f172a);min-height:100vh}.app{max-width:520px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.back{font-size:22px;color:#fff;text-decoration:none}input{width:100%;padding:14px;border-radius:15px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;box-sizing:border-box;margin:18px 0}.card{padding:13px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff14;margin:9px 0}.muted{color:#94a3b8;font-size:11px}</style></head><body><div class="app"><div class="top"><a class="back" href="index.html">→</a><h2>🔍 Search</h2><span></span></div><input id="q" placeholder="نام، فون یا Order ID تلاش کریں"><div id="list" class="muted">Search کے لیے لکھیں...</div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let orders=[];const q=document.getElementById('q'),list=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));q.oninput=()=>{const x=q.value.trim().toLowerCase();if(!x){list.textContent='Search کے لیے لکھیں...';return}const r=orders.filter(o=>[o.customerName,o.phone,o.id,o.accountNo].some(v=>String(v??'').toLowerCase().includes(x)));list.innerHTML=r.length?r.map(o=>`<div class="card"><b>${esc(o.customerName||'-')}</b><div class="muted">📱 ${esc(o.phone||'-')} • #${esc(o.id.slice(-6))}<br>Status: ${esc(o.status||'-')}</div></div>`).join(''):'کوئی Order نہیں ملا'};onAuthStateChanged(auth,async u=>{if(!u)return location.replace('login.html');const s=await getDocs(collection(db,'users',u.uid,'orders'));orders=s.docs.map(d=>({id:d.id,...d.data()}))});</script></body></html>
