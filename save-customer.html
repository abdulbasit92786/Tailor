<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفوظ کسٹمر</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff">
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("pwabuilder-sw.js").catch(()=>{});}</script></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,addDoc,serverTimestamp,$,fields,designs,value,checked,normalizeMeasurements,normalizeDesigns,lang}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>${en?'Add Saved Customer':'محفوظ کسٹمر شامل کریں'}</h1><p>${en?'Save the customer until you choose to edit or delete them.':'یہ معلومات آپ کی مرضی سے edit یا delete کرنے تک محفوظ رہیں گی۔'}</p></div><div class="card form"><div class="grid2"><label>${en?'Name':'نام'}<input id="name"></label><label>${en?'Phone Number':'فون نمبر'}<input id="phone" inputmode="tel"></label></div><div class="grid2"><label>${en?'Area':'علاقہ'}<input id="area"></label><label>${en?'Address':'پتہ'}<input id="address"></label></div><h2 class="section-title">${en?'Measurements':'ناپ'}</h2><div class="measure-list">${fields.map(([k,ur,eng])=>`<div class="measure"><label>${en?eng:ur}</label><input id="m_${k}"></div>`).join('')}</div><h2 class="section-title">${en?'Design':'ڈیزائن'}</h2><div class="checks">${designs.map(([k,ur,eng])=>`<label class="check"><input id="d_${k}" type="checkbox">${en?eng:ur}</label>`).join('')}</div><button class="primary" id="save">${en?'Save Customer':'محفوظ کریں'}</button><div id="msg" class="muted"></div></div></main>`;bindNav();$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;try{const measurements={};fields.forEach(([k])=>measurements[k]=value('m_'+k));const ds={};designs.forEach(([k])=>ds[k]=checked('d_'+k));const data={name:value('name'),phone:value('phone'),area:value('area'),address:value('address'),measurements,designs:ds,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};await addDoc(collection(db,'users',u.uid,'customers'),data);location.href='customers.html'}catch(e){$('msg').textContent=(en?'Error: ':'مسئلہ: ')+e.message;btn.disabled=false}}});</script></body></html>
