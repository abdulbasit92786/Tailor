<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کسٹمر محفوظ کریں</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,addDoc,serverTimestamp,$,fields,designs}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>نیا محفوظ کسٹمر</h1><p>یہ معلومات آپ کی مرضی سے delete کرنے تک محفوظ رہیں گی۔</p></div><div class="card form"><div class="grid2"><label>نام<input id="name"></label><label>فون نمبر<input id="phone"></label></div><div class="grid2"><label>علاقہ<input id="area"></label><label>پتہ<input id="address"></label></div><h2 class="section-title">ناپ</h2><div class="measure-list">${fields.map(([k,n])=>`<div class="measure"><label>${n}</label><input id="m_${k}"></div>`).join('')}</div><h2 class="section-title">ڈیزائن</h2><div class="checks">${designs.map(([k,n])=>`<label class="check"><input id="d_${k}" type="checkbox">${n}</label>`).join('')}</div><button class="primary" id="save">محفوظ کریں</button><div id="msg" class="muted"></div></div></main>`;bindNav();save.onclick=async()=>{try{save.disabled=true;const measurements={};fields.forEach(([k])=>measurements[k]=$('m_'+k).value.trim());const ds={};designs.forEach(([k])=>ds[k]=!!$('d_'+k).checked);await addDoc(collection(db,'users',u.uid,'customers'),{name:name.value.trim(),phone:phone.value.trim(),area:area.value.trim(),address:address.value.trim(),measurements,designs,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href='customers.html'}catch(e){msg.textContent='مسئلہ: '+e.message;save.disabled=false}}});</script></body></html>
