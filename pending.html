<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پینڈنگ</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{auth,db,requireAuth,nav,$,collection,getDocs,updateDoc,doc,esc,fields,designs}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('pending')+`<main class="wrap"><div class="hero"><h1>پینڈنگ آرڈرز</h1><p>ہر آرڈر میں نام، رابطہ، ناپ، ڈیزائن اور کپڑوں کی تعداد صاف نظر آئے گی۔</p></div><div id="list"></div></main>`;async function load(){const s=await getDocs(collection(db,'users',u.uid,'orders'));const a=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>['pending',''].includes(String(o.status||'pending')));$('list').innerHTML=a.length?a.map(o=>`<article class="card order"><div class="order-head"><div><b style="font-size:20px">${esc(o.name||'-')}</b><div class="muted">${o.customerType==='new'?'🆕 نیا صارف':'👤 محفوظ کسٹمر'} • ${esc(o.phone||'')} • ${esc(o.area||'')}</div><div class="muted">پتہ: ${esc(o.address||'-')}</div></div><span class="badge">${Number(o.quantity)||1} کپڑے</span></div><div class="card" style="margin-top:14px;background:#f8fafc"><b>ناپ</b><div class="detail">${fields.map(([k,n])=>`${n}: ${esc(o.measurements?.[k]||'-')}`).join('\n')}</div><b>ڈیزائن</b><div class="detail">${designs.filter(([k])=>o.designs?.[k]).map(([,n])=>n).join('، ')||'-'}</div><div class="muted">رنگ: ${esc(o.color||'-')}</div></div><button class="primary complete" data-id="${esc(o.id)}" style="margin-top:12px">✓ کپڑا مکمل کریں</button></article>`).join(''):'<div class="card empty">ابھی کوئی پینڈنگ آرڈر نہیں</div>';$('list').querySelectorAll('.complete').forEach(b=>b.onclick=async()=>{b.disabled=true;await updateDoc(doc(db,'users',u.uid,'orders',b.dataset.id),{status:'ready',readyAt:new Date().toISOString()});load()})}load()});</script></body></html>
