<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pending Orders - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Arial,"Segoe UI",sans-serif;min-height:100vh;color:#fff;padding:16px 16px 105px;background:radial-gradient(circle at top left,#334155 0,transparent 35%),radial-gradient(circle at bottom right,#312e81 0,transparent 40%),linear-gradient(145deg,#020617,#0f172a)}button,input{font-family:inherit}.app{max-width:480px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top-btn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;text-decoration:none;color:#fff;background:#ffffff12;border:1px solid #ffffff20;font-size:20px}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#94a3b8;margin-top:4px}.hero{padding:18px;border-radius:23px;background:linear-gradient(135deg,#b45309,#f59e0b);box-shadow:0 15px 35px #0005;margin-bottom:13px}.hero-top{display:flex;align-items:center;gap:12px}.hero-icon{font-size:34px}.hero h2{font-size:18px}.hero p{font-size:10px;color:#fff9;margin-top:4px}.big-count{font-size:35px;font-weight:800;margin-top:12px}.big-count span{font-size:11px;font-weight:400}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{padding:12px 7px;text-align:center;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff12}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:#94a3b8}.search{width:100%;padding:14px 15px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:13px;margin-bottom:9px}.search:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b18}.search::placeholder{color:#718096}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:5px}.filter{white-space:nowrap;border:1px solid #ffffff14;background:#ffffff08;color:#94a3b8;padding:8px 11px;border-radius:12px;font-size:10px}.filter.active{background:#f59e0b22;color:#fbbf24;border-color:#f59e0b55}.msg{text-align:center;min-height:20px;font-size:11px;color:#a7f3d0;margin:5px 0}.card{margin-bottom:11px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;box-shadow:0 10px 25px #0004;overflow:hidden}.card-head{padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}.avatar{width:48px;height:48px;min-width:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:20px}.main{flex:1;min-width:0}.name{font-size:14px;font-weight:bold;margin-bottom:4px}.meta{font-size:10px;color:#94a3b8;line-height:1.7}.order-no{font-size:9px;background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b33;padding:5px 7px;border-radius:9px;white-space:nowrap}.summary{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}.pill{font-size:9px;padding:5px 7px;border-radius:9px;background:#ffffff08;border:1px solid #ffffff10;color:#cbd5e1}.pill.new{color:#c4b5fd;background:#8b5cf620}.pill.old{color:#38bdf8;background:#0ea5e920}.details{display:none;border-top:1px solid #ffffff12;padding:14px}.open .details{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{padding:9px;border-radius:11px;background:#0003;font-size:10px;color:#cbd5e1}.box b{display:block;color:#fff;margin-bottom:3px;font-size:9px}.color{display:flex;align-items:center;gap:8px;margin:10px 0;padding:9px;border-radius:11px;background:#ffffff07;font-size:10px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid #fff3}.measure-title{font-size:12px;font-weight:bold;margin:14px 0 8px}.measure{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.m{padding:8px 5px;text-align:center;border-radius:10px;background:#0003;font-size:9px;color:#cbd5e1}.m b{display:block;color:#fff;margin-bottom:3px}.designs{margin-top:8px}.tag{display:inline-block;padding:6px 8px;margin:2px;border-radius:9px;background:#6366f122;border:1px solid #6366f133;color:#c7d2fe;font-size:9px}.actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #ffffff12}.btn{flex:1;border:0;border-radius:12px;padding:12px;color:#fff;font-weight:bold;font-size:11px;cursor:pointer}.complete{background:linear-gradient(135deg,#22c55e,#15803d)}.delete{background:linear-gradient(135deg,#ef4444,#991b1b)}.btn:active{transform:scale(.97)}.empty{padding:35px 15px;text-align:center;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:7px}.bottom{position:fixed;left:0;right:0;bottom:0;height:75px;background:#020617f5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}.nav a{text-decoration:none;color:#94a3b8;font-size:9px;text-align:center;min-width:45px;direction:rtl}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}.nav .active i{filter:drop-shadow(0 0 6px #f59e0b)}@media(max-width:360px){.grid{grid-template-columns:1fr}.measure{grid-template-columns:repeat(2,1fr)}.nav a{font-size:8px;min-width:40px}.nav i{font-size:18px}}
</style></head>
<body><div class="app">
<div class="top"><a href="index.html" class="top-btn">←</a><div class="title"><h1>🧵 Pending Orders</h1><p>زیرِ سلائی تمام آرڈرز</p></div><a href="search.html" class="top-btn">🔍</a></div>
<div class="hero"><div class="hero-top"><div class="hero-icon">🧵</div><div><h2>Pending کپڑے</h2><p>جن آرڈرز کی سلائی ابھی مکمل نہیں ہوئی</p></div></div><div class="big-count" id="totalPending">0 <span>Orders</span></div></div>
<div class="stats"><div class="stat"><b id="customerCount">0</b><span>Customers</span></div><div class="stat"><b id="newCount">0</b><span>New Users</span></div><div class="stat"><b id="oldCount">0</b><span>Saved Customers</span></div></div>
<input id="search" class="search" type="search" placeholder="🔍 نام، نمبر، Account No. یا Order تلاش کریں" autocomplete="off">
<div class="filters"><button class="filter active" data-filter="all">سب</button><button class="filter" data-filter="new">New Users</button><button class="filter" data-filter="old">Saved Customers</button></div>
<div id="msg" class="msg"></div><div id="list"><div class="empty"><strong>⏳ Pending Orders لوڈ ہو رہے ہیں...</strong>براہ کرم انتظار کریں۔</div></div></div>
<div class="bottom"><div class="nav"><a href="index.html"><i>🏠</i>Home</a><a href="add-order.html"><i>➕</i>Add Order</a><a href="customers.html"><i>👥</i>Customers</a><a href="new-users.html"><i>🆕</i>New Users</a><a href="menu.html"><i>☰</i>Menu</a></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:586357e9e696a9652ffd22"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,orders=[],customers=[],active="all";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function dateVal(v){if(!v)return null;if(v?.toDate)return v.toDate();if(v?.seconds)return new Date(v.seconds*1000);const d=new Date(v);return isNaN(d)?null:d}function dateText(v){const d=dateVal(v);return d?d.toLocaleDateString("ur-PK",{year:"numeric",month:"short",day:"numeric"}):"-"}
function sourceOf(o,c){const s=String(o.customerType||o.customerSource||o.source||c?.customerType||c?.customerSource||c?.source||"").toLowerCase();if(s.includes("new"))return"new";if(s.includes("exist")||s.includes("old")||s.includes("saved"))return"old";return c?.isNewUser===true?"new":"old"}
const fields=[["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],["chest","چھاتی"],["waist","کمر"],["daman","دامن"],["shalwarLength","شلوار لمبائی"],["panja","پانچہ"]];const names={daman:"دامن",pocketDouble:"ڈبل جیب",pocketFront:"سامنے جیب",pocketSide:"سائیڈ جیب",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffSleeve:"کف دار آستین",tops:"ٹوپس",band:"بین"};
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;await load()});
async function load(){try{$("msg").textContent="⏳ Orders لوڈ ہو رہے ہیں...";const[os,cs]=await Promise.all([getDocs(collection(db,"users",user.uid,"orders")),getDocs(collection(db,"users",user.uid,"customers"))]);customers=cs.docs.map(d=>({id:d.id,...d.data()}));orders=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>String(o.status||"pending").toLowerCase()==="pending");orders.sort((a,b)=>(dateVal(b.createdAtIso||b.createdAt)?.getTime()||0)-(dateVal(a.createdAtIso||a.createdAt)?.getTime()||0));$("msg").textContent="";render()}catch(e){console.error(e);$("msg").textContent="❌ Data لوڈ نہیں ہو سکا: "+e.message}}
function render(){const q=$("search").value.toLowerCase().trim();let data=orders.map(o=>({...o,_customer:customers.find(c=>c.id===o.customerId)}));if(active!=="all")data=data.filter(o=>sourceOf(o,o._customer)===active);if(q)data=data.filter(o=>[o.customerName,o.customerPhone,o.customerNo,o.colorName,o.id].some(v=>String(v||"").toLowerCase().includes(q)));$("totalPending").innerHTML=`${data.length} <span>Orders</span>`;$("customerCount").textContent=new Set(data.map(o=>o.customerId||`${o.customerName}|${o.customerPhone}`)).size;$("newCount").textContent=data.filter(o=>sourceOf(o,o._customer)==="new").length;$("oldCount").textContent=data.filter(o=>sourceOf(o,o._customer)==="old").length;const list=$("list");list.innerHTML="";if(!data.length){list.innerHTML=`<div class="empty"><strong>✅ Pending میں کوئی Order نہیں</strong>تمام کپڑے اس وقت Pending میں نہیں ہیں۔</div>`;return}data.forEach((o,i)=>{const c=o._customer||{},src=sourceOf(o,c),m=o.measurements||{},d=o.design||{},colorHex=/^#[0-9a-f]{3,8}$/i.test(String(o.colorHex||""))?o.colorHex:"#475569",tags=Object.keys(names).filter(k=>d[k]).map(k=>`<span class="tag">${esc(names[k])}</span>`).join(""),card=document.createElement("div");card.className="card";card.innerHTML=`<div class="card-head"><div class="avatar">👤</div><div class="main"><div class="name">${esc(o.customerName||c.name||"نام نہیں")}</div><div class="meta">📱 ${esc(o.customerPhone||c.phone||"-")}<br>📅 ${dateText(o.createdAtIso||o.createdAt)}</div></div><div class="order-no">#${i+1}</div></div><div class="summary"><span class="pill">🧵 Order</span><span class="pill ${src}">${src==="new"?"🆕 New User":"👤 Saved Customer"}</span><span class="pill">📅 ${dateText(o.createdAtIso||o.createdAt)}</span></div><div class="details"><div class="grid"><div class="box"><b>👤 نام</b>${esc(o.customerName||c.name||"-")}</div><div class="box"><b>📱 فون</b>${esc(o.customerPhone||c.phone||"-")}</div><div class="box"><b>🔢 Account No.</b>${esc(o.customerNo||c.customerNo||"-")}</div><div class="box"><b>📍 پتہ</b>${esc(o.customerArea||c.area||"-")}</div><div class="box"><b>📅 Order Date</b>${dateText(o.createdAtIso||o.createdAt)}</div><div class="box"><b>🚚 Delivery Date</b>${dateText(o.deliveryDate)}</div></div><div class="color"><span class="dot" style="background:${esc(colorHex)}"></span><span>کپڑے کا رنگ: <b>${esc(o.colorName||"رنگ درج نہیں")}</b></span></div><div class="measure-title">📏 کپڑوں کے ناپ</div><div class="measure">${fields.map(x=>`<div class="m"><b>${x[1]}</b>${esc(m[x[0]]||"-")}</div>`).join("")}</div><div class="measure-title">✂️ Design</div><div class="designs">${tags||'<span style="color:#64748b;font-size:10px">کوئی خاص Design محفوظ نہیں</span>'}</div><div class="measure-title">💰 Payment</div><div class="grid"><div class="box"><b>کل قیمت</b>Rs ${Number(o.totalPrice||0).toLocaleString("en-PK")}</div><div class="box"><b>وصول</b>Rs ${Number(o.received||0).toLocaleString("en-PK")}</div><div class="box"><b>باقی</b>Rs ${Number(o.remaining||0).toLocaleString("en-PK")}</div><div class="box"><b>Quantity</b>${esc(o.quantity||1)}</div></div><div class="actions"><button class="btn complete" data-complete="${esc(o.id)}">✅ کپڑے مکمل</button><button class="btn delete" data-delete="${esc(o.id)}">🗑️ Delete / Cancel</button></div></div>`;card.querySelector(".card-head").onclick=()=>card.classList.toggle("open");list.appendChild(card)})}
$("search").oninput=render;document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");active=b.dataset.filter;render()});$("list").onclick=async e=>{const complete=e.target.closest("[data-complete]"),del=e.target.closest("[data-delete]");if(complete){const o=orders.find(x=>x.id===complete.dataset.complete);if(!o||!confirm("کیا یہ کپڑے مکمل ہو گئے ہیں؟"))return;try{await updateDoc(doc(db,"users",user.uid,"orders",o.id),{status:"unpaid",completedAtIso:new Date().toISOString(),updatedAt:serverTimestamp()});await load()}catch(err){alert("Update مسئلہ: "+err.message)}}if(del){const o=orders.find(x=>x.id===del.dataset.delete);if(!o)return;const reason=prompt("Order Cancel/Delete کرنے کی وجہ لکھیں:\nمثلاً: Order غلط تھا / کپڑے واپس لے گئے / Customer نے Cancel کیا");if(reason===null||!reason.trim())return alert("Delete/Cancel کرنے کے لیے وجہ ضروری ہے۔");try{await updateDoc(doc(db,"users",user.uid,"orders",o.id),{status:"cancelled",cancelReason:reason.trim(),cancelledAtIso:new Date().toISOString(),updatedAt:serverTimestamp()});await load()}catch(err){alert("Cancel مسئلہ: "+err.message)}}};
</script></body></html>
