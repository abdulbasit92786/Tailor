<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پینڈنگ</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff">
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("pwabuilder-sw.js").catch(()=>{});}</script></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,updateDoc,doc,$,esc,fields,designs,lang,dateText}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('pending')+`<main class="wrap"><div class="hero"><h1>${en?'Pending Orders':'پینڈنگ آرڈرز'}</h1><p>${en?'Complete clothes one by one.':'کپڑے ایک ایک کرکے مکمل کریں۔'}</p></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" placeholder="${en?'Search name, phone, area or address':'نام، فون، علاقہ یا پتہ تلاش کریں'}"></div></div><div id="list"><div class="loading">${en?'Loading...':'لوڈ ہو رہا ہے...'}</div></div></main>`;bindNav();let all=[];async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'orders'));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>(o.status||'pending')==='pending');render()}catch(e){$('list').innerHTML=`<div class="card empty">${en?'Could not load orders.':'آرڈر لوڈ نہیں ہو سکے۔'}</div>`}}function render(){const q=$('q').value.toLowerCase().trim();const a=all.filter(o=>[o.name,o.phone,o.area,o.address,o.color].some(v=>String(v??'').toLowerCase().includes(q)));$('list').innerHTML=a.length?a.map(o=>{const total=Math.max(1,Number(o.quantity)||1),done=Math.min(total,Number(o.completedQuantity)||0),left=total-done;return `<article class="card"><details><summary class="order-head"><div class="summary-main"><strong style="font-size:21px">${esc(o.name||'-')}</strong><div class="muted">${o.customerType==='new'?'🆕 '+(en?'New User':'نیا یوزر'):'👤 '+(en?'Saved Customer':'محفوظ کسٹمر')} • ${esc(o.phone||'-')} • ${esc(o.area||'-')}</div><div class="muted">📅 ${dateText(o.createdAt)} • 📍 ${esc(o.address||'-')}</div><div class="muted">🟠 ${en?'Status: Pending':'اسٹیٹس: پینڈنگ'}</div></div><div class="count-box"><b>${left}</b><span class="muted">${en?'left':'باقی'}</span></div></summary><div class="detail"><b>${en?'Quantity':'تعداد'}:</b> ${en?'Total':'کل'} ${total} • ${en?'Completed':'مکمل'} ${done} • ${en?'Left':'باقی'} ${left}</div><div class="detail"><b>${en?'Measurements':'ناپ'}</b>\n${fields.map(([k,ur,eng])=>`${en?eng:ur}: ${esc(o.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail"><b>${en?'Design':'ڈیزائن'}</b>\n${designs.filter(([k])=>o.designs?.[k]).map(([,ur,eng])=>en?eng:ur).join(', ')||'-'}\n${en?'Color':'رنگ'}: ${esc(o.color||'-')}</div><div class="row-actions"><button class="primary complete" data-id="${esc(o.id)}">✓ ${en?'Complete One Cloth':'ایک کپڑا مکمل کریں'}</button></div></details></article>`}).join(''):`<div class="card empty">${en?'No pending orders.':'ابھی کوئی پینڈنگ آرڈر نہیں۔'}</div>`;document.querySelectorAll('.complete').forEach(b=>b.onclick=async()=>{const o=all.find(x=>x.id===b.dataset.id);if(!o)return;const total=Math.max(1,Number(o.quantity)||1),done=Math.min(total,Number(o.completedQuantity)||0);if(done>=total)return;b.disabled=true;try{const next=done+1;await updateDoc(doc(db,'users',u.uid,'orders',o.id),{completedQuantity:next,status:next>=total?'ready':'pending',readyAt:next>=total?new Date().toISOString():o.readyAt||null,lastCompletedAt:new Date().toISOString()});await load()}catch(e){alert((en?'Error: ':'مسئلہ: ')+e.message);b.disabled=false}})}$('q').oninput=render;load()});</script></body></html>
