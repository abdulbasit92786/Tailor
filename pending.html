<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پینڈنگ</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,updateDoc,doc,$,esc,fields,designs}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('pending')+`<main class="wrap"><div class="hero"><h1>پینڈنگ آرڈرز</h1><p>آرڈر پر کلک کریں تو اس کی مکمل تفصیل کھلے گی۔</p></div><div class="card"><div class="searchbar"><span>🔎</span><input id="q" placeholder="نام، فون یا علاقہ تلاش کریں"></div></div><div id="list"></div></main>`;bindNav();let all=[];async function load(){const s=await getDocs(collection(db,'users',u.uid,'orders'));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>(o.status||'pending')==='pending');render()}function render(){const q=$('q').value.trim().toLowerCase();const a=all.filter(o=>[o.name,o.phone,o.area,o.address].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=a.length?a.map(o=>{const total=Number(o.quantity)||1,done=Number(o.completedQuantity)||0,left=Math.max(0,total-done);return `<article class="card"><div class="order-head"><div><b style="font-size:21px">${esc(o.name||'-')}</b><div class="muted">${o.customerType==='new'?'🆕 نیا صارف':'👤 محفوظ کسٹمر'} • ${esc(o.phone||'')} • ${esc(o.area||'')}</div><div class="muted">📍 ${esc(o.address||'-')}</div><div class="muted">📅 ${o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString('ur-PK'):new Date().toLocaleDateString('ur-PK')}</div></div><div><span class="badge">کل ${total}</span><br><span class="pill">مکمل ${done} • باقی ${left}</span></div></div><details style="margin-top:12px"><summary style="font-weight:900;font-size:17px;cursor:pointer">ناپ، ڈیزائن اور رنگ دیکھیں</summary><div class="detail" style="margin-top:10px">${fields.map(([k,n])=>`${n}: ${esc(o.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail">ڈیزائن: ${designs.filter(([k])=>o.designs?.[k]).map(([,n])=>n).join('، ')||'-'}</div><div class="detail">رنگ: ${esc(o.color||'-')}</div></details><div class="row-actions"><button class="primary complete" data-id="${esc(o.id)}">✓ ایک کپڑا مکمل کریں</button></div></article>`}).join(''):'<div class="card empty">ابھی کوئی پینڈنگ آرڈر نہیں</div>';list.querySelectorAll('.complete').forEach(b=>b.onclick=async()=>{const o=all.find(x=>x.id===b.dataset.id);if(!o)return;const total=Number(o.quantity)||1,done=Number(o.completedQuantity)||0;if(done>=total)return;b.disabled=true;const next=done+1;await updateDoc(doc(db,'users',u.uid,'orders',o.id),{completedQuantity:next,status:next>=total?'ready':'pending',readyAt:next>=total?new Date().toISOString():o.readyAt||null});load()})}q.oninput=render;load()});</script></body></html>
