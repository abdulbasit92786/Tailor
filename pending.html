<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پینڈنگ</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{db,requireAuth,nav,bindNav,$,collection,getDocs,updateDoc,doc,esc,fields,designs,dateText}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('pending')+`<main class="wrap"><div class="hero"><h1>پینڈنگ</h1><p>بننے والے کپڑوں کا صاف حساب۔ ایک ایک کپڑا مکمل کریں اور باقی تعداد خود محفوظ رہے گی۔</p></div><div id="list"><div class="loading">لوڈ ہو رہا ہے...</div></div></main>`;bindNav();async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'orders'));const a=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>['pending',''].includes(String(o.status||'pending')));render(a)}catch(e){$('list').innerHTML='<div class="card empty">پینڈنگ آرڈرز لوڈ نہیں ہو سکے۔ انٹرنیٹ آنے پر دوبارہ کوشش کریں۔</div>'}}function render(a){$('list').innerHTML=a.length?a.map(o=>{const total=Math.max(1,Number(o.quantity)||1),done=Math.min(total,Number(o.completedQuantity)||0),left=Math.max(0,total-done);return `<article class="card order"><div class="order-head"><div><b style="font-size:21px">${esc(o.name||'-')}</b><div class="muted">${o.customerType==='new'?'🆕 نیا یوزر':'👤 محفوظ کسٹمر'} • ${esc(o.phone||'')} • ${esc(o.area||'-')}</div><div class="muted">پتہ: ${esc(o.address||'-')} • تاریخ: ${dateText(o.createdAt)}</div></div><span class="badge">${total} کپڑے</span></div><div class="summary" style="margin-top:14px"><div class="card"><small>کل</small><b>${total}</b></div><div class="card"><small>مکمل</small><b>${done}</b></div><div class="card"><small>باقی</small><b>${left}</b></div></div>${detailsHtml(o)}<div class="actions"><button class="primary complete" data-id="${esc(o.id)}" ${left===0?'disabled':''}>✓ ایک کپڑا مکمل کریں</button></div></article>`}).join(''):'<div class="card empty">ابھی کوئی پینڈنگ آرڈر نہیں</div>';document.querySelectorAll('.complete').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.id;const o=a.find(x=>x.id===id);const total=Math.max(1,Number(o.quantity)||1),done=Math.min(total,(Number(o.completedQuantity)||0)+1),left=total-done;if(done>=total){await updateDoc(doc(db,'users',u.uid,'orders',id),{status:'ready',completedQuantity:done,remainingQuantity:0,readyAt:new Date().toISOString(),completedAt:new Date().toISOString()})}else await updateDoc(doc(db,'users',u.uid,'orders',id),{completedQuantity:done,remainingQuantity:left,lastCompletedAt:new Date().toISOString()});load()})}function detailsHtml(o){return `<div class="detail-section"><h3>ناپ</h3>${fields.map(([k,n])=>`<div class="detail-line"><span>${n}</span><b>${esc(o.measurements?.[k]||'-')}</b></div>`).join('')}</div><div class="detail-section"><h3>ڈیزائن</h3><div class="design-list">${designs.filter(([k])=>o.designs?.[k]).map(([,n])=>`<span>${n}</span>`).join('')||'<span>-</span>'}</div><div class="muted" style="margin-top:8px">رنگ: ${esc(o.color||'-')}</div></div>`}function serverTimestampFallback(){return new Date().toISOString()}load()});</script></body></html>
