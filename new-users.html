<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Users</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="hero"><h2>🆕 New Users</h2><p>نئے گاہک یہاں رہیں گے جب تک آپ انہیں Customers میں منتقل نہ کریں۔</p></div><div id="list"></div></main><nav><a href="index.html">🏠<span>ہوم</span></a><a href="add-order.html">➕<span>نیا آرڈر</span></a><a href="customers.html">👥<span>کسٹمرز</span></a><a class="on" href="new-users.html">🆕<span>نیو یوزرز</span></a><a href="menu.html">☰<span>مینو</span></a></nav><script type="module">import{requireUser,$,esc,dt,allCustomers,db,MEAS,DES}from'./app.js';import{doc,updateDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser();let cs=await allCustomers(u);const isNew=c=>(c.customerType==='new'||c.status==='new')&&c.status!=='active'&&c.customerType!=='customer';function render(){const list=cs.filter(isNew);$('#list').innerHTML=list.map(c=>`<div class="card" style="padding:15px;margin-bottom:10px"><b>${esc(c.name||'نام نہیں')}</b><div class="muted">📱 ${esc(c.phone||'—')} · تاریخ: ${dt(c.createdAt)}</div><div class="detail">📍 پتہ: ${esc(c.address||'—')}</div><div class="detail"><b>📏 ناپ</b><br>${MEAS.map(([k,l])=>`${l}: ${esc(c.measurements?.[k]||'—')}`).join(' · ')}</div><div class="detail"><b>✂️ ڈیزائن</b><br>${DES.filter(([k])=>c.designs?.[k]).map(x=>x[1]).join(' · ')||'—'}</div><div class="actions"><button class="primary" data-order="${c.id}">➕ نیا آرڈر</button><button class="success" data-save="${c.id}">⭐ Save Customer</button><button class="danger" data-del="${c.id}">🗑️ Delete</button></div></div>`).join('')||'<div class="empty">کوئی New User نہیں</div>'}$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.order){location.href='new-customer.html?customerId='+b.dataset.order;return}if(b.dataset.save){await updateDoc(doc(db,'users',u.uid,'customers',b.dataset.save),{status:'active',customerType:'customer',updatedAt:serverTimestamp()});cs=await allCustomers(u);render();return}if(b.dataset.del&&confirm('Delete کریں؟')){await deleteDoc(doc(db,'users',u.uid,'customers',b.dataset.del));cs=await allCustomers(u);render()}};render();</script></body></html>
