<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{direction:rtl}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at top left,#334155 0,transparent 35%),radial-gradient(circle at bottom right,#312e81 0,transparent 40%),linear-gradient(145deg,#020617,#0f172a);padding:16px 16px 110px}
button,input{font:inherit}button{cursor:pointer}.app{max-width:500px;margin:auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back,.refresh{width:46px;height:46px;min-width:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff20;color:#fff;text-decoration:none;font-size:21px}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#94a3b8;margin-top:4px}
.search{width:100%;padding:14px 15px;border-radius:16px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff;outline:0;font-size:14px;margin-bottom:12px}.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}.search::placeholder{color:#64748b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{padding:11px 4px;text-align:center;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff12}.stat b{display:block;font-size:18px;margin-bottom:3px}.stat span{font-size:9px;color:#94a3b8}
.msg{text-align:center;font-size:11px;min-height:20px;margin:5px 0 10px;color:#a7f3d0}
.card{margin-bottom:12px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;overflow:hidden;box-shadow:0 10px 25px #0004}.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}.avatar{width:54px;height:54px;min-width:54px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:23px}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.name{font-weight:bold;font-size:15px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#94a3b8;line-height:1.7}.account{font-size:9px;padding:5px 7px;border-radius:9px;background:#f59e0b18;color:#fbbf24;white-space:nowrap}.arrow{font-size:18px;color:#94a3b8;transition:.2s}.card.open .arrow{transform:rotate(180deg)}
.summary{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.pill{padding:4px 7px;border-radius:9px;font-size:9px;font-weight:bold}.pending{background:#92400e33;color:#fbbf24;border:1px solid #a1620744}.ready{background:#1d4ed833;color:#60a5fa;border:1px solid #2563eb44}.delivered{background:#16653433;color:#4ade80;border:1px solid #16a34a44}.cancelled{background:#7f1d1d33;color:#f87171;border:1px solid #ef444444}
.details{display:none;padding:0 15px 16px;border-top:1px solid #ffffff12}.card.open .details{display:block}.section-title{font-size:13px;font-weight:bold;margin:14px 0 9px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.info-box{padding:10px;border-radius:11px;background:#0003;font-size:10px;color:#cbd5e1;line-height:1.6}.info-box b{display:block;color:#fff;margin-bottom:3px}.order{margin-top:9px;padding:12px;border-radius:16px;background:#0004;border:1px solid #ffffff12}.order-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}.order-no{flex:1;font-size:11px;font-weight:bold}.order-date{font-size:9px;color:#94a3b8}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.order-detail{padding:9px;border-radius:10px;background:#ffffff08;font-size:10px;color:#cbd5e1}.order-detail b{display:block;color:#fff;margin-bottom:3px}.timeline{margin-top:9px;padding:10px;border-radius:11px;background:#ffffff06;font-size:9px;color:#cbd5e1;line-height:1.9}.timeline span{color:#94a3b8}.color-line{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10px;color:#cbd5e1}.color-dot{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff33}
.actions{display:flex;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid #ffffff12}.action{flex:1;padding:12px;border:0;border-radius:12px;color:#fff;font-weight:bold;font-size:11px}.save-customer{background:linear-gradient(135deg,#22c55e,#15803d)}.delete{background:linear-gradient(135deg,#ef4444,#b91c1c)}.action:disabled{opacity:.55;cursor:not-allowed}
.empty{padding:40px 15px;text-align:center;border-radius:21px;background:#ffffff09;border:1px solid #ffffff12;color:#94a3b8}.empty strong{display:block;font-size:17px;color:#fff;margin-bottom:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:78px;background:#020617f5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}.nav{height:100%;max-width:500px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}.nav a{text-decoration:none;color:#94a3b8;font-size:9px;text-align:center;min-width:45px;direction:ltr}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}
@media(max-width:360px){.stats{grid-template-columns:1fr 1fr}.info-grid,.order-grid{grid-template-columns:1fr}.nav a{font-size:8px}.nav i{font-size:18px}}
</style>
<style id="tm-unified-theme-v2">
:root{--ink:#172033;--muted:#475569;--pink:#ec4899;--yellow:#f59e0b;--blue:#2563eb;--green:#059669}
html,body{color:var(--ink)!important}
body{background:radial-gradient(circle at 8% 0%,#fbcfe8 0,transparent 27%),radial-gradient(circle at 100% 12%,#bfdbfe 0,transparent 30%),radial-gradient(circle at 85% 100%,#bbf7d0 0,transparent 28%),linear-gradient(145deg,#fff7ed,#eff6ff 52%,#f0fdf4)!important}
.top,.top-bar{color:var(--ink)!important}
.top-button,.top-btn,.back,.refresh,.search,.card,.section,.info,.stat,.stats .stat,.empty,.bottom,.bottom-navigation,.nav-icon,.details,.payment-box,.payment,.info-grid .box,.box,.d,.measure,.order-detail,.info-box,.time,.timeline,.order,.option label,.meta-box,.field,.sheet,.modal-card{color:var(--ink)!important;background:rgba(255,255,255,.90)!important;border-color:rgba(30,41,59,.12)!important;box-shadow:0 10px 28px rgba(15,23,42,.08)!important}
.name,.title h1,.title-area h1,.heading h2,.hero h2,.section-title,.detail-title,.st,.stat b,.info strong,.card-text h3,.order-no,.d b,.measure b,.order-detail b,.info-box b,.box b,.time b,.payment-box b{color:#111827!important}
.title p,.title-area p,.heading p,.hero p,.meta,.stat span,.info span,label,.d,.measure,.order-detail,.info-box,.box,.time,.timeline,.order-date,.payment-box .d{color:var(--muted)!important}
input,.search,.color-name,textarea,select{background:#fff!important;color:#111827!important;border-color:#cbd5e1!important}
input::placeholder,.search::placeholder{color:#64748b!important}
.option input:checked+label{color:#fff!important}
.card-head,.order-head,.head{color:var(--ink)!important}
.color-dot{border-color:#94a3b8!important}
.bottom,.bottom-navigation{background:rgba(255,255,255,.94)!important}
.nav a,.nav-button{color:#475569!important}.nav .active,.nav-button.active{color:#111827!important}
/* Status cards remain colorful with high-contrast white text */
.status-card{color:#fff!important}.status-card .status-name,.status-card .status-count{color:#fff!important}
.status-card.pending{background:linear-gradient(135deg,#f59e0b,#f97316)!important}.status-card.shop{background:linear-gradient(135deg,#6366f1,#3b82f6)!important}.status-card.delivered{background:linear-gradient(135deg,#10b981,#059669)!important}.status-card.newusers{background:linear-gradient(135deg,#ec4899,#db2777)!important}
button.action,.btn,.confirm,.save,.add,.addUserBtn{color:#fff!important}
.badge{color:#075985!important;background:#dbeafe!important}
.tag{color:#1e3a8a!important;background:#dbeafe!important;border:1px solid #93c5fd!important}
</style></head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let user=null,customers=[],orders=[],newUsers=[],loading=false;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function dateValue(v){
if(!v)return null;
if(v?.toDate)return v.toDate();
if(typeof v==="string"){const d=new Date(v);return isNaN(d)?null:d}
if(typeof v.seconds!=="undefined")return new Date(Number(v.seconds)*1000);
return null;
}
function fmt(v,withTime=false){
const d=dateValue(v);if(!d)return"-";
return d.toLocaleDateString("ur-PK",{year:"numeric",month:"short",day:"numeric"})+
(withTime?" • "+d.toLocaleTimeString("ur-PK",{hour:"2-digit",minute:"2-digit"}):"");
}
function ts(order,...keys){for(const k of keys)if(order[k])return order[k];return null}
function statusOf(o){
const s=String(o.status||"pending").toLowerCase().trim();
if(["delivered","deliver"].includes(s))return{text:"📦 Delivered",cls:"delivered",active:false};
if(["cancelled","canceled"].includes(s))return{text:"❌ Cancelled",cls:"cancelled",active:false};
if(["ready","ready_in_shop","ready-in-shop","ready in shop","completed","complete"].includes(s))return{text:"🔵 Ready in Shop",cls:"ready",active:true};
return{text:"🟤 Pending",cls:"pending",active:true};
}
function orderDate(o){return ts(o,"orderDate","orderedDate","orderedAt","createdAt")}
function orderKey(o){
const phone=String(o.phone||o.mobile||"").replace(/\D/g,"");
if(phone)return"phone:"+phone;
const name=String(o.customerName||o.name||"").trim().toLowerCase();
if(name)return"name:"+name;
return"order:"+o.id;
}
function isNewOrder(o){
/*
A new-user order is explicitly marked new, has no customerId,
or has customerType=new. Orders already linked to Customers are excluded.
*/
return !o.customerId && ["new","new-user","new_user"].includes(String(o.customerType||o.customerSource||o.source||"new").toLowerCase().replace(/\s+/g,"-"));
}
function normalizeCustomer(c){
return{...c,_id:c.id,accountNo:c.accountNo||"",phone:c.phone||"",name:c.name||"",address:c.address||"",photo:c.photo||""};
}

async function loadData(){
if(loading)return;loading=true;
$("msg").textContent="⏳ Data لوڈ ہو رہا ہے...";
try{
const [cs,os]=await Promise.all([
getDocs(collection(db,"users",user.uid,"customers")),
getDocs(collection(db,"users",user.uid,"orders"))
]);
customers=cs.docs.map(d=>normalizeCustomer({id:d.id,...d.data()}));
orders=os.docs.map(d=>({id:d.id,...d.data()}));

/* Customer phone numbers are used as a safe fallback when old orders
   have customerId:null. Existing customer orders are NEVER shown here. */
const customerPhones=new Set(customers.map(c=>String(c.phone||"").replace(/\D/g,"")).filter(Boolean));
const groups=new Map();

orders.filter(isNewOrder).forEach(o=>{
const key=orderKey(o);
if(!groups.has(key))groups.set(key,[]);
groups.get(key).push(o);
});

newUsers=[];
for(const [key,os] of groups){
/* If an old order has the phone of an existing customer, do not show it. */
const phone=String(os[0]?.phone||os[0]?.mobile||"").replace(/\D/g,"");
if(phone&&customerPhones.has(phone))continue;

const sorted=[...os].sort((a,b)=>(dateValue(orderDate(b))?.getTime()||0)-(dateValue(orderDate(a))?.getTime()||0));
const latest=sorted[0]||{};
const active=os.filter(o=>statusOf(o).active);
if(!active.length)continue;

newUsers.push({
key,
name:latest.customerName||latest.name||"نام نہیں",
phone:latest.phone||latest.mobile||"-",
address:latest.address||"-",
accountNo:latest.accountNo||"-",
photo:latest.photo||"",
orders:sorted
});
}
newUsers.sort((a,b)=>(dateValue(orderDate(b.orders[0]))?.getTime()||0)-(dateValue(orderDate(a.orders[0]))?.getTime()||0));
updateStats();render();
$("msg").textContent=newUsers.length?`✅ ${newUsers.length} نئے Users ملے`:"";
}catch(e){console.error(e);$("msg").textContent="❌ Data لوڈ نہیں ہوا: "+e.message}
finally{loading=false}
}

function updateStats(){
let active=0,pending=0,delivered=0;
newUsers.forEach(u=>u.orders.forEach(o=>{const s=statusOf(o);if(s.active)active++;if(s.cls==="pending")pending++;if(s.cls==="delivered")delivered++}));
$("totalUsers").textContent=newUsers.length;
$("totalOrders").textContent=active;
$("pendingCount").textContent=pending;
$("deliveredCount").textContent=delivered;
}

function render(){
const q=$("search").value.trim().toLowerCase();
const filtered=newUsers.filter(u=>(u.name+" "+u.phone+" "+u.accountNo).toLowerCase().includes(q));
if(!filtered.length){$("list").innerHTML=`<div class="empty"><strong>🎉 کوئی New User نہیں</strong>${q?"اس Search کے مطابق کوئی User نہیں ملا":"تمام نئے Users مکمل ہو چکے ہیں۔"}</div>`;return}
$("list").innerHTML=filtered.map((u,i)=>cardHtml(u,i)).join("");
}

function cardHtml(u,i){
const active=u.orders.filter(o=>statusOf(o).active);
const delivered=u.orders.filter(o=>statusOf(o).cls==="delivered").length;
return `<div class="card" data-key="${esc(u.key)}">
<div class="head" data-open="${esc(u.key)}">
<div class="avatar">${u.photo?`<img src="${esc(u.photo)}" loading="lazy">`:"👤"}</div>
<div class="info"><div class="name">${esc(u.name)}</div><div class="meta">📞 ${esc(u.phone)}<br>📍 ${esc(u.address)}</div>
<div class="summary"><span class="pill pending">🟤 ${active.filter(o=>statusOf(o).cls==="pending").length} Pending</span><span class="pill ready">🔵 ${active.filter(o=>statusOf(o).cls==="ready").length} Ready</span>${delivered?`<span class="pill delivered">🟢 ${delivered} Delivered</span>`:""}</div></div>
<span class="account">#${esc(u.accountNo)}</span><span class="arrow">⌄</span>
</div>
<div class="details">
<div class="section-title">👤 User Details</div>
<div class="info-grid">
<div class="info-box"><b>نام</b>${esc(u.name)}</div>
<div class="info-box"><b>فون</b>${esc(u.phone)}</div>
<div class="info-box"><b>پتہ</b>${esc(u.address)}</div>
<div class="info-box"><b>کل Orders</b>${u.orders.length}</div>
<div class="info-box"><b>Active Orders</b>${active.length}</div>
<div class="info-box"><b>پہلا Order</b>${fmt(u.orders[u.orders.length-1]&&orderDate(u.orders[u.orders.length-1]))}</div>
<div class="info-box"><b>تازہ Order</b>${fmt(orderDate(u.orders[0]),true)}</div>
<div class="info-box"><b>Account</b>#${esc(u.accountNo)}</div>
</div>
<div class="section-title">🧵 تمام Orders اور تاریخیں</div>
${u.orders.map((o,n)=>orderHtml(o,n)).join("")}
<div class="actions">
<button class="action save-customer" data-save="${esc(u.key)}">👤 Save to Customers</button>
<button class="action delete" data-remove="${esc(u.key)}">🗑️ Remove</button>
</div>
</div></div>`;
}

function orderHtml(o,n){
const s=statusOf(o),m=o.measurements||{},c=o.color||{},d=o.designs||{};
const designNames={twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"};
const selected=Object.keys(d).filter(k=>d[k]&&designNames[k]).map(k=>designNames[k]).join("، ")||"سادہ";
return `<div class="order">
<div class="order-top"><div class="order-no">🧾 Order #${esc(o.id.slice(-6).toUpperCase())}</div><span class="status ${s.cls}">${s.text}</span></div>
<div class="order-date">📅 Order Date: ${fmt(orderDate(o),true)}</div>
<div class="order-grid" style="margin-top:8px">
<div class="order-detail"><b>Customer</b>${esc(o.customerName||o.name||"-")}</div>
<div class="order-detail"><b>Phone</b>${esc(o.phone||o.mobile||"-")}</div>
<div class="order-detail"><b>Length</b>${esc(m.length||"-")}</div>
<div class="order-detail"><b>Chest</b>${esc(m.chest||"-")}</div>
<div class="order-detail"><b>Waist</b>${esc(m.waist||"-")}</div>
<div class="order-detail"><b>Sleeve</b>${esc(m.sleeve||"-")}</div>
<div class="order-detail"><b>Neck</b>${esc(m.neck||"-")}</div>
<div class="order-detail"><b>Shalwar Length</b>${esc(m.shalwarLength||"-")}</div>
<div class="order-detail"><b>Tera</b>${esc(m.tera||"-")}</div>
<div class="order-detail"><b>Daman</b>${esc(m.daman||"-")}</div>
<div class="order-detail"><b>Pancha</b>${esc(m.pancha||"-")}</div>
<div class="order-detail"><b>Quantity</b>${esc(o.quantity||o.qty||o.pieceCount||1)}</div>
</div>
${c.name||c.hex?`<div class="color-line"><span class="color-dot" style="background:${esc(c.hex||"#000")}"></span>🎨 ${esc(c.name||c.hex)}</div>`:""}
<div class="timeline">
📅 <span>Created:</span> ${fmt(o.createdAt||orderDate(o),true)}<br>
🟦 <span>Ready:</span> ${fmt(ts(o,"readyDate","readyAt","readyInShopDate","readyInShopAt"),true)}<br>
📦 <span>Delivered:</span> ${fmt(ts(o,"deliveredDate","deliveredAt","deliveryDate","deliveryAt"),true)}<br>
🔄 <span>Updated:</span> ${fmt(o.updatedAt,true)}
</div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">✂️ Designs: <span style="color:#cbd5e1">${esc(selected)}</span></div>
</div>`;
}

$("search").addEventListener("input",render);
$("refresh").onclick=async()=>{if(!loading)await loadData()};

$("list").addEventListener("click",async e=>{
const head=e.target.closest("[data-open]");
if(head&&!e.target.closest("button")){head.parentElement.classList.toggle("open");return}
const save=e.target.closest("[data-save]");
if(save){await saveToCustomer(save.dataset.save);return}
const remove=e.target.closest("[data-remove]");
if(remove){removeUser(remove.dataset.remove)}
});

async function saveToCustomer(key){
const u=newUsers.find(x=>x.key===key);if(!u||!user)return;
const btn=document.querySelector(`[data-save="${CSS.escape(key)}"]`);if(btn){btn.disabled=true;btn.textContent="⏳ Customer محفوظ ہو رہا ہے..."}
try{
const first=u.orders[0]||{};
const customerRef=doc(collection(db,"users",user.uid,"customers"));
const now=serverTimestamp();
const accountNo=await nextAccountNo();
await runTransaction(db,async tx=>{
tx.set(customerRef,{
name:u.name,phone:u.phone,address:u.address,photo:u.photo||"",
accountNo, userId:user.uid,
measurements:first.measurements||{},
designs:first.designs||{},
isNewUser:false,
createdAt:now,updatedAt:now
});
u.orders.forEach(o=>{
tx.update(doc(db,"users",user.uid,"orders",o.id),{
customerId:customerRef.id,
customerType:"existing",
updatedAt:now,
customerAccountNo:accountNo
});
});
});
$("msg").textContent=`✅ ${u.name} Customers میں منتقل ہوگیا۔`;
newUsers=newUsers.filter(x=>x.key!==key);updateStats();render();
}catch(e){console.error(e);$("msg").textContent="❌ Customer محفوظ نہیں ہوا: "+e.message;if(btn){btn.disabled=false;btn.textContent="👤 Save to Customers"}}
}

async function nextAccountNo(){
const nums=customers.map(c=>Number(c.accountNo||0)).filter(Number.isFinite);
return (nums.length?Math.max(...nums):0)+1;
}
function removeUser(key){
const u=newUsers.find(x=>x.key===key);if(!u)return;
if(!confirm(`"${u.name}" کو New Users سے hide کرنا ہے؟ اس کے Orders delete نہیں ہوں گے۔`))return;
newUsers=newUsers.filter(x=>x.key!==key);updateStats();render();
