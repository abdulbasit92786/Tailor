<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import{

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import{

getFirestore,

collection,

getDocs,

setDoc,

doc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:
"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:
"tailor-web-f1f1c.firebaseapp.com",

projectId:
"tailor-web-f1f1c",

storageBucket:
"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:
"129811668871",

appId:
"1:129811668871:web:586357e9e696a9652ffd22"

};


const app=
initializeApp(
firebaseConfig
);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser=null;

let customers=[];

let orders=[];

let newUsers=[];


/* =====================================================
   HELPER
===================================================== */

const $=
id=>
document.getElementById(id);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value??"")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =====================================================
   DATE VALUE
===================================================== */

function dateValue(value){

if(!value){

return null;

}


if(
typeof value==="string"
){

const d=
new Date(value);

return isNaN(
d.getTime()
)
?null
:d;

}


if(
value.toDate
){

return value.toDate();

}


if(
typeof value.seconds!=="undefined"
){

return new Date(
value.seconds*1000
);

}


return null;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

const d=
dateValue(value);

if(!d){

return "-";

}


return d.toLocaleDateString(
"ur-PK",
{

year:"numeric",

month:"short",

day:"numeric"

}
);

}


/* =====================================================
   ORDER DATE
===================================================== */

function getOrderDate(order,type){

if(
type==="ordered"
){

return (

order.orderDate ||

order.orderedDate ||

order.orderedAt ||

order.createdAt ||

null

);

}


if(
type==="ready"
){

return (

order.readyDate ||

order.readyAt ||

order.readyInShopDate ||

order.readyInShopAt ||

null

);

}


if(
type==="delivered"
){

return (

order.deliveredDate ||

order.deliveredAt ||

order.deliveryDate ||

order.deliveryAt ||

null

);

}


return null;

}


/* =====================================================
   STATUS
===================================================== */

/*
IMPORTANT:

completed کو الگ status نہیں رکھا گیا۔

اگر database میں status = completed
ہو تو اسے Ready in Shop سمجھا جائے گا۔
*/

function getStatus(order){

const raw=
String(
order.status||"pending"
)
.toLowerCase()
.trim();


if(
raw==="delivered"||
raw==="deliver"
){

return{

text:"📦 Delivered",

className:"delivered",

type:"delivered"

};

}


/*
completed کو Ready in Shop
سمجھ رہے ہیں
*/

if(
raw==="ready"||
raw==="ready_in_shop"||
raw==="ready-in-shop"||
raw==="ready in shop"||
raw==="completed"||
raw==="complete"
){

return{

text:"🔵 Ready in Shop",

className:"ready",

type:"ready"

};

}


if(
raw==="cancelled"||
raw==="canceled"
){

return{

text:"❌ Cancelled",

className:"cancelled",

type:"cancelled"

};

}


return{

text:"🟤 Pending",

className:"pending",

type:"pending"

};

}


/* =====================================================
   ACTIVE ORDER
===================================================== */

function isActiveOrder(order){

const status=
getStatus(order);


return(

status.type==="pending"||

status.type==="ready"

);

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.replace(
"login.html"
);

return;

}


currentUser=user;

await loadData();

}
);


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

try{

$("msg").style.color=
"#a7f3d0";

$("msg").textContent=
"⏳ New Users لوڈ ہو رہے ہیں...";


/* ---------------------------------------------
   LOAD CUSTOMERS
--------------------------------------------- */

const customerSnap=
await getDocs(

collection(
db,
"users",
currentUser.uid,
"customers"
)

);


customers=
customerSnap.docs.map(
d=>({

id:d.id,

...d.data()

})
);


/* ---------------------------------------------
   LOAD ORDERS
--------------------------------------------- */

const orderSnap=
await getDocs(

collection(
db,
"users",
currentUser.uid,
"orders"
)

);


orders=
orderSnap.docs.map(
d=>({

id:d.id,

...d.data()

})
);


/*
=================================================
NEW USERS DETECTION
=================================================

صرف وہ Users دکھیں گے:

1. جن کے کم از کم ایک Pending
   یا Ready in Shop Order ہو۔

2. Delivered-only user نہیں آئے گا۔

3. اگر ایک User کے 3 Orders ہیں
   تو تینوں Orders اسی User میں آئیں گے۔

4. اگر customer document موجود نہ ہو
   تو Order کے اندر موجود name/phone/address
   سے User بنایا جائے گا۔
*/


const customerMap=
new Map();


customers.forEach(
customer=>{

customerMap.set(
customer.id,
customer
);

});


/*
ہر Customer کے Orders
گروپ کریں
*/

const grouped=
new Map();


orders.forEach(
order=>{

const customerId=
order.customerId ||
order.customerID ||
order.userId ||
"order-"+order.id;


if(!grouped.has(customerId)){

grouped.set(
customerId,
[]
);

}


grouped.get(
customerId
).push(order);

});


/*
اب New Users بنائیں
*/

newUsers=[];


grouped.forEach(
(customerOrders,customerId)=>{


/*
کم از کم ایک Active Order
ضروری ہے۔
*/

const hasActive=
customerOrders.some(
order=>
isActiveOrder(order)
);


if(!hasActive){

return;

}


/*
Customer document ہو تو
وہ information لیں۔
*/

const savedCustomer=
customerMap.get(
customerId
);


/*
Order سے بھی information نکالیں۔
*/

const latestOrder=
[...customerOrders]

.sort(
(a,b)=>{

const da=
dateValue(
getOrderDate(
a,
"ordered"
)
);

const db=
dateValue(
getOrderDate(
b,
"ordered"
)
);

return(
(db?.getTime()||0)-
(da?.getTime()||0)
);

}
)[0];


/*
اگر customer document نہیں
تو order سے data لیں۔
*/

const userData={

id:
customerId,

name:
savedCustomer?.name ||

latestOrder?.customerName ||

latestOrder?.name ||

"نام نہیں",

phone:
savedCustomer?.phone ||

latestOrder?.phone ||

latestOrder?.mobile ||

"-",

address:
savedCustomer?.address ||

latestOrder?.address ||

"-",

accountNo:
savedCustomer?.accountNo ||

latestOrder?.accountNo ||

"-",

photo:
savedCustomer?.photo ||

latestOrder?.photo ||

"",

/*
یہ flag صرف Add Customer کے
بعد کام آئے گا۔
*/

isNewUser:
savedCustomer?.isNewUser !== false

};


/*
اگر Customer پہلے ہی
Customers میں permanently
save ہو چکا ہے تو New Users
میں نہ دکھائیں۔

لیکن اگر پرانے data میں
flag موجود نہیں تو دکھائیں۔
*/

if(
savedCustomer &&
savedCustomer.isNewUser===false
){

return;

}


newUsers.push({

...userData,

orders:
customerOrders

});

});


/*
Newest User first
*/

newUsers.sort(
(a,b)=>{

const da=
dateValue(
getOrderDate(
a.orders[0],
"ordered"
)
);

const db=
dateValue(
getOrderDate(
b.orders[0],
"ordered"
)
);

return(
(db?.getTime()||0)-
(da?.getTime()||0)
);

});


updateStats();

$("msg").textContent="";

render(newUsers);


}catch(error){

console.error(error);

$("msg").style.color=
"#fca5a5";

$("msg").textContent=
"❌ Data لوڈ نہیں ہو سکا: "+
error.message;

}

}


/* =====================================================
   STATS
===================================================== */
  function updateStats(){

/*
Total Users
*/

$("totalUsers").textContent=
newUsers.length;


/*
صرف New Users کے Orders
*/

const allNewUserOrders=
newUsers.flatMap(
user=>
user.orders
);


/*
Total Orders
*/

$("totalOrders").textContent=
allNewUserOrders.length;


/*
Pending
*/

$("pendingCount").textContent=

allNewUserOrders.filter(
order=>
getStatus(order).type==="pending"
).length;


/*
Delivered
*/

$("deliveredCount").textContent=

allNewUserOrders.filter(
order=>
getStatus(order).type==="delivered"
).length;

}


/* =====================================================
   STATUS SUMMARY
===================================================== */

function statusSummary(orderList){

const pending=
orderList.filter(
o=>
getStatus(o).type==="pending"
).length;


const ready=
orderList.filter(
o=>
getStatus(o).type==="ready"
).length;


const delivered=
orderList.filter(
o=>
getStatus(o).type==="delivered"
).length;


let html="";


if(pending>0){

html+=`

<span
class="status-pill pending-light"
>

<span class="status-light"></span>

Pending ${pending}

</span>

`;

}


if(ready>0){

html+=`

<span
class="status-pill ready-light"
>

<span class="status-light"></span>

Ready ${ready}

</span>

`;

}


if(delivered>0){

html+=`

<span
class="status-pill delivered-light"
>

<span class="status-light"></span>

Delivered ${delivered}

</span>

`;

}


return html;

}


/* =====================================================
   RENDER
===================================================== */

function render(data){

const list=
$("list");


if(!data.length){

list.innerHTML=`

<div class="empty">

<strong>
🆕 کوئی Active New User نہیں
</strong>

اس وقت کوئی User ایسا نہیں جس کا
Pending یا Ready in Shop Order ہو۔

</div>

`;

return;

}


list.innerHTML="";


data.forEach(
customer=>{


/*
Orders کو date کے حساب سے
نئے سے پرانے ترتیب دیں۔
*/

const customerOrders=
[...customer.orders]

.sort(
(a,b)=>{

const da=
dateValue(
getOrderDate(
a,
"ordered"
)
);

const db=
dateValue(
getOrderDate(
b,
"ordered"
)
);

return(
(db?.getTime()||0)-
(da?.getTime()||0)
);

}
);


/*
Counts
*/

const pending=
customerOrders.filter(
o=>
getStatus(o).type==="pending"
).length;


const ready=
customerOrders.filter(
o=>
getStatus(o).type==="ready"
).length;


const delivered=
customerOrders.filter(
o=>
getStatus(o).type==="delivered"
).length;


/*
Avatar
*/

let avatar="👤";


if(customer.photo){

avatar=`

<img
src="${escapeHtml(customer.photo)}"
alt="Customer"
onerror="
this.style.display='none';
this.parentElement.textContent='👤';
"
>

`;

}


/*
=================================================
ORDERS HTML
=================================================
*/

const ordersHtml=

customerOrders.map(
(order,index)=>{


const status=
getStatus(order);


const orderNo=

order.orderNo ||

order.orderNumber ||

(
order.id
.slice(0,6)
.toUpperCase()
);


/*
Color
*/

const color=
order.color || {};


const colorName=
color.name ||

order.colorName ||

"-";


const colorHex=
color.hex ||

order.colorHex ||

"#000000";


/*
Receiver
*/

const receiver=

order.receivedBy ||

order.deliveredBy ||

order.receiverName ||

order.takenBy ||

order.receivedPerson ||

"ابھی وصول نہیں ہوا";


return`

<div class="order">


<div class="order-top">


<div class="order-no">

🧵 Order #${escapeHtml(orderNo)}

</div>


<div
class="status ${status.className}"
>

${status.text}

</div>


</div>


<div class="order-row">


<!-- ORDER DATE -->

<div class="order-detail">

<b>
📅 Order دیا
</b>

${formatDate(
getOrderDate(
order,
"ordered"
)
)}

</div>


<!-- READY DATE -->

<div class="order-detail">

<b>
🔵 Ready in Shop
</b>

${formatDate(
getOrderDate(
order,
"ready"
)
)}

</div>


<!-- DELIVERED DATE -->

<div class="order-detail">

<b>
📦 Delivered
</b>

${formatDate(
getOrderDate(
order,
"delivered"
)
)}

</div>


<!-- CURRENT STATUS -->

<div class="order-detail">

<b>
📊 موجودہ Status
</b>

${escapeHtml(
status.text
)}

</div>


<!-- RECEIVER -->

<div class="order-detail">

<b>
👤 کس نے وصول کیا
</b>

${escapeHtml(
receiver
)}

</div>


<!-- ORDER ID -->

<div class="order-detail">

<b>
🔢 Order ID
</b>

${escapeHtml(
orderNo
)}

</div>


</div>


<!-- COLOR -->

<div class="color-line">


<span
class="color-dot"
style="
background:${escapeHtml(
colorHex
)}
"
></span>


کپڑے کا رنگ:

<strong>

${escapeHtml(
colorName
)}

</strong>


</div>


</div>

`;

}
).join("");


/*
=================================================
CARD
=================================================
*/

const card=
document.createElement("div");

card.className="card";


card.innerHTML=`

<!-- ============================================
     CUSTOMER HEADER
============================================ -->

<div class="head">


<div class="avatar">

${avatar}

</div>


<div class="info">


<div class="name">

${escapeHtml(
customer.name
)}

</div>


<div class="meta">

📱 ${escapeHtml(
customer.phone
)}

<br>

📍 ${escapeHtml(
customer.address
)}

</div>


<!-- STATUS LIGHTS -->

<div class="status-summary">

${statusSummary(
customerOrders
)}

</div>


</div>


<div class="account">

#${escapeHtml(
customer.accountNo
)}

</div>


<div class="arrow">

⌄

</div>


</div>


<!-- ============================================
     DETAILS
============================================ -->

<div class="details">


<!-- CUSTOMER INFORMATION -->

<div class="section-title">

👤 Customer Information

</div>


<div class="info-grid">


<div class="info-box">

<b>
نام
</b>

${escapeHtml(
customer.name
)}

</div>


<div class="info-box">

<b>
📱 فون نمبر
</b>

${escapeHtml(
customer.phone
)}

</div>


<div class="info-box">

<b>
📍 پتہ
</b>

${escapeHtml(
customer.address
)}

</div>


<div class="info-box">

<b>
🔢 Account No.
</b>

#${escapeHtml(
customer.accountNo
)}

</div>


</div>


<!-- TOTAL -->

<div class="total-box">

<b>

${customerOrders.length}

</b>

<span>

اس Customer کے کل Orders

</span>

</div>


<!-- ORDER STATUS COUNTS -->

<div
class="info-grid"
style="margin-top:8px"
>


<div class="info-box">

<b>
🟤 Pending
</b>

${pending}

Order

</div>


<div class="info-box">

<b>
🔵 Ready in Shop
</b>

${ready}

Order

</div>


<div class="info-box">

<b>
📦 Delivered
</b>

${delivered}

Order

</div>


<div class="info-box">

<b>
📊 Active Orders
</b>

${pending+ready}

Order

</div>


</div>


<!-- ALL ORDERS -->

<div class="section-title">

🧵 اس Customer کے تمام Orders

</div>


${ordersHtml}


<div class="order-count">

📋 Total ${customerOrders.length}
Orders — تمام ریکارڈ اوپر موجود ہے۔

</div>


<!-- ACTIONS -->

<div class="actions">


<button
class="action add-customer"
data-id="${escapeHtml(customer.id)}"
>

➕ Add Customer

</button>


<button
class="action delete"
data-id="${escapeHtml(customer.id)}"
>

🗑️ Delete

</button>


</div>


</div>

`;


/* =====================================================
   OPEN / CLOSE
===================================================== */

card
.querySelector(".head")
.onclick=
()=>{

card.classList.toggle(
"open"
);

};


/* =====================================================
   ADD CUSTOMER
===================================================== */

card
.querySelector(".add-customer")
.onclick=
async event=>{

event.stopPropagation();


const button=
card.querySelector(
".add-customer"
);


button.disabled=true;

button.textContent=
"⏳ محفوظ ہو رہا ہے...";


try{


/*
Customer کے اندر سے id نکالیں۔
*/

const customerData={

name:
customer.name||"",

phone:
customer.phone||"",

address:
customer.address||"",

accountNo:
customer.accountNo||null,

photo:
customer.photo||"",

/*
اب یہ Customer
New User نہیں رہے گا۔
*/

isNewUser:false,

updatedAt:
serverTimestamp()

};


/*
Customers collection میں
اسی ID کے ساتھ save کریں۔
*/

await setDoc(

doc(

db,

"users",

currentUser.uid,

"customers",

customer.id

),

customerData,

{

merge:true

}

);


/*
Local list سے remove
*/

newUsers=
newUsers.filter(
c=>
c.id!==customer.id
);


/*
Update screen
*/

updateStats();

render(newUsers);


/*
Success
*/

$("msg").style.color=
"#86efac";

$("msg").textContent=
"✅ Customer Customers میں محفوظ ہوگیا۔";


}catch(error){

console.error(error);


button.disabled=false;

button.textContent=
"➕ Add Customer";


$("msg").style.color=
"#fca5a5";

$("msg").textContent=
"❌ Customer محفوظ نہیں ہوا: "+
error.message;

}

};


/* =====================================================
   DELETE FROM NEW USERS
===================================================== */
  /*
IMPORTANT:

اصل Customer document کو
delete نہیں کریں گے۔

صرف اسے New Users سے ختم کرنے
کے لیے isNewUser=false اور
newUserDeleted=true save کریں گے۔

اس طرح Orders کا record محفوظ رہے گا۔
*/

card
.querySelector(".delete")
.onclick=
async event=>{

event.stopPropagation();


const ok=
confirm(

`"${customer.name||"Customer"}" کو New Users سے حذف کرنا ہے؟\n\nاس کے Orders کا record محفوظ رہے گا۔`

);


if(!ok){

return;

}


try{


await setDoc(

doc(

db,

"users",

currentUser.uid,

"customers",

customer.id

),

{

name:
customer.name||"",

phone:
customer.phone||"",

address:
customer.address||"",

accountNo:
customer.accountNo||null,

photo:
customer.photo||"",

isNewUser:false,

newUserDeleted:true,

updatedAt:
serverTimestamp()

},

{

merge:true

}

);


/*
Local screen سے remove
*/

newUsers=
newUsers.filter(
c=>
c.id!==customer.id
);


updateStats();

render(newUsers);


$("msg").style.color=
"#86efac";

$("msg").textContent=
"✅ User New Users سے حذف ہوگیا۔";


}catch(error){

console.error(error);


$("msg").style.color=
"#fca5a5";

$("msg").textContent=
"❌ User حذف نہیں ہوا: "+
error.message;

}

};


list.appendChild(card);

});

}


/* =====================================================
   SEARCH
===================================================== */

$("search")
.addEventListener(
"input",
()=>{


const q=
$("search")
.value
.trim()
.toLowerCase();


if(!q){

render(newUsers);

return;

}


const result=
newUsers.filter(
customer=>{


return[

customer.name,

customer.phone,

customer.accountNo,

customer.address

]

.some(
value=>

String(
value||""
)

.toLowerCase()

.includes(q)

);

}
);


render(result);

}
);


/* =====================================================
   REFRESH
===================================================== */

$("refresh")
.onclick=
async()=>{

await loadData();

};

</script>
