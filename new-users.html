<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Users - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{direction:rtl}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at top left,#334155 0,transparent 35%),radial-gradient(circle at bottom right,#312e81 0,transparent 40%),radial-gradient(circle at 12% 0,#1e3a8a44,transparent 32%),radial-gradient(circle at 100% 100%,#312e8150,transparent 38%),linear-gradient(145deg,#020617,#0f172a 55%,#111827);padding:16px 16px 110px}
button,input{font:inherit}button{cursor:pointer}.app{max-width:500px;margin:auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back,.refresh{width:46px;height:46px;min-width:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff20;color:#fff;text-decoration:none;font-size:21px}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#94a3b8;margin-top:4px}
.search{width:100%;padding:14px 15px;border-radius:16px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff;outline:0;font-size:14px;margin-bottom:12px}.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}.search::placeholder{color:#64748b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{padding:11px 4px;text-align:center;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff12}.stat b{display:block;font-size:18px;margin-bottom:3px}.stat span{font-size:9px;color:#94a3b8}
.msg{text-align:center;font-size:11px;min-height:20px;margin:5px 0 10px;color:#a7f3d0}
.card{margin-bottom:12px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;overflow:hidden;box-shadow:0 10px 25px #0004}.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}.avatar{width:54px;height:54px;min-width:54px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:23px}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.name{font-weight:bold;font-size:15px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#94a3b8;line-height:1.7}.account{font-size:9px;padding:5px 7px;border-radius:9px;background:#f59e0b18;color:#fbbf24;white-space:nowrap}.arrow{font-size:18px;color:#94a3b8;transition:.2s}.card.open .arrow{transform:rotate(180deg)}
.summary{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.pill{padding:4px 7px;border-radius:9px;font-size:9px;font-weight:bold}.pending{background:#92400e33;color:#fbbf24;border:1px solid #a1620744}.ready{background:#1d4ed833;color:#60a5fa;border:1px solid #2563eb44}.delivered{background:#16653433;color:#4ade80;border:1px solid #16a34a44}.cancelled{background:#7f1d1d33;color:#f87171;border:1px solid #ef444444}
.details{display:none;padding:0 15px 16px;border-top:1px solid #ffffff12}.card.open .details{display:block}.section-title{font-size:13px;font-weight:bold;margin:14px 0 9px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.info-box{padding:10px;border-radius:11px;background:#0003;font-size:10px;color:#cbd5e1;line-height:1.6}.info-box b{display:block;color:#fff;margin-bottom:3px}.order{margin-top:9px;padding:12px;border-radius:16px;background:#0004;border:1px solid #ffffff12}.order-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}.order-no{flex:1;font-size:11px;font-weight:bold}.order-date{font-size:9px;color:#94a3b8}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.order-detail{padding:9px;border-radius:10px;background:#ffffff08;font-size:10px;color:#cbd5e1}.order-detail b{display:block;color:#fff;margin-bottom:3px}.timeline{margin-top:9px;padding:10px;border-radius:11px;background:#ffffff06;font-size:9px;color:#cbd5e1;line-height:1.9}.timeline span{color:#94a3b8}.color-line{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10px;color:#cbd5e1}.color-dot{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff33}
.actions{display:flex;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid #ffffff12}.action{flex:1;padding:12px;border:0;border-radius:12px;color:#fff;font-weight:bold;font-size:11px}.save-customer{background:linear-gradient(135deg,#22c55e,#15803d)}.delete{background:linear-gradient(135deg,#ef4444,#b91c1c)}.action:disabled{opacity:.55;cursor:not-allowed}
.empty{padding:40px 15px;text-align:center;border-radius:21px;background:#ffffff09;border:1px solid #ffffff12;color:#94a3b8}.empty strong{display:block;font-size:17px;color:#fff;margin-bottom:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:78px;background:#020617f5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}.nav{height:100%;max-width:500px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}.nav a{text-decoration:none;color:#94a3b8;font-size:9px;text-align:center;min-width:45px;direction:ltr}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}
@media(max-width:360px){.stats{grid-template-columns:1fr 1fr}.info-grid,.order-grid{grid-template-columns:1fr}.nav a{font-size:8px}.nav i{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<a href="index.html" class="back">←</a>
<div class="title"><h1>🆕 New Users</h1><p>نئے کسٹمرز کے موجودہ Orders</p></div>
<button id="refresh" class="refresh" type="button">↻</button>
</div>

<input id="search" class="search" type="search" placeholder="🔍 نام، موبائل یا Account No. تلاش کریں" autocomplete="off">

<div class="stats">
<div class="stat"><b id="totalUsers">0</b><span>New Users</span></div>
<div class="stat"><b id="totalOrders">0</b><span>Active Orders</span></div>
<div class="stat"><b id="pendingCount">0</b><span>Pending</span></div>
<div class="stat"><b id="deliveredCount">0</b><span>Delivered</span></div>
</div>

<div id="msg" class="msg"></div>
<div id="list"></div>
</div>

<div class="bottom"><div class="nav">
<a href="index.html"><i>🏠</i>Home</a>
<a href="add-order.html"><i>➕</i>Add Order</a>
<a href="customers.html"><i>👥</i>Customers</a>
<a href="new-users.html" class="active"><i>🆕</i>New Users</a>
<a href="menu.html"><i>☰</i>Menu</a>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let all=[];
const $=id=>document.getElementById(id),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");const n=v=>Math.max(0,Number(v)||0);
function dv(v){if(!v)return null;if(v?.toDate)return v.toDate();if(v?.seconds)return new Date(v.seconds*1000);const d=new Date(v);return isNaN(d)?null:d}function dt(v){const d=dv(v);return d?d.toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short"}):"—"}
function status(o){const s=String(o.status||o.orderStatus||"").toLowerCase();const p=String(o.paymentStatus||"").toLowerCase();if(s.includes("deliver"))return["delivered","📦 Delivered"];if(["paid","complete_paid","completed_paid","yes","true"].includes(p))return["paid","💳 Completed Paid"];if(s.includes("ready")||s.includes("shop"))return["ready","🏪 Ready In Shop"];if(s.includes("cancel"))return["cancelled","❌ Cancelled"];return["pending","🟡 Pending"]}
async function load(){try{$("msg").textContent="⏳ New Users history لوڈ ہو رہی ہے...";const[cs,os]=await Promise.all([getDocs(collection(db,"users",user.uid,"customers")),getDocs(collection(db,"users",user.uid,"orders"))]);const orders=os.docs.map(d=>({id:d.id,...d.data()}));all=cs.docs.map(d=>{const c={id:d.id,...d.data()};const customerOrders=orders.filter(o=>o.customerId===c.id||(!o.customerId&&String(o.customerType||"").toLowerCase()==="new"&&String(o.phone||"")===String(c.phone||"")));return{...c,orders:customerOrders.sort((a,b)=>(dv(b.createdAt||b.orderDate)?.getTime()||0)-(dv(a.createdAt||a.orderDate)?.getTime()||0))}}).filter(c=>String(c.customerType||"").toLowerCase()==="new"||c.orders.some(o=>String(o.customerType||"").toLowerCase()==="new"));update();render();$("msg").textContent=all.length?`✅ ${all.length} New User records محفوظ ہیں`:"";}catch(e){console.error(e);$("msg").textContent="❌ Data لوڈ نہیں ہوا: "+e.message}}
function update(){let active=0,pending=0,delivered=0;all.forEach(c=>c.orders.forEach(o=>{const[s]=status(o);if(s!=="delivered"&&s!=="cancelled")active++;if(s==="pending")pending++;if(s==="delivered")delivered++}));$("totalUsers").textContent=all.length;$("totalOrders").textContent=active;$("pendingCount").textContent=pending;$("deliveredCount").textContent=delivered}
function render(){const q=$("search").value.toLowerCase().trim();const data=q?all.filter(c=>(c.name+" "+c.phone+" "+c.accountNo).toLowerCase().includes(q)):all;const list=$("list");list.innerHTML="";if(!data.length){list.innerHTML=`<div class="empty"><strong>🆕 کوئی New User نہیں</strong>${q?"Search کے مطابق کوئی record نہیں ملا":"New Users کے records یہاں رہیں گے، Delivery کے بعد بھی۔"}</div>`;return}data.forEach(c=>{const pieces=c.orders.reduce((s,o)=>s+n(o.quantity||o.qty||o.pieces||1),0),counts={pending:0,ready:0,paid:0,delivered:0,cancelled:0};c.orders.forEach(o=>counts[status(o)[0]]++);const card=document.createElement("div");card.className="card";card.innerHTML=`<div class="head" data-open><div class="avatar">${c.photo?`<img src="${esc(c.photo)}" loading="lazy">`:"👤"}</div><div class="info"><div class="name">${esc(c.name||"نام نہیں")}</div><div class="meta">📞 ${esc(c.phone||"-")}<br>📦 Total Orders: ${c.orders.length} · 👕 ${pieces} کپڑے</div><div class="summary"><span class="pill pending">🟤 ${counts.pending} Pending</span><span class="pill ready">🔵 ${counts.ready} Ready</span><span class="pill delivered">🟢 ${counts.delivered} Delivered</span><span class="pill">💳 ${counts.paid} Paid</span></div></div><span class="account">#${esc(c.accountNo||"-")}</span></div><div class="details"><div class="st">👤 Customer Record</div><div class="grid"><div class="d"><b>نام</b>${esc(c.name||"-")}</div><div class="d"><b>فون</b>${esc(c.phone||"-")}</div><div class="d"><b>Account No.</b>${esc(c.accountNo||"-")}</div><div class="d"><b>Customer Created</b>${esc(dt(c.createdAt))}</div></div><div class="st">🧾 مکمل Order History</div>${c.orders.map((o,i)=>{const[s,label]=status(o),qty=n(o.quantity||o.qty||o.pieces||1),color=o.color&&typeof o.color==='object'?(o.color.name||o.color.hex):o.color||o.clothColor||"—";return `<div class="order"><div class="order-top"><div class="order-no">🧾 Order #${esc(o.orderNo||o.id.slice(-6).toUpperCase())}</div><span class="status ${s}">${label}</span></div><div class="order-grid"><div class="order-detail"><b>👕 کپڑے</b>${qty}</div><div class="order-detail"><b>🎨 رنگ</b>${esc(color)}</div><div class="order-detail"><b>📅 Order Date</b>${esc(dt(o.orderDate||o.createdAt))}</div><div class="order-detail"><b>🟢 Complete</b>${esc(dt(o.completedAtIso||o.completedAt))}</div><div class="order-detail"><b>🏪 Ready</b>${esc(dt(o.readyInShopAtIso||o.readyInShopAt||o.readyAt))}</div><div class="order-detail"><b>📦 Delivered</b>${esc(dt(o.deliveredAtIso||o.deliveredAt))}</div><div class="order-detail"><b>💳 Payment</b>${esc(o.paymentStatus||"—")}</div><div class="order-detail"><b>💰 بقایا</b>Rs ${n(o.remainingAmount??o.remaining).toLocaleString("en-PK")}</div></div></div>`}).join("")}</div>`;card.querySelector(".head").onclick=()=>card.classList.toggle("open");list.appendChild(card)})}
$("search").oninput=render;$("refresh").onclick=load;onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;await load()});
</script>
</body>
</html>
