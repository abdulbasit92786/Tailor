<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor Manager - Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(145deg,#020617,#172554,#312e81);color:#fff;padding:18px}
.card{max-width:430px;margin:auto;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:24px;box-shadow:0 20px 50px #0006;backdrop-filter:blur(18px)}
.back{display:inline-flex;width:44px;height:44px;border-radius:14px;align-items:center;justify-content:center;background:#ffffff16;color:#fff;text-decoration:none;font-size:22px}
h1{text-align:center;margin:8px 0 5px;font-size:24px}
.sub{text-align:center;color:#b9c3d6;font-size:12px;margin-bottom:24px}
.photoBox{text-align:center;margin-bottom:22px}
.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #ffffff33;background:linear-gradient(145deg,#6366f1,#06b6d4);display:block;margin:auto}
.photoBtns{display:flex;gap:9px;justify-content:center;margin-top:14px}
.photoBtns label,.photoBtns button{border:0;border-radius:13px;padding:10px 13px;background:#ffffff15;color:#fff;font-size:12px;cursor:pointer}
input[type=file]{display:none}
.field{margin-top:16px}
.field label{display:block;color:#cbd5e1;font-size:12px;margin-bottom:7px}
.field input{width:100%;padding:14px;border:1px solid #ffffff18;border-radius:14px;background:#0003;color:#fff;outline:none;font-size:14px}
.email{opacity:.65}
.save{width:100%;margin-top:20px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
.logout{width:100%;margin-top:12px;padding:14px;border:1px solid #ef444455;border-radius:15px;background:#ef44441c;color:#fecaca;font-weight:bold;font-size:14px;cursor:pointer}
.msg{text-align:center;min-height:20px;margin-top:13px;font-size:12px;color:#a7f3d0}
</style>
</head>
<body>
<div class="card">
<a href="index.html" class="back">←</a>
<h1>My Profile</h1>
<div class="sub">Tailor Manager Account</div>

<div class="photoBox">
<img id="photo" class="photo" alt="Profile">
<div class="photoBtns">
<label>📷 Camera<input id="camera" type="file" accept="image/*" capture="user"></label>
<label>🖼️ Gallery<input id="gallery" type="file" accept="image/*"></label>
</div>
</div>

<div class="field">
<label>Your Name</label>
<input id="name" type="text" placeholder="Enter your name">
</div>

<div class="field">
<label>Google Email</label>
<input id="email" class="email" type="text" readonly>
</div>

<button id="save" class="save">💾 Save Profile</button>
<button id="logout" class="logout">🚪 Logout</button>
<div id="msg" class="msg"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app);
const $=id=>document.getElementById(id);
let user=null,photoData="";

function showPhoto(src){
if(src)$("photo").src=src;
else $("photo").src="data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"><rect width="100%" height="100%" fill="#4f46e5"/><text x="50%" y="55%" text-anchor="middle" font-size="45">👤</text></svg>');
}

onAuthStateChanged(auth,u=>{
if(!u){location.replace("login.html");return}
user=u;
$("name").value=u.displayName||"";
$("email").value=u.email||"";
photoData=localStorage.getItem("profilePhoto_"+u.uid)||u.photoURL||"";
showPhoto(photoData);
});

function chooseFile(file){
if(!file||!user)return;
const r=new FileReader();
r.onload=()=>{photoData=r.result;showPhoto(photoData)};
r.readAsDataURL(file);
}
$("camera").onchange=e=>chooseFile(e.target.files[0]);
$("gallery").onchange=e=>chooseFile(e.target.files[0]);

$("save").onclick=async()=>{
if(!user)return;
const name=$("name").value.trim();
if(!name){$("msg").textContent="Please enter your name.";return}
try{
await updateProfile(user,{displayName:name});
if(photoData)localStorage.setItem("profilePhoto_"+user.uid,photoData);
$("msg").textContent="Profile saved successfully.";
}catch(e){$("msg").textContent="Could not save: "+e.message}
};

$("logout").onclick=async()=>{
try{await signOut(auth);localStorage.removeItem("isLoggedIn");location.replace("login.html")}
catch(e){$("msg").textContent="Logout failed: "+e.message}
};
</script>
</body>
</html>
