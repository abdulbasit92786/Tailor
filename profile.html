<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor Manager - Profile</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;min-height:100vh;padding:18px;color:#fff;
background:linear-gradient(145deg,#020617,#172554,#312e81)
}
.card{
max-width:430px;margin:auto;padding:24px;border-radius:28px;
background:#ffffff12;border:1px solid #ffffff20;
box-shadow:0 20px 50px #0007;backdrop-filter:blur(18px)
}
.back{
display:inline-flex;width:44px;height:44px;border-radius:14px;
align-items:center;justify-content:center;background:#ffffff16;
color:#fff;text-decoration:none;font-size:22px
}
h1{text-align:center;margin:8px 0 5px;font-size:24px}
.sub{text-align:center;color:#b9c3d6;font-size:12px;margin-bottom:24px}

.photoBox{text-align:center;margin-bottom:20px}
.photo{
width:110px;height:110px;border-radius:50%;object-fit:cover;
border:4px solid #ffffff44;background:#4f46e5;
display:block;margin:auto
}
.photoBtns{
display:flex;gap:9px;justify-content:center;margin-top:14px
}
.photoBtns label{
border:0;border-radius:13px;padding:10px 13px;
background:#ffffff18;color:#fff;font-size:12px;cursor:pointer
}
input[type=file]{display:none}

.field{margin-top:16px}
.field label{
display:block;color:#cbd5e1;font-size:12px;margin-bottom:7px
}
.field input{
width:100%;padding:14px;border:1px solid #ffffff20;
border-radius:14px;background:#0004;color:#fff;
outline:none;font-size:14px
}
.email{opacity:.65}

.btn{
width:100%;margin-top:12px;padding:15px;border:0;
border-radius:15px;color:#fff;font-weight:bold;
font-size:14px;cursor:pointer
}
.save{background:linear-gradient(135deg,#22c55e,#15803d)}
.logout{
background:#ef44441c;border:1px solid #ef444455;
color:#fecaca
}
.msg{
text-align:center;min-height:22px;margin-top:13px;
font-size:12px;color:#a7f3d0;line-height:1.5
}
</style>
</head>

<body>

<div class="card">

<a href="index.html" class="back">←</a>

<h1>My Profile</h1>
<div class="sub">Tailor Manager Account</div>

<div class="photoBox">

<img id="photo" class="photo" alt="Profile Photo">

<div class="photoBtns">

<label>
📷 Camera
<input id="camera" type="file" accept="image/*" capture="user">
</label>

<label>
🖼️ Gallery
<input id="gallery" type="file" accept="image/*">
</label>

</div>
</div>

<div class="field">
<label>Your Name</label>
<input id="name" type="text" placeholder="Enter your name">
</div>

<div class="field">
<label>Google Email</label>
<input id="email" class="email" type="text" readonly>
</div>

<button id="save" class="btn save">
💾 Save Profile
</button>

<button id="logout" class="btn logout">
🚪 Logout
</button>

<div id="msg" class="msg"></div>

</div>

<script type="module">

import{initializeApp}from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import{
getAuth,onAuthStateChanged,signOut
}from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import{
getFirestore,doc,getDoc,setDoc
}from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let user=null;
let photoData="";


function message(text){
$("msg").textContent=text;
}


function defaultPhoto(){
$("photo").src=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110">'+
'<rect width="100%" height="100%" fill="#4f46e5"/>'+
'<text x="50%" y="60%" text-anchor="middle" font-size="48">👤</text>'+
'</svg>'
);
}


function showPhoto(src){
if(src){
$("photo").src=src;
}else{
defaultPhoto();
}
}


/* =========================
   LOAD USER DATA
========================= */

onAuthStateChanged(auth,async u=>{

if(!u){
location.replace("login.html");
return;
}

user=u;

$("email").value=u.email||"";
$("name").value=u.displayName||"";

try{

const ref=doc(db,"users",u.uid);
const snap=await getDoc(ref);

if(snap.exists()){

const data=snap.data();

$("name").value=data.name||u.displayName||"";
photoData=data.profilePhoto||"";

showPhoto(photoData||u.photoURL);

}else{

showPhoto(u.photoURL);

}

}catch(e){

console.log(e);
showPhoto(u.photoURL);

}

});


/* =========================
   IMAGE COMPRESS
========================= */

function processImage(file){

if(!file)return;

if(file.size>10*1024*1024){

message("تصویر 10 MB سے کم منتخب کریں۔");
return;

}

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const max=600;

let w=img.width;
let h=img.height;

if(w>max||h>max){

if(w>h){
h=h*max/w;
w=max;
}else{
w=w*max/h;
h=max;
}

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

/*
 JPEG compression
 */

photoData=canvas.toDataURL("image/jpeg",0.70);

showPhoto(photoData);

message("تصویر تیار ہے۔ اب Save Profile دبائیں۔");

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}


$("camera").onchange=e=>{
processImage(e.target.files[0]);
};

$("gallery").onchange=e=>{
processImage(e.target.files[0]);
};


/* =========================
   SAVE PROFILE
========================= */

$("save").onclick=async()=>{

if(!user){

message("پہلے Google سے Login کریں۔");
return;

}

const name=$("name").value.trim();

if(!name){

message("براہ کرم اپنا نام لکھیں۔");
return;

}

try{

message("Saving...");

const data={

name:name,

email:user.email||"",

profilePhoto:photoData||user.photoURL||"",

updatedAt:new Date().toISOString()

};

await setDoc(
doc(db,"users",user.uid),
data,
{merge:true}
);

message("✅ Profile کامیابی سے محفوظ ہوگئی۔");

}catch(e){

console.error(e);

message("❌ Save نہیں ہوا: "+e.message);

}

};


/* =========================
   LOGOUT
========================= */

$("logout").onclick=async()=>{

try{

await signOut(auth);

location.replace("login.html");

}catch(e){

message("Logout failed: "+e.message);

}

};

</script>

</body>
  </html>
