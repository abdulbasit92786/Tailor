<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Customer - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;padding:16px 16px 105px;background:radial-gradient(circle at top left,#334155 0,transparent 35%),radial-gradient(circle at bottom right,#312e81 0,transparent 40%),linear-gradient(145deg,#020617,#0f172a)}
button,input{font-family:inherit}.app{max-width:480px;margin:auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}.back,.refresh{width:46px;height:46px;min-width:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff20;color:#fff;text-decoration:none;font-size:21px;cursor:pointer}.title{flex:1;text-align:center}.title h1{font-size:20px}.title p{font-size:11px;color:#94a3b8;margin-top:4px}
.search{width:100%;padding:15px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:14px;margin-bottom:14px}.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}.search::placeholder{color:#718096}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{text-align:center;padding:11px 5px;background:#ffffff0b;border:1px solid #ffffff12;border-radius:15px}.stat b{display:block;font-size:19px}.stat span{font-size:9px;color:#94a3b8}
.msg{text-align:center;font-size:12px;min-height:22px;margin:6px 0;color:#a7f3d0}
.card{margin-bottom:12px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;box-shadow:0 10px 25px #0004;overflow:hidden}.head{padding:15px;display:flex;gap:10px;align-items:center;cursor:pointer}.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:22px}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.name{font-size:15px;font-weight:bold;margin-bottom:4px}.meta{font-size:11px;color:#94a3b8;line-height:1.7}.account{font-size:9px;padding:5px 7px;border-radius:9px;background:#6366f122;color:#c7d2fe;white-space:nowrap}.arrow{font-size:18px;color:#94a3b8;transition:.2s}.card.open .arrow{transform:rotate(180deg);color:#fff}
.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 18px}.card.open .details{display:block}.st{font-size:13px;font-weight:bold;margin:16px 0 9px}.grid,.edit-grid,.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.d{padding:10px;border-radius:11px;background:#0003;font-size:11px;color:#cbd5e1;min-height:45px}.d b{display:block;color:#fff;margin-bottom:4px}
.edit-grid{gap:9px}.measure-box label{display:block;font-size:10px;color:#cbd5e1;margin-bottom:5px}.measure-box input{width:100%;padding:11px;border-radius:11px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:12px}.measure-box input:focus{border-color:#6366f1}
.option input{display:none}.option label{display:block;padding:11px 5px;text-align:center;border-radius:12px;border:1px solid #ffffff18;background:#ffffff08;font-size:11px;color:#cbd5e1;cursor:pointer}.option input:checked+label{background:linear-gradient(135deg,#6366f1,#4338ca);border-color:#818cf8;color:#fff}
.color-grid{display:grid;grid-template-columns:70px 1fr;gap:9px}.color-picker{width:70px;height:44px;padding:3px;border-radius:11px;border:1px solid #ffffff20;background:#fff;cursor:pointer}.color-name{width:100%;padding:11px;border-radius:11px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:12px}
.timeline{display:grid;gap:7px}.time{padding:10px;border-radius:11px;background:#0003;font-size:10px;color:#cbd5e1}.time b{display:block;color:#fff;margin-bottom:4px}
.save{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:bold;font-size:14px;margin-top:15px;cursor:pointer}.save:disabled{opacity:.6;cursor:not-allowed}
.empty{padding:35px 15px;text-align:center;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;color:#94a3b8}.empty strong{display:block;font-size:16px;color:#fff;margin-bottom:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:75px;background:#020617f5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around}.nav a{text-decoration:none;color:#94a3b8;font-size:9px;text-align:center;min-width:45px}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}
@media(max-width:360px){.grid,.edit-grid,.options{grid-template-columns:1fr}.nav a{font-size:8px;min-width:40px}.nav i{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<a href="add-order.html" class="back">→</a>
<div class="title"><h1>👤 Old / Regular Customer</h1><p>اس Customer کے لیے نیا Order</p></div>
<button id="refresh" class="refresh">↻</button>
</div>

<input id="search" class="search" type="search" placeholder="🔍 نام، موبائل یا Account No. تلاش کریں" autocomplete="off">

<div class="stats">
<div class="stat"><b id="total">0</b><span>Total Customers</span></div>
<div class="stat"><b id="shown">0</b><span>Showing</span></div>
<div class="stat"><b id="orders">0</b><span>Orders</span></div>
</div>
<div id="msg" class="msg"></div>
<div id="list"><div class="empty"><strong>⏳ Customers لوڈ ہو رہے ہیں...</strong>براہ کرم انتظار کریں۔</div></div>
</div>

<div class="bottom"><div class="nav">
<a href="index.html"><i>🏠</i>Home</a>
<a href="add-order.html" class="active"><i>➕</i>Add Order</a>
<a href="customers.html"><i>👥</i>Customers</a>
<a href="new-users.html"><i>🆕</i>New Users</a>
<a href="menu.html"><i>☰</i>Menu</a>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,serverTimestamp,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,all=[],orderCountByCustomer=new Map();

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const fields=[["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],["chest","چھاتی"],["waist","کمر"],["daman","دامن"],["shalwarLength","شلوار لمبائی"],["pancha","پانچہ"]];
const designNames={twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"};

function dateValue(v){
if(!v)return null;
if(v?.toDate)return v.toDate();
if(typeof v==="object"&&typeof v.seconds!=="undefined")return new Date(v.seconds*1000);
const d=new Date(v);return isNaN(d.getTime())?null:d;
}
function fmt(v){
const d=dateValue(v);if(!d)return "ریکارڈ موجود نہیں";
return d.toLocaleString("ur-PK",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function orderDate(o){return o.createdAt||o.orderDate||o.orderedAt||null}

onAuthStateChanged(auth,async u=>{
if(!u){location.replace("login.html");return}
user=u;await load();
});

async function load(){
$("msg").textContent="⏳ Data تیزی سے لوڈ ہو رہا ہے...";
try{
/* دونوں collections parallel میں لوڈ */
const [cs,os]=await Promise.all([
getDocs(collection(db,"users",user.uid,"customers")),
getDocs(collection(db,"users",user.uid,"orders"))
]);
all=cs.docs.map(d=>({id:d.id,...d.data()}));
const orders=os.docs.map(d=>({id:d.id,...d.data()}));
orderCountByCustomer=new Map();
orders.forEach(o=>{
const id=o.customerId;
if(!id)return;
orderCountByCustomer.set(id,(orderCountByCustomer.get(id)||0)+1);
});
$("orders").textContent=orders.length;
all.sort((a,b)=>Number(a.accountNo||0)-Number(b.accountNo||0));
$("total").textContent=all.length;
$("msg").textContent="";
render(all);
}catch(e){
console.error(e);$("msg").textContent="❌ Data لوڈ نہیں ہوا: "+e.message;
}}
function render(data){
$("shown").textContent=data.length;
const list=$("list");list.innerHTML="";
if(!data.length){list.innerHTML='<div class="empty"><strong>👥 کوئی Customer نہیں</strong>اس وقت کوئی محفوظ Customer موجود نہیں۔</div>';return}
const frag=document.createDocumentFragment();
data.forEach(c=>{
const m=c.measurements||{},d=c.designs||{},card=document.createElement("div");card.className="card";
const avatar=c.photo?`<img src="${esc(c.photo)}" alt="Customer" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='👤'">`:"👤";
const count=orderCountByCustomer.get(c.id)||0;
card.innerHTML=`
<div class="head">
<div class="avatar">${avatar}</div>
<div class="info"><div class="name">${esc(c.name||"-")}</div><div class="meta">📱 ${esc(c.phone||"-")}<br>📍 ${esc(c.address||"-")}</div></div>
<div class="account">#${esc(c.accountNo||"-")}<br><small>${count} Orders</small></div><div class="arrow">⌄</div>
</div>
<div class="details">
<div class="st">👤 Customer Information</div>
<div class="grid">
<div class="d"><b>نام</b>${esc(c.name||"-")}</div>
<div class="d"><b>فون نمبر</b>${esc(c.phone||"-")}</div>
<div class="d"><b>پتہ</b>${esc(c.address||"-")}</div>
<div class="d"><b>Account No.</b>#${esc(c.accountNo||"-")}</div>
<div class="d"><b>Orders</b>${count}</div>
<div class="d"><b>Customer Created</b>${fmt(c.createdAt)}</div>
<div class="d"><b>Last Updated</b>${fmt(c.updatedAt)}</div>
</div>

<div class="st">📏 مستقل محفوظ ناپ</div>
<div class="grid">${fields.map(([k,n])=>`<div class="d"><b>${n}</b>${esc(m[k]||"-")}</div>`).join("")}</div>

<div class="st">✏️ اس Order کے لیے ناپ</div>
<div class="edit-grid">${fields.map(([k,n])=>`<div class="measure-box"><label>${n}</label><input id="${k}-${esc(c.id)}" value="${esc(m[k]||"")}" placeholder="${n}"></div>`).join("")}</div>

<div class="st">✂️ اس Order کا Design</div>
<div class="options">${Object.entries(designNames).map(([k,n])=>`<div class="option"><input id="${k}-${esc(c.id)}" type="checkbox" ${d[k]?"checked":""}><label for="${k}-${esc(c.id)}">${n}</label></div>`).join("")}</div>

<div class="st">🎨 کپڑے کا رنگ</div>
<div class="color-grid"><input id="color-${esc(c.id)}" class="color-picker" type="color" value="${esc(c.lastOrderColor?.hex||"#000000")}"><input id="colorName-${esc(c.id)}" class="color-name" value="${esc(c.lastOrderColor?.name||"")}" placeholder="کالا / Black"></div>

<div class="st">🕒 Customer Record Timeline</div>
<div class="timeline">
<div class="time"><b>Customer Created</b>${fmt(c.createdAt)}</div>
<div class="time"><b>Last Updated</b>${fmt(c.updatedAt)}</div>
</div>

<div class="st">💰 آرڈر کی قیمت</div><input id="totalPrice-${esc(c.id)}" type="number" min="0" inputmode="decimal" placeholder="کل قیمت Rs.">

<button class="save" data-id="${esc(c.id)}">🧵 Add to Pending Order</button>
</div>`;
card.querySelector(".head").onclick=()=>card.classList.toggle("open");
card.querySelector(".save").onclick=e=>{e.stopPropagation();addOrder(c,card,e.currentTarget)};
frag.appendChild(card);
});
list.appendChild(frag);
}

async function addOrder(c,card,button){
button.disabled=true;button.textContent="⏳ Pending میں محفوظ ہو رہا ہے...";
try{
const measurements={};fields.forEach(([k])=>measurements[k]=document.getElementById(k+"-"+c.id)?.value.trim()||"");
const designs={};Object.keys(designNames).forEach(k=>designs[k]=!!document.getElementById(k+"-"+c.id)?.checked);
const color={name:document.getElementById("colorName-"+c.id)?.value.trim()||"",hex:document.getElementById("color-"+c.id)?.value||"#000000"};
const now=serverTimestamp();
await addDoc(collection(db,"users",user.uid,"orders"),{
customerId:c.id,customerName:c.name||"",phone:c.phone||"",address:c.address||"",accountNo:c.accountNo||null,
measurements,designs,color,status:"pending",customerType:"old",userId:user.uid,totalPrice:Number(document.getElementById("totalPrice-"+c.id)?.value||0),receivedAmount:0,remainingAmount:Number(document.getElementById("totalPrice-"+c.id)?.value||0),paymentStatus:"unpaid",
createdAt:now,orderDate:now,orderedAt:now
});
$("msg").textContent="✅ نیا Order Pending میں شامل ہوگیا۔";
button.textContent="✅ Pending میں شامل ہوگیا";
setTimeout(()=>location.href="pending.html",600);
}catch(e){
console.error(e);$("msg").textContent="❌ Order محفوظ نہیں ہوا: "+e.message;button.disabled=false;button.textContent="🧵 Add to Pending Order";
}}
let searchTimer;
$("search").oninput=()=>{
clearTimeout(searchTimer);
searchTimer=setTimeout(()=>{
const q=$("search").value.toLowerCase().trim();
render(!q?all:all.filter(c=>[c.name,c.phone,c.accountNo].some(v=>String(v||"").toLowerCase().includes(q))));
},80);
};
$("refresh").onclick=load;
</script>
</body>
</html>
