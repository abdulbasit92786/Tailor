<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Old Customer - Tailor Manager</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:#fff;
background:
radial-gradient(circle at top left,#334155 0%,transparent 35%),
radial-gradient(circle at bottom right,#312e81 0%,transparent 40%),
linear-gradient(145deg,#020617,#0f172a);
padding:16px 16px 105px
}

.app{
max-width:480px;
margin:auto
}

/* TOP */

.top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:18px
}

.back,
.refresh{
width:46px;
height:46px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
background:#ffffff12;
border:1px solid #ffffff20;
color:#fff;
text-decoration:none;
font-size:21px;
cursor:pointer
}

.title{
flex:1;
text-align:center
}

.title h1{
font-size:21px
}

.title p{
font-size:11px;
color:#94a3b8;
margin-top:4px
}

/* SEARCH */

.search-box{
position:relative;
margin-bottom:15px
}

.search{
width:100%;
padding:15px 45px 15px 15px;
border-radius:17px;
border:1px solid #ffffff18;
background:#ffffff0d;
color:#fff;
outline:none;
font-size:14px
}

.search::placeholder{
color:#718096
}

.search-icon{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
font-size:20px;
color:#94a3b8
}

/* STATS */

.stats{
display:flex;
gap:9px;
margin-bottom:15px
}

.stat{
flex:1;
padding:12px 7px;
border-radius:16px;
text-align:center;
background:#ffffff0b;
border:1px solid #ffffff12
}

.stat b{
display:block;
font-size:19px
}

.stat span{
font-size:10px;
color:#94a3b8
}

/* MESSAGE */

.msg{
text-align:center;
font-size:12px;
color:#a7f3d0;
min-height:22px;
margin:8px 0
}

/* CUSTOMER CARD */

.customer{
margin-bottom:12px;
border-radius:21px;
background:#ffffff0b;
border:1px solid #ffffff14;
box-shadow:0 10px 25px #0004;
overflow:hidden
}

.customer-head{
padding:15px;
display:flex;
align-items:center;
gap:11px;
cursor:pointer
}

.customer-head:active{
transform:scale(.99)
}

.avatar{
width:52px;
height:52px;
min-width:52px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#6366f1,#4338ca);
font-size:23px;
overflow:hidden
}

.info{
flex:1;
min-width:0
}

.name{
font-weight:bold;
font-size:15px;
margin-bottom:5px
}

.meta{
font-size:11px;
color:#94a3b8;
line-height:1.7
}

.account{
font-size:10px;
padding:5px 8px;
border-radius:10px;
background:#6366f122;
color:#c7d2fe;
white-space:nowrap
}

.arrow{
font-size:16px;
color:#94a3b8;
transition:.2s
}

.customer.open .arrow{
transform:rotate(180deg)
}

/* DETAILS */

.details{
display:none;
padding:0 15px 17px;
border-top:1px solid #ffffff12
}

.customer.open .details{
display:block
}

.section-title{
font-size:13px;
font-weight:bold;
margin:15px 0 9px
}

.detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.detail{
padding:10px;
border-radius:11px;
background:#0003;
font-size:11px;
color:#cbd5e1;
min-height:45px
}

.detail b{
display:block;
color:#fff;
margin-bottom:4px
}

/* DESIGNS */

.designs{
display:flex;
flex-wrap:wrap;
gap:6px
}

.design{
padding:7px 9px;
border-radius:10px;
background:#6366f122;
border:1px solid #6366f133;
color:#c7d2fe;
font-size:10px
}

.no-design{
font-size:11px;
color:#64748b
}

/* ORDER SECTION */

.order-box{
margin-top:16px;
padding:14px;
border-radius:17px;
background:#0004;
border:1px solid #ffffff12
}

.order-title{
font-size:13px;
font-weight:bold;
margin-bottom:12px
}

/* COLOR */

.color-row{
display:flex;
align-items:center;
gap:9px
}

.color-picker{
width:52px;
height:44px;
padding:2px;
border:1px solid #ffffff25;
border-radius:12px;
background:#fff;
cursor:pointer
}

.color-name{
flex:1;
padding:12px;
border-radius:12px;
border:1px solid #ffffff18;
background:#ffffff0d;
color:#fff;
outline:none;
font-size:12px
}

.color-name::placeholder{
color:#718096
}

/* ADD BUTTON */

.add-order{
width:100%;
margin-top:13px;
padding:15px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#22c55e,#15803d);
color:#fff;
font-weight:bold;
font-size:14px;
cursor:pointer;
box-shadow:0 8px 25px #22c55e44
}

.add-order:disabled{
opacity:.6
}

/* EMPTY */

.empty{
padding:35px 15px;
text-align:center;
background:#ffffff09;
border:1px solid #ffffff12;
border-radius:22px;
color:#94a3b8
}

.empty strong{
display:block;
font-size:16px;
color:#fff;
margin-bottom:8px
}

/* BOTTOM NAV */

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:75px;
background:#020617f5;
border-top:1px solid #ffffff15;
backdrop-filter:blur(18px);
z-index:99
}

.nav{
height:100%;
max-width:480px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-around
}

.nav a{
text-decoration:none;
color:#94a3b8;
font-size:9px;
text-align:center
}

.nav i{
display:block;
font-style:normal;
font-size:20px;
margin-bottom:3px
}

.nav .active{
color:#fff
}

@media(max-width:360px){

.detail-grid{
grid-template-columns:1fr
}

.nav a{
font-size:8px
}

.nav i{
font-size:18px
}

}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="top">

<a href="add-order.html" class="back">→</a>

<div class="title">
<h1>👤 Old Customer</h1>
<p>Regular Customer Order</p>
</div>

<button id="refresh" class="refresh">↻</button>

</div>


<!-- SEARCH -->

<div class="search-box">

<span class="search-icon">🔍</span>

<input
id="search"
class="search"
type="search"
placeholder="نام، موبائل نمبر یا Account No. تلاش کریں"
>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
<b id="total">0</b>
<span>Customers</span>
</div>

<div class="stat">
<b id="shown">0</b>
<span>Showing</span>
</div>

</div>


<div id="msg" class="msg"></div>

<div id="list"></div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

<div class="nav">

<a href="index.html">
<i>🏠</i>Home
</a>

<a href="add-order.html" class="active">
<i>➕</i>Add Order
</a>

<a href="customers.html">
<i>👥</i>Customers
</a>

<a href="new-users.html">
<i>🆕</i>New Users
</a>

<a href="history.html">
<i>📋</i>History
</a>

<a href="menu.html">
<i>☰</i>Menu
</a>

</div>

</div>


<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:"tailor-web-f1f1c.firebaseapp.com",

projectId:"tailor-web-f1f1c",

storageBucket:"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:"129811668871",

appId:"1:129811668871:web:586357e9e696a9652ffd22"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let currentUser=null;

let customers=[];


const $=id=>document.getElementById(id);


/* AUTH */

onAuthStateChanged(auth,async user=>{

if(!user){

location.replace("login.html");

return;

}

currentUser=user;

await loadCustomers();

});


/* LOAD CUSTOMERS */

async function loadCustomers(){

try{

$("msg").textContent="⏳ Customers لوڈ ہو رہے ہیں...";

const ref=collection(
db,
"users",
currentUser.uid,
"customers"
);

const snap=await getDocs(ref);

customers=[];

snap.forEach(doc=>{

customers.push({

id:doc.id,

...doc.data()

});

});


customers.sort((a,b)=>{

return Number(a.accountNo||0)-
Number(b.accountNo||0);

});


$("total").textContent=customers.length;

$("msg").textContent="";

render(customers);


}catch(error){

console.error(error);

$("msg").textContent=
"❌ Customers لوڈ نہیں ہو سکے: "+
error.message;

}

}


/* RENDER */

function render(data){

const list=$("list");

$("shown").textContent=data.length;


if(!data.length){

list.innerHTML=`

<div class="empty">

<strong>👥 کوئی Customer نہیں</strong>

اس وقت کوئی محفوظ Customer موجود نہیں۔

</div>

`;

return;

}


list.innerHTML="";


data.forEach(customer=>{

const card=document.createElement("div");

card.className="customer";


const m=customer.measurements||{};

const d=customer.designs||{};


/* DESIGN NAMES */

const names={

twoPiece:"ٹو پیس",

band:"بین",

roundDaman:"گول دامن",

squareDaman:"چورس دامن",

bothSides:"دوبغل",

front:"سامنے",

shalwarPocket:"شلوار جیب",

tilaGoot:"تیلا گوٹ",

fitCuff:"فیٹ کف",

simpleSleeve:"سادہ آستین",

cuffed:"کف دار"

};


const designs=[];


Object.keys(names).forEach(key=>{

if(d[key]){

designs.push(names[key]);

}

});


/* AVATAR */

let avatar="👤";


if(customer.photo){

avatar=
`<img
src="${escapeHtml(customer.photo)}"
style="width:100%;height:100%;object-fit:cover"
alt="Customer"
>`;

}


/* CARD */

card.innerHTML=`

<div class="customer-head">

<div class="avatar">
${avatar}
</div>


<div class="info">

<div class="name">
${escapeHtml(customer.name||"نام نہیں")}
</div>

<div class="meta">
📱 ${escapeHtml(customer.phone||"-")}<br>
📍 ${escapeHtml(customer.address||"-")}
</div>

</div>


<div class="account">
#${escapeHtml(customer.accountNo||"-")}
</div>


<div class="arrow">
⌄
</div>

</div>


<div class="details">

<div class="section-title">
👤 Customer Information
</div>

<div class="detail-grid">

${detail("نام",customer.name)}

${detail("فون نمبر",customer.phone)}

${detail("علاقہ / پتہ",customer.address)}

${detail("Account No.",customer.accountNo)}

</div>


<div class="section-title">
📏 محفوظ ناپ
</div>

<div class="detail-grid">

${measurement("لمبائی",m.length)}

${measurement("تیرا",m.tera)}

${measurement("آستین",m.sleeve)}

${measurement("گلہ",m.neck)}

${measurement("چھاتی",m.chest)}

${measurement("کمر",m.waist)}

${measurement("دامن",m.daman)}

${measurement("شلوار لمبائی",m.shalwarLength)}

${measurement("پانچہ",m.pancha)}

</div>


<div class="section-title">
✂️ مستقل ڈیزائن
</div>

<div class="designs">

${
designs.length

?

designs.map(x=>
`<span class="design">${escapeHtml(x)}</span>`
).join("")

:

`<span class="no-design">
کوئی مستقل ڈیزائن محفوظ نہیں
</span>`

}

</div>


<!-- ORDER -->

<div class="order-box">

<div class="order-title">
🧵 اس Customer کا نیا Order
</div>


<div class="color-row">

<input
type="color"
class="color-picker"
id="color-${customer.id}"
value="#000000"
>

<input
type="text"
class="color-name"
id="colorName-${customer.id}"
placeholder="کپڑے کا رنگ، مثلاً کالا / Black"
>

</div>


<button
class="add-order"
data-id="${customer.id}"
>
➕ Add to Order — Pending
</button>

</div>


</div>

`;


/* OPEN / CLOSE */

const head=card.querySelector(".customer-head");

head.onclick=()=>{

card.classList.toggle("open");

};


/* ADD ORDER */

const addButton=
card.querySelector(".add-order");


addButton.onclick=async event=>{

event.stopPropagation();

await addOrder(customer,addButton);

};


list.appendChild(card);

});

}


/* ADD ORDER */

async function addOrder(customer,button){

if(!currentUser){

$("msg").textContent=
"پہلے Login کریں۔";

return;

}


const color=
document.getElementById(
`color-${customer.id}`
).value;


const colorName=
document.getElementById(
`colorName-${customer.id}`
).value.trim();


button.disabled=true;

button.textContent=
"⏳ Order محفوظ ہو رہا ہے...";


try{

const m=customer.measurements||{};

const d=customer.designs||{};


/*
 IMPORTANT:
Customer کو دوبارہ customers collection
میں SAVE نہیں کیا جا رہا۔
صرف orders collection میں نیا Order بنے گا۔
*/


await addDoc(

collection(
db,
"users",
currentUser.uid,
"orders"
),

{

customerId:customer.id,

customerName:customer.name||"",

phone:customer.phone||"",

address:customer.address||"",

accountNo:customer.accountNo||null,

measurements:m,

designs:d,

color:{

name:colorName,

hex:color

},

status:"pending",

createdAt:serverTimestamp(),

userId:currentUser.uid

}

);


$("msg").textContent=
"✅ Order Pending میں شامل ہوگیا۔";


button.textContent=
"✅ Pending میں شامل ہوگیا";


setTimeout(()=>{

location.href="pending.html";

},1000);


}catch(error){

console.error(error);

$("msg").textContent=
"❌ Order محفوظ نہیں ہوا: "+
error.message;


button.disabled=false;

button.textContent=
"➕ Add to Order — Pending";

}

}


/* DETAIL */

function detail(name,value){

return`

<div class="detail">

<b>${escapeHtml(name)}</b>

${escapeHtml(value||"-")}

</div>

`;

}


/* MEASUREMENT */

function measurement(name,value){

return`

<div class="detail">

<b>${escapeHtml(name)}</b>

${escapeHtml(value||"-")}

</div>

`;

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value??"")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* SEARCH */

$("search").addEventListener(
"input",
()=>{

const q=$("search")
.value
.trim()
.toLowerCase();


if(!q){

render(customers);

return;

}


const result=customers.filter(customer=>{

return(

String(customer.name||"")
.toLowerCase()
.includes(q)

||

String(customer.phone||"")
.toLowerCase()
.includes(q)

||

String(customer.accountNo||"")
.toLowerCase()
.includes(q)

);

});


render(result);

});


/* REFRESH */

$("refresh").onclick=async()=>{

await loadCustomers();

};

</script>

</body>
  </html>
