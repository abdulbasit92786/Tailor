<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Customer</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:linear-gradient(145deg,#020617,#0f172a);color:#fff;padding:16px 16px 90px}.app{max-width:480px;margin:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}.back,.refresh{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff20;color:#fff;text-decoration:none}.title{flex:1;text-align:center}.title h1{font-size:20px}.title p{font-size:11px;color:#94a3b8}.search{width:100%;padding:15px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;margin-bottom:14px}.stats{display:flex;gap:9px;margin-bottom:14px}.stat{flex:1;text-align:center;padding:12px;background:#ffffff0b;border-radius:16px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#94a3b8}.card{margin-bottom:12px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;overflow:hidden}.head{padding:15px;display:flex;gap:10px;align-items:center}.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#4338ca}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1}.meta{font-size:11px;color:#94a3b8;line-height:1.7}.details{border-top:1px solid #ffffff12;padding:0 15px 17px}.st{font-size:13px;font-weight:bold;margin:15px 0 9px}.grid,.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.d{padding:10px;border-radius:11px;background:#0003;font-size:11px;color:#cbd5e1}.d b{display:block;color:#fff;margin-bottom:4px}input{width:100%;padding:11px;border-radius:11px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff}.options{margin-top:8px}.option input{display:none}.option label{display:block;padding:11px 5px;text-align:center;border-radius:12px;border:1px solid #ffffff18;background:#ffffff08;font-size:11px}.option input:checked+label{background:#4f46e5}.save{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:bold;margin-top:12px}@media(max-width:360px){.grid,.options{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><a href="add-order.html" class="back">→</a><div class="title"><h1>👤 Old / Regular Customer</h1><p>اس Order کے لیے الگ ناپ</p></div><a href="#" id="refresh" class="refresh">↻</a></div><input id="search" class="search" placeholder="🔍 نام، موبائل نمبر یا Account No."><div class="stats"><div class="stat"><b id="total">0</b><span>Customers</span></div><div class="stat"><b id="shown">0</b><span>Showing</span></div></div><div id="list"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user,all=[];const $=x=>document.getElementById(x),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const fields=[["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],["chest","چھاتی"],["waist","کمر"],["daman","دامن"],["shalwarLength","شلوار لمبائی"],["pancha","پانچہ"]],names={twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"};onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html");user=u;load()});async function load(){let s=await getDocs(collection(db,"users",user.uid,"customers"));all=s.docs.map(x=>({id:x.id,...x.data()}));$("total").textContent=all.length;render(all)}function render(a){$("shown").textContent=a.length;let l=$("list");l.innerHTML="";a.forEach(c=>{let m=c.measurements||{},d=c.designs||{},card=document.createElement("div");card.className="card";card.innerHTML=`<div class="head"><div class="avatar">${c.photo?`<img src="${esc(c.photo)}">`:"👤"}</div><div class="info"><b>${esc(c.name||"-")}</b><div class="meta">📱 ${esc(c.phone||"-")}<br>📍 ${esc(c.address||"-")}</div></div></div><div class="details"><div class="st">📏 موجودہ مستقل ناپ</div><div class="grid">${fields.map(x=>`<div class="d"><b>${x[1]}</b>${esc(m[x[0]]||"-")}</div>`).join("")}</div><div class="st">✏️ اس Order کے لیے ناپ بدلیں</div><div class="grid">${fields.map(x=>`<div><label>${x[1]}</label><input id="${x[0]}-${c.id}" value="${esc(m[x[0]]||"")}"></div>`).join("")}</div><div class="st">✂️ Design</div><div class="options">${Object.entries(names).map(([k,v])=>`<div class="option"><input id="${k}-${c.id}" type="checkbox" ${d[k]?"checked":""}><label for="${k}-${c.id}">${v}</label></div>`).join("")}</div><div class="st">🎨 کپڑے کا رنگ</div><div class="grid"><input id="color-${c.id}" type="color" value="#000000"><input id="colorName-${c.id}" placeholder="کالا / Black"></div><button class="save" data-id="${c.id}">🧵 Add to Pending Order</button></div>`;card.querySelector(".save").onclick=()=>add(c);l.appendChild(card)})}async function add(c){let id=c.id,b=document.querySelector(`[data-id="${CSS.escape(id)}"]`);b.disabled=true;b.textContent="⏳ محفوظ ہو رہا ہے...";try{let m={},d={};fields.forEach(x=>m[x[0]]=$(x[0]+"-"+id).value.trim());Object.keys(names).forEach(k=>d[k]=$(k+"-"+id).checked);await addDoc(collection(db,"users",user.uid,"orders"),{customerId:id,customerName:c.name||"",phone:c.phone||"",address:c.address||"",accountNo:c.accountNo||null,measurements:m,designs:d,color:{name:$("colorName-"+id).value.trim(),hex:$("color-"+id).value},status:"pending",createdAt:serverTimestamp(),userId:user.uid});b.textContent="✅ Pending میں شامل ہوگیا";setTimeout(()=>location.href="pending.html",700)}catch(e){console.error(e);b.disabled=false;b.textContent="❌ دوبارہ کوشش کریں"}}$("search").oninput=()=>{let q=$("search").value.toLowerCase().trim();render(q?all.filter(c=>[c.name,c.phone,c.accountNo].some(v=>String(v||"").toLowerCase().includes(q))):all)};$("refresh").onclick=e=>{e.preventDefault();load()};
</script></body></html>
