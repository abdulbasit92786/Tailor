<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Old Customer - Tailor Manager</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
color:#fff;

background:
radial-gradient(circle at 10% 0%,#3730a3 0%,transparent 32%),
radial-gradient(circle at 100% 30%,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at 0% 100%,#064e3b 0%,transparent 28%),
linear-gradient(145deg,#020617,#0f172a);

padding:16px 16px 105px
}

button,
input{
font-family:inherit
}

.app{
width:100%;
max-width:480px;
margin:auto
}


/* =================================================
TOP
================================================= */

.top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:18px
}

.back,
.refresh{
width:46px;
height:46px;
min-width:46px;

border-radius:15px;

display:flex;
align-items:center;
justify-content:center;

background:#ffffff10;
border:1px solid #ffffff1c;

color:#fff;
text-decoration:none;

font-size:21px;
cursor:pointer;

transition:.2s
}

.back:active,
.refresh:active{
transform:scale(.92)
}

.refresh{
background:linear-gradient(135deg,#334155,#1e293b)
}

.title{
flex:1;
text-align:center
}

.title h1{
font-size:21px;
font-weight:bold;
letter-spacing:.2px
}

.title p{
font-size:11px;
color:#94a3b8;
margin-top:4px
}


/* =================================================
SEARCH
================================================= */

.search-box{
position:relative;
margin-bottom:15px
}

.search{
width:100%;

padding:15px 48px 15px 15px;

border-radius:17px;

border:1px solid #ffffff18;

background:#ffffff0d;

color:#fff;

outline:none;

font-size:14px;

box-shadow:
inset 0 1px 0 #ffffff08,
0 8px 25px #0002;

transition:.2s
}

.search:focus{
border-color:#818cf8;

background:#ffffff12;

box-shadow:
0 0 0 3px #6366f122,
0 8px 25px #0003
}

.search::placeholder{
color:#64748b
}

.search-icon{
position:absolute;

right:15px;
top:50%;

transform:translateY(-50%);

font-size:20px;

color:#a5b4fc;

pointer-events:none
}


/* =================================================
STATS
================================================= */
.stats{
display:flex;
gap:9px;
margin-bottom:15px
}

.stat{
flex:1;

padding:13px 7px;

border-radius:17px;

text-align:center;

background:
linear-gradient(
135deg,
#ffffff0d,
#ffffff05
);

border:1px solid #ffffff12;

box-shadow:
0 8px 20px #0002
}

.stat b{
display:block;
font-size:20px;
margin-bottom:3px
}

.stat span{
font-size:10px;
color:#94a3b8
}


/* =================================================
MESSAGE
================================================= */

.msg{
text-align:center;

font-size:12px;

color:#a7f3d0;

min-height:22px;

margin:8px 0 10px;

line-height:1.6
}


/* =================================================
CUSTOMER CARD
================================================= */

.customer{
margin-bottom:13px;

border-radius:23px;

background:
linear-gradient(
145deg,
#ffffff0e,
#ffffff06
);

border:1px solid #ffffff15;

box-shadow:
0 15px 35px #0004,
inset 0 1px 0 #ffffff08;

overflow:hidden;

transition:.25s
}

.customer.open{
border-color:#6366f155;

box-shadow:
0 18px 40px #0005,
0 0 0 1px #6366f122
}


/* =================================================
CUSTOMER HEAD
================================================= */

.customer-head{
padding:16px;

display:flex;
align-items:center;
gap:11px;

cursor:pointer;

background:
linear-gradient(
135deg,
#ffffff06,
transparent
)
}

.customer-head:active{
transform:scale(.995)
}

.avatar{
width:54px;
height:54px;

min-width:54px;

border-radius:18px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#6366f1,
#4338ca
);

border:1px solid #818cf855;

font-size:23px;

overflow:hidden;

box-shadow:
0 7px 18px #312e8155
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.info{
flex:1;
min-width:0
}

.name{
font-weight:bold;
font-size:15px;

margin-bottom:5px;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.meta{
font-size:11px;

color:#94a3b8;

line-height:1.8;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.account{
font-size:10px;

padding:6px 9px;

border-radius:11px;

background:#6366f122;

border:1px solid #6366f133;

color:#c7d2fe;

white-space:nowrap
}

.arrow{
font-size:18px;

color:#94a3b8;

transition:.25s;

margin-right:1px
}

.customer.open .arrow{
transform:rotate(180deg);

color:#a5b4fc
}


/* =================================================
DETAILS
================================================= */
.details{
display:none;

padding:0 16px 18px;

border-top:1px solid #ffffff12
}

.customer.open .details{
display:block;

animation:openDetails .22s ease
}

@keyframes openDetails{

from{
opacity:0;
transform:translateY(-5px)
}

to{
opacity:1;
transform:translateY(0)
}

}


/* =================================================
SECTION TITLES
================================================= */

.section-title{
font-size:13px;

font-weight:bold;

margin:17px 0 9px;

display:flex;
align-items:center;

gap:7px;

color:#f8fafc
}

.section-title::after{
content:"";

height:1px;

flex:1;

background:linear-gradient(
90deg,
#ffffff18,
transparent
)
}


/* =================================================
CUSTOMER INFO
================================================= */

.info-box{
display:flex;
flex-direction:column;
gap:7px
}

.detail{
padding:11px 12px;

border-radius:13px;

background:#0003;

border:1px solid #ffffff09;

font-size:11px;

color:#cbd5e1;

line-height:1.6
}

.detail b{
display:block;

color:#fff;

font-size:10px;

margin-bottom:3px
}


/* =================================================
MEASUREMENTS
================================================= */

/*
IMPORTANT:
تمام ناپ ایک ہی column میں
اوپر سے نیچے جائیں گے۔
*/

.measurements{
display:flex;

flex-direction:column;

gap:7px
}

.measurement{
width:100%;

padding:12px 13px;

border-radius:13px;

background:
linear-gradient(
90deg,
#ffffff08,
#0003
);

border:1px solid #ffffff0b;

display:flex;

align-items:center;

justify-content:space-between;

font-size:12px;

color:#cbd5e1
}

.measurement-name{
color:#94a3b8
}

.measurement-value{
font-weight:bold;

color:#fff;

padding:4px 9px;

border-radius:9px;

background:#6366f122;

border:1px solid #6366f133;

min-width:45px;

text-align:center
}


/* =================================================
DESIGNS
================================================= */

.designs{
display:flex;

flex-wrap:wrap;

gap:7px
}

.design{
padding:8px 10px;

border-radius:11px;

background:
linear-gradient(
135deg,
#6366f125,
#4338ca18
);

border:1px solid #6366f133;

color:#c7d2fe;

font-size:10px;

box-shadow:
0 4px 12px #0002
}

.no-design{
font-size:11px;

color:#64748b;

padding:8px
}


/* =================================================
ORDER BOX
================================================= */

.order-box{
margin-top:18px;

padding:15px;

border-radius:19px;

background:
linear-gradient(
145deg,
#0005,
#0002
);

border:1px solid #ffffff12;

box-shadow:
inset 0 1px 0 #ffffff06
}

.order-title{
font-size:13px;

font-weight:bold;

margin-bottom:13px;

color:#f8fafc
}

.order-sub{
font-size:10px;

color:#64748b;

margin-top:-7px;

margin-bottom:13px
}


/* =================================================
COLOR
================================================= */
.color-row{
display:flex;

align-items:center;

gap:9px
}

.color-picker{
width:53px;
height:45px;

padding:2px;

border:1px solid #ffffff25;

border-radius:13px;

background:#fff;

cursor:pointer;

flex-shrink:0
}

.color-name{
flex:1;

padding:12px;

border-radius:13px;

border:1px solid #ffffff18;

background:#ffffff0d;

color:#fff;

outline:none;

font-size:12px
}

.color-name:focus{
border-color:#818cf8;

background:#ffffff12
}

.color-name::placeholder{
color:#64748b
}


/* =================================================
ADD ORDER BUTTON
================================================= */

.add-order{
width:100%;

margin-top:13px;

padding:15px;

border:0;

border-radius:15px;

background:
linear-gradient(
135deg,
#22c55e,
#15803d
);

color:#fff;

font-weight:bold;

font-size:14px;

cursor:pointer;

box-shadow:
0 9px 25px #22c55e33;

transition:.2s
}

.add-order:active{
transform:scale(.98)
}

.add-order:disabled{
opacity:.6;

cursor:not-allowed;

transform:none
}


/* =================================================
EMPTY
================================================= */

.empty{
padding:38px 16px;

text-align:center;

background:#ffffff09;

border:1px solid #ffffff12;

border-radius:23px;

color:#94a3b8;

box-shadow:0 12px 30px #0003
}

.empty-icon{
font-size:40px;

margin-bottom:10px
}

.empty strong{
display:block;

font-size:16px;

color:#fff;

margin-bottom:8px
}

.empty p{
font-size:11px;

line-height:1.8
}


/* =================================================
BOTTOM NAV
================================================= */

.bottom{
position:fixed;

left:0;
right:0;
bottom:0;

height:78px;

background:#020617f7;

border-top:1px solid #ffffff15;

backdrop-filter:blur(20px);

-webkit-backdrop-filter:blur(20px);

z-index:99
}

.nav{
height:100%;

max-width:480px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-around;

/* ہمیشہ Home سے Menu تک
Left → Right رہے گا */
direction:ltr
}

.nav a{
text-decoration:none;

color:#94a3b8;

font-size:9px;

text-align:center;

direction:ltr;

min-width:45px;

transition:.2s
}

.nav a:active{
transform:scale(.92)
}

.nav i{
display:block;

font-style:normal;

font-size:20px;

margin-bottom:3px
}

.nav .active{
color:#fff
}

.nav .active i{
filter:drop-shadow(0 0 6px #818cf8)
}


/* =================================================
LOADING
================================================= */
.loading{
padding:38px 15px;

text-align:center;

color:#94a3b8;

font-size:13px
}


/* =================================================
MOBILE
================================================= */

@media(max-width:360px){

.nav a{
font-size:8px;

min-width:40px
}

.nav i{
font-size:18px
}

.customer-head{
padding:14px
}

.details{
padding-left:14px;
padding-right:14px
}

}

</style>
</head>


<body>


<div class="app">

TOP
================================================= -->

<div class="top">

<a

placeholder="نام، موبائل نمبر یا Account No. تلاش کریں"

>

<b id="total">
0
</b>

<span>
Customers

<b id="shown">
0
</b>

<span>
Showing
</span>

</div>

================================================= -->

</div>


</div>


<!-- =================================================

Home

</a>

href="add-order.html"
class="active">

</div>

<script type="module">


/* =================================================
FIREBASE IMPORTS
================================================= */
import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import{
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =================================================
FIREBASE CONFIG
================================================= */

const firebaseConfig={

apiKey:
"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:
"tailor-web-f1f1c.firebaseapp.com",

projectId:
"tailor-web-f1f1c",

storageBucket:
"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:
"129811668871",

appId:
"1:129811668871:web:586357e9e696a9652ffd22"

};


/* =================================================
FIREBASE START
================================================= */

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =================================================
VARIABLES
================================================= */

let currentUser=null;

let customers=[];


/* =================================================
HELPER
================================================= */

const $=
id=>document.getElementById(id);


/* =================================================
AUTH
================================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.replace("login.html");

return;

}

currentUser=user;

await loadCustomers();

});


/* =================================================
LOAD CUSTOMERS
================================================= */

async function loadCustomers(){

try{

$("msg").textContent=
"⏳ Customers لوڈ ہو رہے ہیں...";


const ref=
collection(
db,
"users",
currentUser.uid,
"customers"
);


const snap=
await getDocs(ref);


customers=[];


snap.forEach(docSnap=>{

customers.push({

id:docSnap.id,

...docSnap.data()

});

});


/*
Account Number کے حساب سے
چھوٹے نمبر سے بڑے نمبر تک
*/

customers.sort((a,b)=>{

return Number(a.accountNo||0)
-
Number(b.accountNo||0);

});


$("total").textContent=
customers.length;

$("msg").textContent="";


render(customers);


}catch(error){

console.error(error);

$("msg").textContent=
"❌ Customers لوڈ نہیں ہو سکے: "+
error.message;

}

}


/* =================================================
RENDER CUSTOMERS
================================================= */

function render(data){

const list=$("list");


$("shown").textContent=
data.length;


if(!data.length){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
👥
</div>

<strong>
کوئی Customer نہیں ملا
</strong>

<p>
اس وقت کوئی محفوظ Customer موجود نہیں۔
<br>
پہلے Customers میں نیا Customer محفوظ کریں۔
</p>

</div>

`;

return;

}


list.innerHTML="";


data.forEach(customer=>{

const card=
document.createElement("div");

card.className="customer";


const m=
customer.measurements||{};

const d=
customer.designs||{};


/* =================================================
DESIGN NAMES
================================================= */

const names={

twoPiece:"ٹو پیس",

band:"بین",

roundDaman:"گول دامن",

squareDaman:"چورس دامن",

bothSides:"دوبغل",

front:"سامنے",

shalwarPocket:"شلوار جیب",

tilaGoot:"تیلا گوٹ",

fitCuff:"فیٹ کف",

simpleSleeve:"سادہ آستین",

cuffed:"کف دار"

};


const designs=[];


Object.keys(names)
.forEach(key=>{

if(d[key]){

designs.push(
names[key]
);

}

});


/* =================================================
AVATAR
================================================= */

let avatar="👤";


if(customer.photo){

avatar=`

<img
src="${escapeHtml(customer.photo)}"
alt="Customer"
onerror="
this.style.display='none';
this.parentElement.textContent='👤';
"
>

`;

}


/* =================================================
CARD HTML
================================================= */

card.innerHTML=`

<div class="customer-head">


<div class="avatar">

${avatar}

</div>


<div class="info">


<div class="name">

${escapeHtml(
customer.name||"نام نہیں"
)}

</div>


<div class="meta">

📱 ${escapeHtml(
customer.phone||"فون نمبر نہیں"
)}

<br>

📍 ${escapeHtml(
customer.address||"پتہ نہیں"
)}

</div>


</div>


<div class="account">

#${escapeHtml(
customer.accountNo||"-"
)}

</div>


<div class="arrow">

⌄

</div>


</div>


<div class="details">


<!-- CUSTOMER INFORMATION -->

<div class="section-title">

👤 کسٹمر کی معلومات

</div>


<div class="info-box">


${detail(
"نام",
customer.name
)}


${detail(
"فون نمبر",
customer.phone
)}


${detail(
"علاقہ / مکمل پتہ",
customer.address
)}


${detail(
"Account No.",
customer.accountNo
)}


</div>


<!-- MEASUREMENTS -->

<div class="section-title">

📏 محفوظ ناپ

</div>


<div class="measurements">


${measurement(
"لمبائی",
m.length
)}


${measurement(
"تیرا",
m.tera
)}


${measurement(
"آستین",
m.sleeve
)}


${measurement(
"گلہ",
m.neck
)}


${measurement(
"چھاتی",
m.chest
)}


${measurement(
"کمر",
m.waist
)}


${measurement(
"دامن",
m.daman
)}


${measurement(
"شلوار لمبائی مکمل",
m.shalwarLength
)}


${measurement(
"پانچہ",
m.pancha
)}


</div>


<!-- DESIGNS -->

<div class="section-title">

✂️ مستقل ڈیزائن

</div>


<div class="designs">


${
designs.length

?

designs.map(x=>`

<span class="design">

${escapeHtml(x)}

</span>

`).join("")

:

`

<span class="no-design">

کوئی مستقل ڈیزائن محفوظ نہیں

</span>

`

}


</div>


<!-- ORDER -->

<div class="order-box">


<div class="order-title">

🧵 اس Customer کا نیا Order

</div>


<div class="order-sub">

محفوظ ناپ اور مستقل ڈیزائن اسی Order میں شامل ہوں گے۔

</div>


<div class="color-row">


<input
type="color"
class="color-picker"
id="color-${customer.id}"
value="#000000"
aria-label="کپڑے کا رنگ"
>


<input
type="text"
class="color-name"
id="colorName-${customer.id}"
placeholder="کپڑے کا رنگ، مثلاً کالا / Black"
>


</div>


<button
class="add-order"
data-id="${escapeHtml(customer.id)}"
>

➕ Add to Order — Pending

</button>


</div>


</div>

`;


/* =================================================
OPEN / CLOSE
================================================= */
const head=
card.querySelector(
".customer-head"
);


head.onclick=()=>{

card.classList.toggle(
"open"
);

};


/* =================================================
ADD ORDER
================================================= */

const addButton=
card.querySelector(
".add-order"
);


addButton.onclick=
async event=>{

event.stopPropagation();

await addOrder(
customer,
addButton
);

};


list.appendChild(card);

});

}


/* =================================================
ADD ORDER
================================================= */

async function addOrder(
customer,
button
){

if(!currentUser){

$("msg").textContent=
"❌ پہلے Login کریں۔";

return;

}


const colorElement=
document.getElementById(
`color-${customer.id}`
);


const colorNameElement=
document.getElementById(
`colorName-${customer.id}`
);


const color=
colorElement
?colorElement.value
:"#000000";


const colorName=
colorNameElement
?colorNameElement.value.trim()
:"";


button.disabled=true;

button.textContent=
"⏳ Order محفوظ ہو رہا ہے...";


try{


const m=
customer.measurements||{};


const d=
customer.designs||{};


/*
IMPORTANT:

Customer کو customers collection
میں دوبارہ SAVE نہیں کیا جا رہا۔

صرف نیا Order بنایا جا رہا ہے۔

اس لیے ایک ہی Customer کے
کئی Orders بن سکتے ہیں۔
*/


await addDoc(

collection(
db,
"users",
currentUser.uid,
"orders"
),

{

/* CUSTOMER LINK */

customerId:
customer.id,

/* =================================================
DETAIL
================================================= */
function detail(
name,
value
){

return`

<div class="detail">

<b>
${escapeHtml(name)}
</b>

${escapeHtml(
value||"-"
)}

</div>

`;

}


/* =================================================
MEASUREMENT
================================================= */

function measurement(
name,
value
){

return`

<div class="measurement">

<span class="measurement-name">

${escapeHtml(name)}

</span>


<span class="measurement-value">

${escapeHtml(
value||"-"
)}

</span>

</div>

`;

}


/* =================================================
ESCAPE HTML
================================================= */

function escapeHtml(value){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =================================================
SEARCH
================================================= */

$("search")
.addEventListener(
"input",
()=>{


const q=
$("search")
.value
.trim()
.toLowerCase();


if(!q){

render(customers);

return;

}


const result=
customers.filter(
customer=>{

return(

String(
customer.name||""
)
.toLowerCase()
.includes(q)

||

String(
customer.phone||""
)
.toLowerCase()
.includes(q)

||

String(
customer.accountNo||""
)
.toLowerCase()
.includes(q)

);

});


render(result);

});
