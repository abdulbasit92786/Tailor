<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اولڈ کسٹمر</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="top"><a class="back" href="add-order.html">→</a><div class="title"><h1>👤 اولڈ کسٹمر</h1><p>نام یا نمبر سے تلاش کریں</p></div></div><input id="search" class="search" placeholder="🔎 نام، فون یا Account No."><div id="results"></div></main><nav><a href="index.html" class="">🏠<span>ہوم</span></a><a href="add-order.html" class="on">➕<span>نیا آرڈر</span></a><a href="customers.html" class="">👥<span>کسٹمرز</span></a><a href="new-users.html" class="">🆕<span>نیو یوزرز</span></a><a href="menu.html" class="">☰<span>مینو</span></a></nav><script type="module">import{requireUser,$,val,n,MEAS,DES,esc,money,dt,allOrders,allCustomers,db,stamp}from './app.js';import{collection,doc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,serverTimestamp}from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser();const cs=await allCustomers(u);const q=$('#search'),r=$('#results');function render(){const s=q.value.toLowerCase();r.innerHTML=cs.filter(c=>[c.name,c.phone,c.accountNo].some(x=>String(x||'').toLowerCase().includes(s))).map(c=>`<div class="card" style="padding:15px;margin-bottom:9px"><b>${esc(c.name)}</b><div class="muted">📱 ${esc(c.phone)} · #${esc(c.accountNo||'—')}</div><div class="actions"><button class="primary" data-id="${c.id}">➕ اس کسٹمر کا آرڈر</button></div></div>`).join('')||'<div class="empty">کسٹمر نہیں ملا</div>'}q.oninput=render;r.onclick=e=>{const b=e.target.closest('[data-id]');if(b)location.href='new-customer.html?customerId='+b.dataset.id};render();</script></body></html>
