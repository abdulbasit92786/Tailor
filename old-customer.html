<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Old Customer - Tailor Manager</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

body{

font-family:Arial,Helvetica,sans-serif;

background:
radial-gradient(
circle at top left,
#334155 0%,
transparent 35%
),

radial-gradient(
circle at bottom right,
#312e81 0%,
transparent 40%
),

linear-gradient(
145deg,
#020617,
#0f172a
);

color:#fff;

padding:16px 16px 105px;

min-height:100vh
}

.app{
max-width:480px;
margin:auto
}


/* ================= TOP ================= */

.top{

display:flex;

gap:10px;

align-items:center;

margin-bottom:16px
}

.back,
.refresh{

width:46px;

height:46px;

border-radius:15px;

display:grid;

place-items:center;

background:#ffffff12;

border:1px solid #ffffff20;

color:#fff;

text-decoration:none;

font-size:21px;

cursor:pointer
}

.refresh:active,
.back:active{
transform:scale(.95)
}

.title{

flex:1;

text-align:center
}

.title h1{
font-size:20px
}

.title p{

font-size:11px;

color:#94a3b8;

margin-top:4px
}


/* ================= SEARCH ================= */

.search-box{
position:relative;
margin-bottom:15px
}

.search{

width:100%;

padding:15px 45px 15px 15px;

border-radius:16px;

background:#ffffff0d;

border:1px solid #ffffff18;

color:#fff;

outline:none;

font-size:14px
}

.search:focus{

border-color:#6366f1;

box-shadow:
0 0 0 3px #6366f122
}

.search::placeholder{
color:#718096
}

.search-icon{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

font-size:19px;

color:#94a3b8
}


/* ================= STATS ================= */

.stats{

display:flex;

gap:9px;

margin-bottom:14px
}

.stat{

flex:1;

text-align:center;

padding:12px;

background:#ffffff0b;

border:
1px solid #ffffff12;

border-radius:16px
}

.stat b{

display:block;

font-size:20px
}

.stat span{

font-size:10px;

color:#94a3b8
}


/* ================= MESSAGE ================= */

.msg{

text-align:center;

font-size:12px;

color:#a7f3d0;

min-height:22px;

margin:7px 0
}


/* ================= CUSTOMER CARD ================= */

.card{

margin-bottom:12px;

border-radius:21px;

background:#ffffff0b;

border:
1px solid #ffffff14;

box-shadow:
0 10px 25px #0004;

overflow:hidden;

transition:.2s
}


/* ================= CUSTOMER HEAD ================= */

.head{

padding:15px;

display:flex;

gap:11px;

align-items:center;

cursor:pointer
}

.head:active{
transform:scale(.99)
}


/* ================= AVATAR ================= */

.avatar{

width:52px;

height:52px;

min-width:52px;

border-radius:50%;

overflow:hidden;

display:grid;

place-items:center;

background:
linear-gradient(
135deg,
#6366f1,
#4338ca
);

font-size:22px
}

.avatar img{

width:100%;

height:100%;

object-fit:cover
}


/* ================= CUSTOMER INFO ================= */

.info{

flex:1;

min-width:0
}

.name{

font-size:15px;

font-weight:bold;

margin-bottom:5px
}

.meta{

font-size:11px;

color:#94a3b8;

line-height:1.7
}

.account{

font-size:10px;

padding:5px 8px;

border-radius:10px;

background:#6366f122;

color:#c7d2fe;

white-space:nowrap
}


/* ================= ARROW ================= */

.arrow{

font-size:17px;

color:#94a3b8;

transition:.2s
}

.card.open .arrow{

transform:rotate(180deg);

color:#fff
}


/* ================= DETAILS ================= */

.details{

display:none;

border-top:
1px solid #ffffff12;

padding:
0 15px 18px
}

.card.open .details{

display:block
}


/* ================= SECTION TITLE ================= */

.st{

font-size:13px;

font-weight:bold;

margin:
16px 0 9px
}


/* ================= DETAIL GRID ================= */

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:8px
}

.d{

padding:10px;

border-radius:11px;

background:#0003;

font-size:11px;

color:#cbd5e1;

min-height:45px
}

.d b{

display:block;

color:#fff;

margin-bottom:4px
}


/* ================= EDIT MEASUREMENTS ================= */

.edit-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:9px
}

.measure-box label{

display:block;

font-size:10px;

color:#cbd5e1;

margin-bottom:5px
}

.measure-box input{

width:100%;

padding:11px;

border-radius:11px;

background:#ffffff0d;

border:
1px solid #ffffff18;

color:#fff;

outline:none;

font-size:12px
}

.measure-box input:focus{

border-color:#6366f1;

background:#ffffff12
}


/* ================= DESIGNS ================= */

.options{

display:grid;

grid-template-columns:
1fr 1fr;

gap:8px
}

.option input{

display:none
}

.option label{

display:block;

padding:11px 5px;

text-align:center;

border-radius:12px;

border:
1px solid #ffffff18;

background:#ffffff08;

font-size:11px;

color:#cbd5e1;

cursor:pointer
}

.option input:checked + label{

background:
linear-gradient(
135deg,
#6366f1,
#4338ca
);

border-color:#818cf8;

color:#fff;

box-shadow:
0 5px 15px #6366f133
}


/* ================= COLOR ================= */

.color-grid{

display:grid;

grid-template-columns:
70px 1fr;

gap:9px
}

.color-picker{

width:70px;

height:44px;

padding:3px;

border-radius:11px;

border:
1px solid #ffffff20;

background:#fff;

cursor:pointer
}

.color-name{

width:100%;

padding:11px;

border-radius:11px;

background:#ffffff0d;

border:
1px solid #ffffff18;

color:#fff;

outline:none;

font-size:12px
}

.color-name::placeholder{
color:#64748b
}


/* ================= ORDER BUTTON ================= */

.save{

width:100%;

padding:15px;

border:0;

border-radius:15px;

background:
linear-gradient(
135deg,
#22c55e,
#15803d
);

color:#fff;

font-weight:bold;

font-size:14px;

margin-top:15px;

cursor:pointer;

box-shadow:
0 8px 22px #22c55e33
}

.save:active{
transform:scale(.98)
}

.save:disabled{

opacity:.6;

cursor:not-allowed
}


/* ================= EMPTY ================= */

.empty{

padding:35px 15px;

text-align:center;

background:#ffffff09;

border:
1px solid #ffffff12;

border-radius:22px;

color:#94a3b8
}

.empty strong{

display:block;

font-size:16px;

color:#fff;

margin-bottom:8px
}


/* ================= BOTTOM NAV ================= */

.bottom{

position:fixed;

left:0;

right:0;

bottom:0;

height:75px;

background:#020617f5;

border-top:
1px solid #ffffff15;

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

z-index:999
}

.nav{

height:100%;

max-width:480px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-around
}

.nav a{

text-decoration:none;

color:#94a3b8;

font-size:9px;

text-align:center;

min-width:45px
}

.nav i{

display:block;

font-style:normal;

font-size:20px;

margin-bottom:3px
}

.nav .active{

color:#fff
}

.nav .active i{

filter:
drop-shadow(
0 0 6px #818cf8
)
}


/* ================= MOBILE ================= */

@media(max-width:360px){

.grid,
.edit-grid,
.options{

grid-template-columns:1fr
}

.nav a{

font-size:8px;

min-width:40px
}

.nav i{

font-size:18px
}

.color-grid{

grid-template-columns:60px 1fr
}

.color-picker{

width:60px
}

}

</style>

</head>


<body>


<div class="app">


<!-- ================= TOP ================= -->

<div class="top">

<a
href="add-order.html"
class="back"
>
→
</a>


<div class="title">

<h1>
👤 Old / Regular Customer
</h1>

<p>
اس Order کے لیے الگ ناپ
</p>

</div>


<button
id="refresh"
class="refresh"
>
↻
</button>

</div>


<!-- ================= SEARCH ================= -->

<div class="search-box">

<span class="search-icon">
🔍
</span>

<input
id="search"
class="search"
type="search"
placeholder="نام، موبائل نمبر یا Account No. تلاش کریں"
autocomplete="off"
>

</div>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

<b id="total">
0
</b>

<span>
Customers
</span>

</div>


<div class="stat">

<b id="shown">
0
</b>

<span>
Showing
</span>

</div>

</div>


<div
id="msg"
class="msg"
></div>


<!-- ================= CUSTOMER LIST ================= -->

<div id="list">

<div class="empty">

<strong>
⏳ Customers لوڈ ہو رہے ہیں...
</strong>

براہ کرم انتظار کریں۔

</div>

</div>


</div>


<!-- ================= BOTTOM NAV ================= -->

<div class="bottom">

<div class="nav">


<a href="index.html">

<i>
🏠
</i>

Home

</a>


<a
href="add-order.html"
class="active"
>

<i>
➕
</i>

Add Order

</a>


<a href="customers.html">

<i>
👥
</i>

Customers

</a>


<a href="new-user.html">

<i>
🆕
</i>

New User

</a>


<a href="history.html">

<i>
📋
</i>

History

</a>


<a href="menu.html">

<i>
☰
</i>

Menu

</a>


</div>

</div>


<script type="module">


/* ================= FIREBASE ================= */

import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import{

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import{

getFirestore,

collection,

getDocs,

addDoc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig={

apiKey:
"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:
"tailor-web-f1f1c.firebaseapp.com",

projectId:
"tailor-web-f1f1c",

storageBucket:
"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:
"129811668871",

appId:
"1:129811668871:web:586357e9e696a9652ffd22"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ================= VARIABLES ================= */

let user=null;

let all=[];


/* ================= HELPERS ================= */

const $=
id=>
document.getElementById(id);


const esc=
value=>

String(value??"")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");


/* ================= MEASUREMENTS ================= */

const fields=[

[
"length",
"لمبائی"
],

[
"tera",
"تیرا"
],

[
"sleeve",
"آستین"
],

[
"neck",
"گلہ"
],

[
"chest",
"چھاتی"
],

[
"waist",
"کمر"
],

[
"daman",
"دامن"
],

[
"shalwarLength",
"شلوار لمبائی"
],

[
"pancha",
"پانچہ"
]

];


/* ================= DESIGNS ================= */

const names={

twoPiece:
"ٹو پیس",

band:
"بین",

roundDaman:
"گول دامن",

squareDaman:
"چورس دامن",

bothSides:
"دوبغل",

front:
"سامنے",

shalwarPocket:
"شلوار جیب",

tilaGoot:
"تیلا گوٹ",

fitCuff:
"فیٹ کف",

simpleSleeve:
"سادہ آستین",

cuffed:
"کف دار"

};


/* ================= LOGIN ================= */

onAuthStateChanged(

auth,

async currentUser=>{

if(!currentUser){

location.replace(
"login.html"
);

return;

}

user=currentUser;

await load();

}

);


/* ================= LOAD CUSTOMERS ================= */

async function load(){

try{

$("msg").textContent=
"⏳ Customers لوڈ ہو رہے ہیں...";


const ref=
collection(
db,
"users",
user.uid,
"customers"
);


const snap=
await getDocs(ref);


all=
snap.docs

.map(
doc=>({

id:doc.id,

...doc.data()

})
)

.sort(
(a,b)=>

Number(
a.accountNo||0
)

-

Number(
b.accountNo||0
)

);


$("total").textContent=
all.length;


$("msg").textContent="";


render(all);


}catch(error){

console.error(error);


$("msg").textContent=
"❌ Customers لوڈ نہیں ہو سکے: "+
error.message;

}

}


/* ================= RENDER ================= */

function render(data){

$("shown").textContent=
data.length;


const list=
$("list");


list.innerHTML="";


if(!data.length){

list.innerHTML=`

<div class="empty">

<strong>
👥 کوئی Customer نہیں
</strong>

اس وقت کوئی محفوظ Customer موجود نہیں۔

</div>

`;

return;

}


data.forEach(customer=>{


const m=
customer.measurements||{};


const d=
customer.designs||{};


const card=
document.createElement("div");


card.className=
"card";


/* ================= AVATAR ================= */

let avatar="👤";


if(customer.photo){

avatar=`

<img
src="${esc(customer.photo)}"
alt="Customer"
onerror="
this.style.display='none';
this.parentElement.textContent='👤';
"
>

`;

}


/* ================= CARD ================= */

card.innerHTML=`

<!-- صرف نام، نمبر، پتہ پہلے دکھائیں -->

<div class="head">


<div class="avatar">

${avatar}

</div>


<div class="info">

<div class="name">

${esc(
customer.name||"-"
)}

</div>


<div class="meta">

📱 ${esc(
customer.phone||"-"
)}

<br>

📍 ${esc(
customer.address||"-"
)}

</div>

</div>


<div class="account">

#${esc(
customer.accountNo||"-"
)}

</div>


<div class="arrow">

⌄

</div>


</div>


<!-- مکمل Details صرف کلک کے بعد -->

<div class="details">


<!-- ================= CUSTOMER INFO ================= -->

<div class="st">

👤 Customer Information

</div>


<div class="grid">


<div class="d">

<b>
نام
</b>

${esc(
customer.name||"-"
)}

</div>


<div class="d">

<b>
فون نمبر
</b>

${esc(
customer.phone||"-"
)}

</div>


<div class="d">

<b>
علاقہ / پتہ
</b>

${esc(
customer.address||"-"
)}

</div>


<div class="d">

<b>
Account No.
</b>

${esc(
customer.accountNo||"-"
)}

</div>


</div>


<!-- ================= OLD MEASUREMENTS ================= -->

<div class="st">

📏 مستقل محفوظ ناپ

</div>


<div class="grid">


${
fields

.map(
field=>`

<div class="d">

<b>
${field[1]}
</b>

${esc(
m[field[0]]||"-"
)}

</div>

`
)

.join("")
}


</div>


<!-- ================= EDIT ORDER MEASUREMENTS ================= -->

<div class="st">

✏️ اس Order کے لیے ناپ

</div>


<div class="edit-grid">


${
fields

.map(
field=>`

<div class="measure-box">

<label>
${field[1]}
</label>

<input
id="${field[0]}-${esc(customer.id)}"
value="${esc(m[field[0]]||"")}"
placeholder="${field[1]}"
>

</div>

`
)

.join("")
}


</div>


<!-- ================= DESIGNS ================= -->

<div class="st">

✂️ اس Order کا Design

</div>


<div class="options">


${
Object.entries(names)

.map(
([key,value])=>`

<div class="option">

<input
id="${key}-${esc(customer.id)}"
type="checkbox"
${d[key]?"checked":""}
>

<label
for="${key}-${esc(customer.id)}"
>

${value}

</label>

</div>

`
)

.join("")
}


</div>


<!-- ================= COLOR ================= -->

<div class="st">

🎨 کپڑے کا رنگ

</div>


<div class="color-grid">


<input
id="color-${esc(customer.id)}"
class="color-picker"
type="color"
value="#000000"
>


<input
id="colorName-${esc(customer.id)}"
class="color-name"
type="text"
placeholder="کالا / Black"
>


</div>


<!-- ================= ADD ORDER ================= -->

<button
class="save"
data-id="${esc(customer.id)}"
>

🧵 Add to Pending Order

</button>


</div>

`;


/* ================= OPEN / CLOSE ================= */

card
.querySelector(".head")
.onclick=
()=>{

card.classList.toggle(
"open"
);

};


/* ================= ADD ORDER ================= */

card
.querySelector(".save")
.onclick=
async event=>{

event.stopPropagation();

await addOrder(
customer,
card.querySelector(".save")
);

};


list.appendChild(card);

});

}


/* ================= ADD ORDER ================= */

async function addOrder(
customer,
button
){

if(!user){

$("msg").textContent=
"❌ پہلے Login کریں۔";

return;

}


const id=
customer.id;


button.disabled=true;

button.textContent=
"⏳ Order محفوظ ہو رہا ہے...";


try{


/* ================= ORDER MEASUREMENTS ================= */

const measurements={};


fields.forEach(
field=>{

const input=
document.getElementById(
field[0]+"-"+id
);

measurements[field[0]]=
input
?
input.value.trim()
:
"";

}
);


/* ================= ORDER DESIGNS ================= */

const designs={};


Object.keys(names).forEach(
key=>{

const checkbox=
document.getElementById(
key+"-"+id
);

designs[key]=
checkbox
?
checkbox.checked
:
false;

}
);


/* ================= COLOR ================= */

const colorInput=
document.getElementById(
"color-"+id
);


const colorNameInput=
document.getElementById(
"colorName-"+id
);


const color={

name:
colorNameInput
?
colorNameInput.value.trim()
:
"",

hex:
colorInput
?
colorInput.value
:
"#000000"

};


/* ================= SAVE ORDER ================= */

await addDoc(

collection(
db,
"users",
user.uid,
"orders"
),

{

customerId:
customer.id,

customerName:
customer.name||"",

phone:
customer.phone||"",

address:
customer.address||"",

accountNo:
customer.accountNo||null,

measurements:
measurements,

designs:
designs,

color:
color,

status:
"pending",

createdAt:
serverTimestamp(),

userId:
user.uid

}

);


/* ================= SUCCESS ================= */

$("msg").style.color=
"#86efac";

$("msg").textContent=
"✅ Order Pending میں شامل ہوگیا۔";


button.textContent=
"✅ Pending میں شامل ہوگیا";


/* Pending page */

setTimeout(
()=>{

location.href=
"pending.html";

},
800
);


}catch(error){

console.error(error);


$("msg").style.color=
"#fca5a5";

$("msg").textContent=
"❌ Order محفوظ نہیں ہوا: "+
error.message;


button.disabled=false;

button.textContent=
"🧵 Add to Pending Order";

}

}


/* ================= SEARCH ================= */

$("search").oninput=
()=>{

const q=
$("search")
.value
.toLowerCase()
.trim();


if(!q){

render(all);

return;

}


const result=
all.filter(
customer=>{

return [

customer.name,

customer.phone,

customer.accountNo

]

.some(
value=>

String(
value||""
)

.toLowerCase()

.includes(q)

);

}

);


render(result);

};


/* ================= REFRESH ================= */

$("refresh").onclick=
async()=>{

await load();

};


</script>

</body>

  </html>
