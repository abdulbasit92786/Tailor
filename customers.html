<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Customers - Tailor Manager</title>

<style>

/* ================= BASIC ================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
color:#fff;

background:
radial-gradient(
circle at top left,
#334155 0%,
transparent 35%
),

radial-gradient(
circle at bottom right,
#312e81 0%,
transparent 40%
),

linear-gradient(
145deg,
#020617,
#0f172a
);

padding:16px 16px 105px
}

button,
input{
font-family:inherit
}

.app{
max-width:480px;
margin:auto
}


/* ================= TOP ================= */

.top{
display:flex;
gap:10px;
align-items:center;
margin-bottom:16px
}

.back,
.add{
width:46px;
height:46px;
border-radius:15px;

display:grid;
place-items:center;

color:#fff;
text-decoration:none;

background:#ffffff12;
border:1px solid #ffffff20;

font-size:20px
}

.add{
background:linear-gradient(
135deg,
#22c55e,
#15803d
);

border:0;

box-shadow:
0 8px 20px #22c55e33
}

.title{
flex:1;
text-align:center
}

.title h1{
font-size:21px
}

.title p{
font-size:11px;
color:#94a3b8;
margin-top:4px
}


/* ================= ADD USER ================= */

.addUserBtn{

width:100%;

padding:15px;

margin-bottom:15px;

border:0;

border-radius:16px;

background:
linear-gradient(
135deg,
#6366f1,
#4338ca
);

color:#fff;

font-size:14px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 8px 22px #6366f133;

transition:.2s
}

.addUserBtn:active{
transform:scale(.98)
}


/* ================= SEARCH ================= */

.search{
width:100%;

padding:15px;

border-radius:16px;

background:#ffffff0d;

border:1px solid #ffffff18;

color:#fff;

margin-bottom:14px;

outline:none;

font-size:14px
}

.search:focus{
border-color:#6366f1;

box-shadow:
0 0 0 3px #6366f122
}

.search::placeholder{
color:#718096
}


/* ================= STATS ================= */

.stats{
display:flex;

gap:9px;

margin-bottom:14px
}

.stat{
flex:1;

text-align:center;

padding:12px;

border-radius:16px;

background:#ffffff0b;

border:1px solid #ffffff12
}

.stat b{
display:block;

font-size:20px
}

.stat span{
font-size:10px;

color:#94a3b8
}


/* ================= MESSAGE ================= */

.msg{
text-align:center;

font-size:12px;

color:#a7f3d0;

min-height:20px;

margin:8px 0
}


/* ================= CUSTOMER CARD ================= */

.card{

margin-bottom:12px;

border-radius:21px;

background:#ffffff0b;

border:1px solid #ffffff14;

box-shadow:
0 10px 25px #0004;

overflow:hidden
}


/* ================= CUSTOMER HEAD ================= */

.head{

padding:15px;

display:flex;

align-items:center;

gap:10px;

cursor:pointer
}

.head:active{
transform:scale(.99)
}


/* ================= AVATAR ================= */

.avatar{

width:52px;

height:52px;

min-width:52px;

border-radius:50%;

overflow:hidden;

display:grid;

place-items:center;

background:
linear-gradient(
135deg,
#6366f1,
#4338ca
);

font-size:22px
}

.avatar img{

width:100%;

height:100%;

object-fit:cover
}


/* ================= CUSTOMER INFO ================= */

.info{
flex:1;

min-width:0
}

.name{

font-weight:bold;

font-size:15px;

margin-bottom:5px
}

.meta{

font-size:11px;

color:#94a3b8;

line-height:1.7
}

.no{

font-size:10px;

background:#6366f122;

color:#c7d2fe;

padding:5px 8px;

border-radius:10px;

white-space:nowrap
}


/* ================= DETAILS ================= */

.details{

display:none;

border-top:
1px solid #ffffff12;

padding:
0 15px 16px
}

.open .details{
display:block
}


/* ================= SECTION TITLE ================= */

.st{

font-size:13px;

font-weight:bold;

margin:
15px 0 9px
}


/* ================= DETAIL GRID ================= */

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:7px
}

.d{

padding:10px;

border-radius:11px;

background:#0003;

font-size:11px;

color:#cbd5e1;

min-height:45px
}

.d b{

display:block;

color:#fff;

margin-bottom:3px
}


/* ================= DESIGN TAGS ================= */

.tag{

display:inline-block;

padding:7px 9px;

border-radius:10px;

background:#6366f122;

border:
1px solid #6366f133;

color:#c7d2fe;

font-size:10px;

margin:3px
}


/* ================= ACTION BUTTONS ================= */

.actions{

display:flex;

gap:8px;

margin-top:15px;

padding-top:13px;

border-top:
1px solid #ffffff12
}

.btn{

flex:1;

border:0;

border-radius:12px;

padding:12px;

color:#fff;

font-weight:bold;

font-size:12px;

cursor:pointer
}

.edit{

background:
linear-gradient(
135deg,
#3b82f6,
#1d4ed8
)
}

.del{

background:
linear-gradient(
135deg,
#ef4444,
#b91c1c
)
}

.btn:active{
transform:scale(.97)
}


/* ================= EMPTY ================= */

.empty{

padding:35px 15px;

text-align:center;

background:#ffffff09;

border:
1px solid #ffffff12;

border-radius:22px;

color:#94a3b8
}

.empty strong{

display:block;

font-size:16px;

color:#fff;

margin-bottom:8px
}


/* ================= BOTTOM NAV ================= */

/*
IMPORTANT:
RTL کی وجہ سے پہلے والا بٹن دائیں طرف آ رہا تھا۔
اس لیے nav کو LTR کیا گیا ہے تاکہ:
Home = LEFT
Menu = RIGHT
*/

.bottom{

position:fixed;

left:0;

right:0;

bottom:0;

height:75px;

background:#020617f5;

border-top:
1px solid #ffffff15;

backdrop-filter:
blur(18px);

-webkit-backdrop-filter:
blur(18px);

z-index:999
}

.nav{

height:100%;

max-width:480px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-around;

/* IMPORTANT */
direction:ltr;
}

.nav a{

text-decoration:none;

color:#94a3b8;

font-size:9px;

text-align:center;

min-width:45px;

/* Text کو RTL ہی رکھیں */
direction:rtl;
}

.nav i{

display:block;

font-style:normal;

font-size:20px;

margin-bottom:3px
}

.nav .active{

color:#fff
}

.nav .active i{

filter:
drop-shadow(
0 0 6px #818cf8
)
}


/* ================= MOBILE ================= */

@media(max-width:360px){

.grid{
grid-template-columns:1fr
}

.nav a{

font-size:8px;

min-width:40px
}

.nav i{

font-size:18px
}

}

</style>

</head>


<body>


<div class="app">


<!-- ================= TOP ================= -->

<div class="top">


<a
href="index.html"
class="back"
>
←
</a>


<div class="title">

<h1>
👥 Customers
</h1>

<p>
محفوظ کسٹمرز
</p>

</div>


<!--
یہ صرف نیا Customer بنانے کے لیے ہے
-->

<a
href="new-user.html"
class="add"
title="Add New User"
>
➕
</a>


</div>


<!-- ================= ADD USER BUTTON ================= -->

<button
id="addUserBtn"
class="addUserBtn"
>

➕ Add New User / Customer

</button>


<!-- ================= SEARCH ================= -->

<input
id="search"
class="search"
type="search"
placeholder="🔍 نام، موبائل نمبر یا Account No. تلاش کریں"
autocomplete="off"
>


<!-- ================= STATS ================= -->

<div class="stats">


<div class="stat">

<b id="total">
0
</b>

<span>
Total Customers
</span>

</div>


<div class="stat">

<b id="shown">
0
</b>

<span>
Showing
</span>

</div>


</div>


<div
id="msg"
class="msg"
>
</div>


<!-- ================= CUSTOMER LIST ================= -->

<div id="list">

<div class="empty">

<strong>
⏳ Customers لوڈ ہو رہے ہیں...
</strong>

براہ کرم انتظار کریں۔

</div>

</div>


</div>


<!-- ================= BOTTOM NAV ================= -->

<div class="bottom">


<div class="nav">


<!--
ORDER:
LEFT → RIGHT

Home
Add Order
Customers
New Users
Menu
-->


<a href="index.html">

<i>
🏠
</i>

Home

</a>


<a href="add-order.html">

<i>
➕
</i>

Add Order

</a>


<a
href="customers.html"
class="active"
>

<i>
👥
</i>

Customers

</a>


<!--
IMPORTANT:
یہ New Users LIST کا page ہے۔
یہاں new-user.html نہیں لگانا۔
-->

<a href="new-users.html">

<i>
🆕
</i>

New Users

</a>

<!--
Menu ہمیشہ RIGHT CORNER پر
-->

<a href="menu.html">

<i>
☰
</i>

Menu

</a>


</div>

</div>


<script type="module">


/* ================= FIREBASE ================= */

import{

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import{

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import{

getFirestore,

collection,

getDocs,

deleteDoc,

doc

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig={

apiKey:
"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:
"tailor-web-f1f1c.firebaseapp.com",

projectId:
"tailor-web-f1f1c",

storageBucket:
"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:
"129811668871",

appId:
"1:129811668871:web:586357e9e696a9652ffd22"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ================= VARIABLES ================= */

let user=null;

let all=[];


/* ================= HELPERS ================= */

const $=
x=>
document.getElementById(x);


const esc=
v=>
String(v??"")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


/* ================= MEASUREMENTS ================= */

const fields=[

[
"length",
"لمبائی"
],

[
"tera",
"تیرا"
],

[
"sleeve",
"آستین"
],

[
"neck",
"گلہ"
],

[
"chest",
"چھاتی"
],

[
"waist",
"کمر"
],

[
"daman",
"دامن"
],

[
"shalwarLength",
"شلوار لمبائی"
],

[
"pancha",
"پانچہ"
]

];


/* ================= DESIGNS ================= */

const names={

twoPiece:
"ٹو پیس",

band:
"بین",

roundDaman:
"گول دامن",

squareDaman:
"چورس دامن",

bothSides:
"دوبغل",

front:
"سامنے",

shalwarPocket:
"شلوار جیب",

tilaGoot:
"تیلا گوٹ",

fitCuff:
"فیٹ کف",

simpleSleeve:
"سادہ آستین",

cuffed:
"کف دار"

};


/* ================= LOGIN ================= */

onAuthStateChanged(
auth,
async u=>{

if(!u){

location.replace(
"login.html"
);

return;

}

user=u;

await load();

}
);


/* ================= LOAD ================= */

async function load(){

try{

$("msg").textContent=
"⏳ Customers لوڈ ہو رہے ہیں...";


const ref=
collection(
db,
"users",
user.uid,
"customers"
);


const snap=
await getDocs(ref);


all=
snap.docs

.map(
x=>({

id:x.id,

...x.data()

})
)

.sort(
(a,b)=>

Number(
a.accountNo||0
)

-

Number(
b.accountNo||0

)
);


$("total").textContent=
all.length;


$("msg").textContent="";


render(all);


}catch(error){

console.error(error);


$("msg").textContent=
"❌ Customers لوڈ نہیں ہو سکے: "+
error.message;

}

}


/* ================= RENDER ================= */

function render(data){

$("shown").textContent=
data.length;


const list=
$("list");


list.innerHTML="";


if(!data.length){

list.innerHTML=`

<div class="empty">

<strong>
👥 کوئی Customer نہیں
</strong>

ابھی تک کوئی Customer محفوظ نہیں کیا گیا۔

</div>

`;

return;

}


data.forEach(c=>{


const m=
c.measurements||{};


const d=
c.designs||{};


const tags=
Object

.keys(names)

.filter(
k=>d[k]
)

.map(
k=>

`

<span class="tag">

${esc(names[k])}

</span>

`

)

.join("");


const card=
document.createElement("div");


card.className=
"card";


card.innerHTML=`

<div class="head">


<div class="avatar">

${
c.photo

?

`

<img
src="${esc(c.photo)}"
alt="Customer"
onerror="this.style.display='none';this.parentElement.textContent='👤'"
>

`

:

"👤"

}

</div>


<div class="info">


<div class="name">

${esc(c.name||"-")}

</div>


<div class="meta">

📱 ${esc(c.phone||"-")}

<br>

📍 ${esc(c.address||"-")}

</div>


</div>


<div class="no">

#${esc(c.accountNo||"-")}

</div>


</div>


<div class="details">


<div class="st">

👤 Customer Information

</div>


<div class="grid">


<div class="d">

<b>
نام
</b>

${esc(c.name||"-")}

</div>


<div class="d">

<b>
فون نمبر
</b>

${esc(c.phone||"-")}

</div>


<div class="d">

<b>
علاقہ / پتہ
</b>

${esc(c.address||"-")}

</div>


<div class="d">

<b>
Account No.
</b>

${esc(c.accountNo||"-")}

</div>


</div>


<div class="st">

📏 مکمل ناپ

</div>


<div class="grid">


${
fields

.map(
x=>

`

<div class="d">

<b>
${x[1]}
</b>

${esc(
m[x[0]]||"-"
)}

</div>

`

)

.join("")
}


</div>


<div class="st">

✂️ مستقل ڈیزائن

</div>


<div>

${
tags||

`

<span
style="
color:#64748b;
font-size:11px
"
>

کوئی ڈیزائن محفوظ نہیں

</span>

`
}

</div>


<div class="actions">


<button
class="btn edit"
>

✏️ Edit

</button>


<button
class="btn del"
>

🗑️ Delete

</button>


</div>


</div>

`;


/* ================= OPEN ================= */

card
.querySelector(".head")
.onclick=
()=>{

card.classList.toggle(
"open"
);

};


/* ================= EDIT ================= */

card
.querySelector(".edit")
.onclick=
e=>{

e.stopPropagation();


location.href=
"new-user.html?edit="+
encodeURIComponent(c.id);

};


/* ================= DELETE ================= */

card
.querySelector(".del")
.onclick=
async e=>{

e.stopPropagation();


const ok=
confirm(
`"${c.name||"Customer"}" کو Delete کرنا ہے؟`
);


if(!ok){

return;

}


try{

await deleteDoc(

doc(
db,
"users",
user.uid,
"customers",
c.id
)

);


$("msg").textContent=
"✅ Customer Delete ہوگیا۔";


await load();


}catch(error){

console.error(error);


$("msg").textContent=
"❌ Delete نہیں ہو سکا: "+
error.message;

}

};


list.appendChild(card);

});

}


/* ================= SEARCH ================= */

$("search").oninput=
()=>{

const q=
$("search")
.value
.toLowerCase()
.trim();


if(!q){

render(all);

return;

}


const result=
all.filter(
c=>{

return [

c.name,

c.phone,

c.accountNo

]

.some(
v=>

String(
v||""
)

.toLowerCase()

.includes(q)

);

}

);


render(result);

};


/* ================= ADD NEW CUSTOMER ================= */

/*
یہ بٹن New Users کی لسٹ نہیں کھولے گا۔
یہ براہ راست نیا Customer بنانے والا فارم کھولے گا۔
*/

$("addUserBtn").onclick=
()=>{

location.href=
"new-user.html";

};


</script>


</body>

  </html>
