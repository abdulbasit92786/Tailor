<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:linear-gradient(145deg,#020617,#0f172a);color:#fff;padding:16px 16px 90px}.app{max-width:480px;margin:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}.back,.add{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff20}.add{background:#15803d}.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#94a3b8}.search{width:100%;padding:15px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;margin-bottom:14px}.stats{display:flex;gap:9px;margin-bottom:14px}.stat{flex:1;text-align:center;padding:12px;border-radius:16px;background:#ffffff0b}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#94a3b8}.card{margin-bottom:12px;border-radius:21px;background:#ffffff0b;border:1px solid #ffffff14;overflow:hidden}.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#4338ca}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1}.name{font-weight:bold}.meta{font-size:11px;color:#94a3b8;line-height:1.7}.no{font-size:10px;background:#6366f122;padding:5px 8px;border-radius:10px}.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 16px}.open .details{display:block}.st{font-size:13px;font-weight:bold;margin:15px 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{padding:10px;border-radius:11px;background:#0003;font-size:11px;color:#cbd5e1}.d b{display:block;color:#fff;margin-bottom:3px}.tag{display:inline-block;padding:7px 9px;border-radius:10px;background:#6366f122;color:#c7d2fe;font-size:10px;margin:3px}.actions{display:flex;gap:8px;margin-top:15px}.btn{flex:1;border:0;border-radius:12px;padding:12px;color:#fff;font-weight:bold}.edit{background:#2563eb}.del{background:#dc2626}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><a href="index.html" class="back">←</a><div class="title"><h1>👥 Customers</h1><p>محفوظ کسٹمرز</p></div><a href="new-user.html" class="add">+</a></div><input id="search" class="search" placeholder="🔍 نام، موبائل نمبر یا Account No."><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="shown">0</b><span>Showing</span></div></div><div id="list"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user,all=[];const $=x=>document.getElementById(x),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const fields=[["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],["chest","چھاتی"],["waist","کمر"],["daman","دامن"],["shalwarLength","شلوار لمبائی"],["pancha","پانچہ"]],names={twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"};onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html");user=u;load()});async function load(){let s=await getDocs(collection(db,"users",user.uid,"customers"));all=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>Number(a.accountNo||0)-Number(b.accountNo||0));$("total").textContent=all.length;render(all)}function render(a){$("shown").textContent=a.length;let l=$("list");l.innerHTML="";if(!a.length)return l.innerHTML='<div style="padding:35px;text-align:center">👥 کوئی Customer نہیں</div>';a.forEach(c=>{let m=c.measurements||{},d=c.designs||{},tags=Object.keys(names).filter(k=>d[k]).map(k=>`<span class="tag">${names[k]}</span>`).join("");let card=document.createElement("div");card.className="card";card.innerHTML=`<div class="head"><div class="avatar">${c.photo?`<img src="${esc(c.photo)}">`:"👤"}</div><div class="info"><div class="name">${esc(c.name||"-")}</div><div class="meta">📱 ${esc(c.phone||"-")}<br>📍 ${esc(c.address||"-")}</div></div><div class="no">#${esc(c.accountNo||"-")}</div></div><div class="details"><div class="st">📏 مکمل ناپ</div><div class="grid">${fields.map(x=>`<div class="d"><b>${x[1]}</b>${esc(m[x[0]]||"-")}</div>`).join("")}</div><div class="st">✂️ مستقل ڈیزائن</div>${tags||"<span style='color:#64748b;font-size:11px'>کوئی ڈیزائن نہیں</span>"}<div class="actions"><button class="btn edit">✏️ Edit</button><button class="btn del">🗑️ Delete</button></div></div>`;card.querySelector(".head").onclick=()=>card.classList.toggle("open");card.querySelector(".edit").onclick=e=>{e.stopPropagation();location.href="new-user.html?edit="+c.id};card.querySelector(".del").onclick=async e=>{e.stopPropagation();if(confirm("Customer Delete کرنا ہے؟")){await deleteDoc(doc(db,"users",user.uid,"customers",c.id));load()}};l.appendChild(card)})}$("search").oninput=()=>{let q=$("search").value.toLowerCase().trim();render(q?all.filter(c=>[c.name,c.phone,c.accountNo].some(v=>String(v||"").toLowerCase().includes(q))):all)};
</script></body></html>
