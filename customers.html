<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفوظ کسٹمر</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{auth,db,requireAuth,nav,$,collection,getDocs,deleteDoc,doc,esc}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>محفوظ کسٹمر</h1><p>کسٹمر کا ناپ اور ڈیزائن مستقل محفوظ رکھیں۔</p></div><div class="card"><input id="search" placeholder="نام یا فون نمبر تلاش کریں"><div id="list" style="margin-top:15px"></div></div></main>`;let all=[];async function load(){const s=await getDocs(collection(db,'users',u.uid,'customers'));all=s.docs.map(d=>({id:d.id,...d.data()}));render(all)}function render(a){$('list').innerHTML=a.length?a.map(c=>`<div class="card" style="margin:10px 0"><div class="order-head"><div><b style="font-size:19px">${esc(c.name||'-')}</b><div class="muted">${esc(c.phone||'-')} • ${esc(c.area||'')}</div><div class="muted">${esc(c.address||'-')}</div></div><a class="primary" href="new-user.html?customer=${encodeURIComponent(c.id)}">آرڈر</a></div><details style="margin-top:14px"><summary>ناپ اور ڈیزائن دیکھیں</summary><div class="detail" style="margin-top:10px">${Object.entries(c.measurements||{}).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join('\n')}\n\n${Object.entries(c.designs||{}).filter(x=>x[1]).map(x=>x[0]).join('، ')}</div></details></div>`).join(''):'<div class="empty">ابھی کوئی محفوظ کسٹمر نہیں</div>'}$('search').oninput=()=>{let q=$('search').value.toLowerCase();render(all.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)))}load()});</script></body></html>
