<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفوظ کسٹمرز</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,addDoc,deleteDoc,doc,$,esc,fields,designs,serverTimestamp}from'./app.js';requireAuth(async u=>{app.innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>محفوظ کسٹمرز</h1><p>کسٹمر کا نام، رابطہ، علاقہ، پتہ، ناپ اور ڈیزائن محفوظ کریں۔</p></div><div class="card"><div class="row-actions"><button class="primary" id="add">＋ کسٹمر شامل کریں</button></div><div class="searchbar"><span>🔎</span><input id="q" placeholder="نام، فون یا علاقہ تلاش کریں"></div><div id="list"></div></div></main>`;bindNav();let all=[];async function load(){const s=await getDocs(collection(db,'users',u.uid,'customers'));all=s.docs.map(x=>({id:x.id,...x.data()}));render()}function render(){const q=$('q').value.trim().toLowerCase();const a=all.filter(c=>[c.name,c.phone,c.area,c.address].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=a.length?a.map(c=>`<article class="card"><div class="order-head"><div><b style="font-size:20px">${esc(c.name||'-')}</b><div class="muted">${esc(c.phone||'')} • ${esc(c.area||'')}</div><div class="muted">${esc(c.address||'')}</div></div><a class="primary" href="new-user.html?customer=${encodeURIComponent(c.id)}">آرڈر</a></div><details style="margin-top:12px"><summary style="font-weight:800;cursor:pointer">تفصیل دیکھیں</summary><div class="detail" style="margin-top:10px">${fields.map(([k,n])=>`${n}: ${esc(c.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail">ڈیزائن: ${designs.filter(([k])=>c.designs?.[k]).map(([,n])=>n).join('، ')||'-'}</div></details><button class="danger" data-del="${esc(c.id)}" style="margin-top:12px">حذف کریں</button></article>`).join(''):'<div class="empty">ابھی کوئی محفوظ کسٹمر نہیں</div>';list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('یہ کسٹمر حذف کریں؟')){await deleteDoc(doc(db,'users',u.uid,'customers',b.dataset.del));load()}})}add.onclick=()=>location.href='save-customer.html';q.oninput=render;load()});</script></body></html>
