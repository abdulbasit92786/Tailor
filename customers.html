<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers - Tailor Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;
background:radial-gradient(circle at top left,#334155 0%,transparent 35%),
radial-gradient(circle at bottom right,#312e81 0%,transparent 40%),
linear-gradient(145deg,#020617,#0f172a);
padding:16px 16px 105px
}
button,input{font-family:inherit}
.app{max-width:480px;margin:auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.back,.add{
width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff20;font-size:20px
}
.add{background:linear-gradient(135deg,#22c55e,#15803d);border:0;box-shadow:0 8px 20px #22c55e33}
.title{flex:1;text-align:center}
.title h1{font-size:21px}
.title p{font-size:11px;color:#94a3b8;margin-top:4px}

.addUserBtn{
width:100%;padding:15px;margin-bottom:15px;border:0;border-radius:16px;
background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;font-size:14px;
font-weight:bold;cursor:pointer;box-shadow:0 8px 22px #6366f133
}
.search{
width:100%;padding:15px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18;
color:#fff;margin-bottom:14px;outline:none;font-size:14px
}
.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}
.search::placeholder{color:#718096}

.stats{display:flex;gap:9px;margin-bottom:10px}
.stat{flex:1;text-align:center;padding:12px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff12}
.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#94a3b8}
.msg{text-align:center;font-size:12px;color:#a7f3d0;min-height:20px;margin:8px 0}

.card{
margin-bottom:12px;border-radius:22px;background:#ffffff0b;border:1px solid #ffffff14;
box-shadow:0 10px 25px #0004;overflow:hidden
}
.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{
width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden;display:grid;
place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);font-size:22px
}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.name{font-weight:bold;font-size:15px;margin-bottom:5px}
.meta{font-size:11px;color:#94a3b8;line-height:1.7}
.no{font-size:10px;background:#6366f122;color:#c7d2fe;padding:5px 8px;border-radius:10px;white-space:nowrap}

.head-right{display:flex;align-items:center;gap:7px}
.chevron{font-size:18px;color:#94a3b8;transition:.2s}
.card.open .chevron{transform:rotate(180deg)}

.status-summary{
display:flex;gap:5px;flex-wrap:wrap;margin:0 15px 14px;padding:9px 10px;
border-radius:14px;background:#0003;border:1px solid #ffffff0d
}
.status-pill{
display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border-radius:9px;
font-size:9px;font-weight:bold;white-space:nowrap
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:0 0 7px currentColor}
.pill-pending{background:#f59e0b20;color:#fbbf24}
.pill-ready{background:#8b5cf620;color:#c4b5fd}
.pill-completed{background:#22c55e20;color:#4ade80}
.pill-delivered{background:#0ea5e920;color:#38bdf8}
.pill-cancelled{background:#ef444420;color:#f87171}
.dot-pending{background:#f59e0b;color:#f59e0b}
.dot-ready{background:#8b5cf6;color:#8b5cf6}
.dot-completed{background:#22c55e;color:#22c55e}
.dot-delivered{background:#0ea5e9;color:#0ea5e9}
.dot-cancelled{background:#ef4444;color:#ef4444}

.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 16px}
.open .details{display:block}
.st{font-size:13px;font-weight:bold;margin:15px 0 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.d{padding:10px;border-radius:11px;background:#0003;font-size:11px;color:#cbd5e1;min-height:45px}
.d b{display:block;color:#fff;margin-bottom:3px}
.tag{
display:inline-block;padding:7px 9px;border-radius:10px;background:#6366f122;
border:1px solid #6366f133;color:#c7d2fe;font-size:10px;margin:3px
}

.order{
margin-top:9px;padding:12px;border-radius:15px;background:#0004;border:1px solid #ffffff12
}
.order-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.order-no{font-size:11px;font-weight:bold;flex:1}
.status{font-size:9px;padding:5px 7px;border-radius:8px;font-weight:bold}
.pending{background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b44}
.ready{background:#8b5cf622;color:#c4b5fd;border:1px solid #8b5cf644}
.completed{background:#22c55e22;color:#4ade80;border:1px solid #22c55e44}
.delivered{background:#0ea5e922;color:#38bdf8;border:1px solid #0ea5e944}
.cancelled{background:#ef444422;color:#f87171;border:1px solid #ef444444}
.order-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.order-detail{padding:8px;border-radius:10px;background:#ffffff08;font-size:10px;color:#cbd5e1}
.order-detail b{display:block;color:#fff;margin-bottom:3px}
.color-line{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10px;color:#cbd5e1}
.color-dot{width:23px;height:23px;border-radius:50%;border:2px solid #fff3;flex-shrink:0}

.total-box{
margin-top:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#312e81,#4338ca);
text-align:center
}
.total-box b{display:block;font-size:24px;margin-bottom:3px}.total-box span{font-size:10px;color:#c7d2fe}

.actions{display:flex;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid #ffffff12}
.btn{flex:1;border:0;border-radius:12px;padding:12px;color:#fff;font-weight:bold;font-size:12px;cursor:pointer}
.edit{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.del{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.btn:active{transform:scale(.97)}

.empty{padding:35px 15px;text-align:center;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;color:#94a3b8}
.empty strong{display:block;font-size:16px;color:#fff;margin-bottom:8px}

.bottom{
position:fixed;left:0;right:0;bottom:0;height:75px;background:#020617f5;
border-top:1px solid #ffffff15;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:999
}
.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}
.nav a{text-decoration:none;color:#94a3b8;font-size:9px;text-align:center;min-width:45px;direction:rtl}
.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.nav .active{color:#fff}.nav .active i{filter:drop-shadow(0 0 6px #818cf8)}

@media(max-width:360px){
.grid,.order-row{grid-template-columns:1fr}
.nav a{font-size:8px;min-width:40px}.nav i{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<div class="top">
<a href="index.html" class="back">←</a>
<div class="title"><h1>👥 Customers</h1><p>محفوظ کسٹمرز اور ان کے Orders</p></div>
<a href="new-user.html" class="add" title="Add New User">➕</a>
</div>

<button id="addUserBtn" class="addUserBtn">➕ Add New User / Customer</button>

<input id="search" class="search" type="search"
placeholder="🔍 نام، موبائل نمبر یا Account No. تلاش کریں" autocomplete="off">

<div class="stats">
<div class="stat"><b id="total">0</b><span>Total Customers</span></div>
<div class="stat"><b id="shown">0</b><span>Showing</span></div>
<div class="stat"><b id="orderTotal">0</b><span>Total Orders</span></div>
</div>

<div id="msg" class="msg"></div>
<div id="list"><div class="empty"><strong>⏳ Customers لوڈ ہو رہے ہیں...</strong>براہ کرم انتظار کریں۔</div></div>

</div>

<div class="bottom">
<div class="nav">
<a href="index.html"><i>🏠</i>Home</a>
<a href="add-order.html"><i>➕</i>Add Order</a>
<a href="customers.html" class="active"><i>👥</i>Customers</a>
<a href="new-users.html"><i>🆕</i>New Users</a>
<a href="menu.html"><i>☰</i>Menu</a>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;
let all=[];
let orders=[];

const $=id=>document.getElementById(id);

const esc=v=>String(v??"")
.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
.replaceAll('"',"&quot;").replaceAll("'","&#039;");

function dateValue(value){
if(!value)return null;
if(typeof value==="string"){const d=new Date(value);return isNaN(d.getTime())?null:d}
if(value?.toDate)return value.toDate();
if(value?.seconds)return new Date(value.seconds*1000);
return null;
}

function formatDate(value){
const d=dateValue(value);
if(!d)return "-";
return d.toLocaleDateString("ur-PK",{year:"numeric",month:"short",day:"numeric"});
}

function getOrderDate(order,type){
if(type==="ordered")return order.orderDate||order.createdAt;
if(type==="ready")return order.readyDate||order.readyAt;
if(type==="completed")return order.completedDate||order.completedAt;
if(type==="delivered")return order.deliveredDate||order.deliveredAt;
return null;
}

function getStatus(order){
const s=String(order.status||"pending").toLowerCase();
if(s==="delivered"||s==="deliver")return{text:"📦 Delivered",className:"delivered"};
if(s==="completed"||s==="complete")return{text:"🟢 Completed",className:"completed"};
if(s==="ready"||s==="ready_in_shop"||s==="ready-in-shop")
return{text:"🟣 Ready in Shop",className:"ready"};
if(s==="cancelled"||s==="canceled")return{text:"❌ Cancelled",className:"cancelled"};
return{text:"🟡 Pending",className:"pending"};
}

function statusPill(cls,label,count){
if(!count)return"";
const dot=cls==="pending"?"dot-pending":cls==="ready"?"dot-ready":
cls==="completed"?"dot-completed":cls==="delivered"?"dot-delivered":"dot-cancelled";
return `<span class="status-pill pill-${cls}"><span class="dot ${dot}"></span>${label} ${count}</span>`;
}

const fields=[
["length","لمبائی"],["tera","تیرا"],["sleeve","آستین"],["neck","گلہ"],
["chest","چھاتی"],["waist","کمر"],["daman","دامن"],
["shalwarLength","شلوار لمبائی"],["pancha","پانچہ"]
];

const names={
twoPiece:"ٹو پیس",band:"بین",roundDaman:"گول دامن",squareDaman:"چورس دامن",
bothSides:"دوبغل",front:"سامنے",shalwarPocket:"شلوار جیب",tilaGoot:"تیلا گوٹ",
fitCuff:"فیٹ کف",simpleSleeve:"سادہ آستین",cuffed:"کف دار"
};

onAuthStateChanged(auth,async u=>{
if(!u){location.replace("login.html");return}
user=u;
await load();
});

async function load(){
try{
$("msg").textContent="⏳ Customers اور Orders لوڈ ہو رہے ہیں...";

const [customerSnap,orderSnap]=await Promise.all([
getDocs(collection(db,"users",user.uid,"customers")),
getDocs(collection(db,"users",user.uid,"orders"))
]);

all=customerSnap.docs.map(x=>({id:x.id,...x.data()}))
.sort((a,b)=>Number(a.accountNo||0)-Number(b.accountNo||0));

orders=orderSnap.docs.map(x=>({id:x.id,...x.data()}));

$("total").textContent=all.length;
$("orderTotal").textContent=orders.length;
$("msg").textContent="";
render(all);

}catch(error){
console.error(error);
$("msg").textContent="❌ Data لوڈ نہیں ہو سکا: "+error.message;
}
}

function render(data){
$("shown").textContent=data.length;
const list=$("list");
list.innerHTML="";

if(!data.length){
list.innerHTML=`<div class="empty"><strong>👥 کوئی Customer نہیں</strong>ابھی تک کوئی Customer محفوظ نہیں کیا گیا۔</div>`;
return;
}

data.forEach(c=>{
const customerOrders=orders.filter(o=>o.customerId===c.id).sort((a,b)=>{
const da=dateValue(getOrderDate(a,"ordered"));
const db=dateValue(getOrderDate(b,"ordered"));
return(db?.getTime()||0)-(da?.getTime()||0);
});

const counts={pending:0,ready:0,completed:0,delivered:0,cancelled:0};
customerOrders.forEach(o=>counts[getStatus(o).className]++);

const m=c.measurements||{};
const d=c.designs||{};
const tags=Object.keys(names).filter(k=>d[k]).map(k=>`<span class="tag">${esc(names[k])}</span>`).join("");

let ordersHtml="";
if(customerOrders.length){
ordersHtml=customerOrders.map(order=>{
const status=getStatus(order);
const orderNo=order.orderNo||order.id.slice(0,6).toUpperCase();
const color=order.color||{};
const colorName=color.name||"-";
const colorHex=/^#[0-9a-fA-F]{3,8}$/.test(String(color.hex||""))?color.hex:"#475569";
const receiver=order.receivedBy||order.deliveredBy||order.receiverName||"ابھی وصول نہیں ہوا";

return `<div class="order">
<div class="order-top">
<div class="order-no">🧵 Order #${esc(orderNo)}</div>
<div class="status ${status.className}">${status.text}</div>
</div>
<div class="order-row">
<div class="order-detail"><b>📅 Order دیا</b>${formatDate(getOrderDate(order,"ordered"))}</div>
<div class="order-detail"><b>🏪 Ready in Shop</b>${formatDate(getOrderDate(order,"ready"))}</div>
<div class="order-detail"><b>🟢 Completed</b>${formatDate(getOrderDate(order,"completed"))}</div>
<div class="order-detail"><b>📦 Delivered</b>${formatDate(getOrderDate(order,"delivered"))}</div>
<div class="order-detail"><b>📊 موجودہ Status</b>${esc(status.text)}</div>
<div class="order-detail"><b>👤 وصول کرنے والا</b>${esc(receiver)}</div>
</div>
<div class="color-line">
<span class="color-dot" style="background:${esc(colorHex)}"></span>
کپڑے کا رنگ: ${esc(colorName)}
</div>
</div>`;
}).join("");
}else{
ordersHtml=`<div class="empty" style="padding:20px;margin-top:8px"><strong style="font-size:13px">🧵 ابھی کوئی Order نہیں</strong>اس Customer کے کپڑے ابھی محفوظ نہیں ہیں۔</div>`;
}

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="head">
<div class="avatar">
${c.photo?`<img src="${esc(c.photo)}" alt="Customer" onerror="this.style.display='none';this.parentElement.textContent='👤'>`:"👤"}
</div>
<div class="info">
<div class="name">${esc(c.name||"-")}</div>
<div class="meta">📱 ${esc(c.phone||"-")}<br>📍 ${esc(c.address||"-")}</div>
</div>
<div class="head-right">
<div class="no">#${esc(c.accountNo||"-")}</div>
<div class="chevron">⌄</div>
</div>
</div>

<div class="status-summary">
${customerOrders.length?statusPill("pending","Pending",counts.pending):""}
${customerOrders.length?statusPill("ready","Shop",counts.ready):""}
${customerOrders.length?statusPill("completed","Complete",counts.completed):""}
${customerOrders.length?statusPill("delivered","Delivered",counts.delivered):""}
${customerOrders.length?statusPill("cancelled","Cancelled",counts.cancelled):""}
${!customerOrders.length?'<span style="font-size:10px;color:#94a3b8">⚪ ابھی کوئی کپڑا / Order نہیں</span>':""}
</div>

<div class="details">
<div class="st">📊 Customer Order Summary</div>
<div class="grid">
<div class="d"><b>🧵 Total کپڑے</b>${customerOrders.length}</div>
<div class="d"><b>🟡 Pending</b>${counts.pending}</div>
<div class="d"><b>🟣 Ready in Shop</b>${counts.ready}</div>
<div class="d"><b>🟢 Completed</b>${counts.completed}</div>
<div class="d"><b>📦 Delivered</b>${counts.delivered}</div>
<div class="d"><b>❌ Cancelled</b>${counts.cancelled}</div>
</div>

<div class="total-box"><b>${customerOrders.length}</b><span>Total Orders — اس Customer کے کل کپڑے</span></div>

<div class="st">👤 Customer Information</div>
<div class="grid">
<div class="d"><b>نام</b>${esc(c.name||"-")}</div>
<div class="d"><b>فون نمبر</b>${esc(c.phone||"-")}</div>
<div class="d"><b>علاقہ / پتہ</b>${esc(c.address||"-")}</div>
<div class="d"><b>Account No.</b>${esc(c.accountNo||"-")}</div>
</div>

<div class="st">📏 مکمل ناپ</div>
<div class="grid">
${fields.map(x=>`<div class="d"><b>${x[1]}</b>${esc(m[x[0]]||"-")}</div>`).join("")}
</div>

<div class="st">✂️ مستقل ڈیزائن</div>
<div>${tags||'<span style="color:#64748b;font-size:11px">کوئی ڈیزائن محفوظ نہیں</span>'}</div>

<div class="st">🧵 تمام Orders اور کپڑوں کی تفصیل</div>
${ordersHtml}

<div class="actions">
<button class="btn edit">✏️ Edit</button>
<button class="btn del">🗑️ Delete</button>
</div>
</div>
`;

card.querySelector(".head").onclick=()=>card.classList.toggle("open");

card.querySelector(".edit").onclick=e=>{
e.stopPropagation();
location.href="new-user.html?edit="+encodeURIComponent(c.id);
};

card.querySelector(".del").onclick=async e=>{
e.stopPropagation();
const ok=confirm(`"${c.name||"Customer"}" کو Delete کرنا ہے؟`);
if(!ok)return;
try{
await deleteDoc(doc(db,"users",user.uid,"customers",c.id));
$("msg").textContent="✅ Customer Delete ہوگیا۔";
await load();
}catch(error){
console.error(error);
$("msg").textContent="❌ Delete نہیں ہو سکا: "+error.message;
}
};

list.appendChild(card);
});
}

$("search").oninput=()=>{
const q=$("search").value.toLowerCase().trim();
if(!q){render(all);return}
render(all.filter(c=>[c.name,c.phone,c.accountNo,c.address].some(v=>String(v||"").toLowerCase().includes(q))));
};

$("addUserBtn").onclick=()=>location.href="new-user.html";
</script>
</body>
</html>
