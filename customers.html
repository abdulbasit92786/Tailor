<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers - Tailor Manager</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:#fff;
background:
radial-gradient(circle at 10% 0%,#3730a3 0%,transparent 30%),
radial-gradient(circle at 100% 100%,#164e63 0%,transparent 32%),
linear-gradient(145deg,#020617,#0f172a 55%,#111827);
padding:16px 16px 105px
}

button,input{
font-family:inherit
}

button{
-webkit-appearance:none
}

.app{
max-width:480px;
margin:auto
}


/* ================= TOP ================= */

.top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:18px
}

.back,
.addBtn{
width:46px;
height:46px;
min-width:46px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
background:#ffffff10;
border:1px solid #ffffff20;
color:#fff;
text-decoration:none;
font-size:21px;
cursor:pointer;
transition:.2s;
box-shadow:0 8px 22px #0003
}

.back:active,
.addBtn:active{
transform:scale(.92)
}

.addBtn{
background:linear-gradient(135deg,#22c55e,#15803d);
border:0;
box-shadow:0 8px 25px #22c55e33;
font-size:26px
}

.title{
flex:1;
text-align:center
}

.title h1{
font-size:22px;
font-weight:800;
letter-spacing:.2px
}

.title p{
font-size:11px;
color:#94a3b8;
margin-top:5px
}


/* ================= SEARCH ================= */

.searchBox{
position:relative;
margin-bottom:15px
}

.searchIcon{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
font-size:18px;
pointer-events:none;
opacity:.8
}

.search{
width:100%;
padding:14px 45px 14px 16px;
border-radius:17px;
border:1px solid #ffffff18;
background:#ffffff0c;
color:#fff;
outline:none;
font-size:14px;
backdrop-filter:blur(15px);
box-shadow:0 10px 30px #0003
}

.search:focus{
border-color:#818cf8;
box-shadow:
0 0 0 3px #6366f122,
0 12px 30px #0004
}

.search::placeholder{
color:#718096
}


/* ================= STATS ================= */

.stats{
display:flex;
gap:9px;
margin-bottom:15px
}

.stat{
flex:1;
padding:14px 8px;
border-radius:18px;
text-align:center;
background:linear-gradient(
145deg,
#ffffff0d,
#ffffff05
);
border:1px solid #ffffff12;
box-shadow:0 10px 25px #0003
}

.stat b{
display:block;
font-size:22px;
margin-bottom:3px
}

.stat span{
font-size:10px;
color:#94a3b8
}


/* ================= ADD CUSTOMER ================= */

.addCustomer{
width:100%;
padding:15px;
border:0;
border-radius:17px;
background:
linear-gradient(135deg,#6366f1,#4338ca);
color:#fff;
font-weight:bold;
font-size:14px;
margin-bottom:15px;
cursor:pointer;
box-shadow:0 10px 25px #6366f133;
transition:.2s
}

.addCustomer:active{
transform:scale(.98)
}


/* ================= MESSAGE ================= */

.msg{
text-align:center;
font-size:12px;
color:#a7f3d0;
min-height:20px;
margin:8px 0
}


/* ================= EMPTY ================= */

.empty{
padding:40px 18px;
text-align:center;
background:#ffffff08;
border:1px solid #ffffff12;
border-radius:24px;
color:#94a3b8;
box-shadow:0 15px 35px #0003
}

.emptyIcon{
font-size:42px;
margin-bottom:12px
}

.empty strong{
display:block;
font-size:17px;
color:#fff;
margin-bottom:8px
}

.empty span{
font-size:11px;
line-height:1.8
}


/* ================= CUSTOMER CARD ================= */

.customer{
padding:15px;
margin-bottom:12px;
border-radius:22px;
background:
linear-gradient(
145deg,
#ffffff0d,
#ffffff05
);
border:1px solid #ffffff14;
box-shadow:
0 12px 30px #0005,
inset 0 1px #ffffff08;
cursor:pointer;
transition:.2s;
overflow:hidden
}

.customer:hover{
border-color:#818cf855
}

.customer:active{
transform:scale(.985)
}


/* ================= CUSTOMER ROW ================= */

.row{
display:flex;
align-items:center;
gap:12px
}

.avatar{
width:55px;
height:55px;
min-width:55px;
border-radius:18px;
object-fit:cover;
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(135deg,#6366f1,#4338ca);
font-size:23px;
overflow:hidden;
box-shadow:0 7px 18px #0004;
border:1px solid #ffffff18
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.info{
flex:1;
min-width:0
}

.name{
font-weight:800;
font-size:15px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.meta{
font-size:11px;
color:#94a3b8;
line-height:1.8;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.number{
font-size:10px;
padding:6px 9px;
border-radius:11px;
background:#6366f122;
border:1px solid #818cf822;
color:#c7d2fe;
white-space:nowrap
}


/* ================= OPEN ARROW ================= */

.openHint{
margin-top:9px;
text-align:center;
font-size:10px;
color:#64748b;
transition:.2s
}

.customer.open .openHint{
color:#a5b4fc
}


/* ================= DETAILS ================= */

.details{
display:none;
margin-top:15px;
padding-top:15px;
border-top:1px solid #ffffff12
}

.customer.open .details{
display:block
}

.detailTitle{
display:flex;
align-items:center;
gap:7px;
font-size:13px;
font-weight:800;
margin:15px 0 9px;
color:#e2e8f0
}

.detailTitle:first-child{
margin-top:0
}


/* ================= BASIC INFO ================= */

.basicInfo{
display:flex;
flex-direction:column;
gap:7px
}

.detail{
padding:11px 12px;
border-radius:13px;
background:#0003;
border:1px solid #ffffff08;
font-size:11px;
color:#cbd5e1;
line-height:1.7
}

.detail b{
display:block;
color:#fff;
margin-bottom:2px;
font-size:10px
}


/* ================= MEASUREMENTS ================= */

/*
ناپ اب مکمل اوپر سے نیچے
ایک ہی column میں آئے گا۔
*/

.measurements{
display:flex;
flex-direction:column;
gap:7px
}

.measurement{
display:flex;
align-items:center;
justify-content:space-between;
padding:11px 13px;
border-radius:13px;
background:
linear-gradient(90deg,#0003,#ffffff06);
border:1px solid #ffffff08;
font-size:12px
}

.measurementName{
color:#cbd5e1
}

.measurementValue{
font-weight:bold;
color:#fff;
background:#6366f122;
border:1px solid #818cf822;
padding:4px 9px;
border-radius:8px;
min-width:45px;
text-align:center
}


/* ================= DESIGN TAGS ================= */

.designs{
display:flex;
flex-wrap:wrap;
gap:7px
}

.design{
padding:8px 10px;
border-radius:11px;
background:
linear-gradient(135deg,#6366f122,#4338ca22);
border:1px solid #818cf822;
color:#c7d2fe;
font-size:10px
}

.noDesign{
color:#64748b;
font-size:11px;
padding:7px 0
}


/* ================= ACTIONS ================= */

.actions{
display:flex;
gap:9px;
margin-top:16px;
padding-top:14px;
border-top:1px solid #ffffff12
}

.actionBtn{
flex:1;
border:0;
border-radius:13px;
padding:12px 8px;
font-size:12px;
font-weight:bold;
cursor:pointer;
color:#fff;
transition:.2s
}

.editBtn{
background:linear-gradient(135deg,#3b82f6,#1d4ed8);
box-shadow:0 7px 18px #2563eb33
}

.deleteBtn{
background:linear-gradient(135deg,#ef4444,#b91c1c);
box-shadow:0 7px 18px #dc262633
}

.actionBtn:active{
transform:scale(.96)
}


/* ================= DELETE MODAL ================= */

.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
backdrop-filter:blur(9px)
}

.modal.show{
display:flex
}

.modalBox{
width:100%;
max-width:380px;
background:
linear-gradient(145deg,#1e293b,#0f172a);
border:1px solid #ffffff18;
border-radius:24px;
padding:23px;
text-align:center;
box-shadow:0 25px 70px #0009
}

.modalIcon{
font-size:43px;
margin-bottom:10px
}

.modalBox h3{
font-size:18px;
margin-bottom:8px
}

.modalBox p{
font-size:12px;
color:#94a3b8;
line-height:1.8;
margin-bottom:18px
}

.modalActions{
display:flex;
gap:9px
}

.modalActions button{
flex:1;
padding:13px;
border:0;
border-radius:13px;
color:#fff;
font-weight:bold;
cursor:pointer
}

.cancelBtn{
background:#334155
}

.confirmDelete{
background:#dc2626
}


/* ================= LOADING ================= */

.loading{
padding:35px;
text-align:center;
color:#94a3b8;
font-size:13px
}


/* ================= BOTTOM NAV ================= */

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:75px;
background:#020617f7;
border-top:1px solid #ffffff15;
backdrop-filter:blur(20px);
z-index:99
}

.nav{
height:100%;
max-width:480px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-around;

/* Left → Right */
direction:ltr
}

.nav a{
text-decoration:none;
color:#94a3b8;
font-size:9px;
text-align:center;
direction:ltr;
min-width:45px;
transition:.2s
}

.nav a:active{
transform:scale(.9)
}

.nav i{
display:block;
font-style:normal;
font-size:20px;
margin-bottom:3px
}

.nav .active{
color:#fff
}

.nav .active i{
filter:drop-shadow(0 0 6px #fff5)
}


/* ================= RESPONSIVE ================= */

@media(max-width:360px){

.nav a{
font-size:8px;
min-width:40px
}

.nav i{
font-size:18px
}

}
</style>
</head>


<body>


<div class="app">


<!-- ================= TOP ================= -->

<div class="top">

<a href="index.html" class="back">←</a>

<div class="title">

<h1>👥 Customers</h1>

<p>آپ کے مستقل محفوظ کسٹمرز</p>

</div>

>

<div class="stat">

<b id="total">0</b>

<span>Total Customers</span>

<span>Showing</span>

id="addCustomerBtn">

➕ نیا مستقل Customer محفوظ کریں

کیا آپ واقعی اس Customer کو مستقل طور پر Delete کرنا چاہتے ہیں؟

<script type="module">


/* ================= FIREBASE ================= */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import{
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import{
getFirestore,
collection,
getDocs,
deleteDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig={

apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

authDomain:"tailor-web-f1f1c.firebaseapp.com",

projectId:"tailor-web-f1f1c",

storageBucket:"tailor-web-f1f1c.firebasestorage.app",

messagingSenderId:"129811668871",

appId:"1:129811668871:web:586357e9e696a9652ffd22"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* ================= VARIABLES ================= */

let currentUser=null;

let customers=[];

let customerToDelete=null;


/* ================= HELPER ================= */

const $=id=>document.getElementById(id);


/* ================= LOGIN ================= */

onAuthStateChanged(auth,async user=>{

if(!user){

location.replace("login.html");

return;

}

currentUser=user;

await loadCustomers();

});


/* ================= LOAD CUSTOMERS ================= */

async function loadCustomers(){

try{

const ref=collection(
db,
"users",
currentUser.uid,
"customers"
);

const snap=await getDocs(ref);

customers=[];

snap.forEach(docSnap=>{

customers.push({

id:docSnap.id,

...docSnap.data()

});

});


/*
Account Number کے حساب سے ترتیب۔
*/

customers.sort((a,b)=>{

const aNo=Number(a.accountNo||0);

const bNo=Number(b.accountNo||0);

return aNo-bNo;

});


$("total").textContent=customers.length;

render(customers);


}catch(error){

console.error(error);

$("list").innerHTML="";

$("msg").textContent=
"❌ Customers لوڈ نہیں ہو سکے: "+
error.message;

}

}


/* ================= RENDER ================= */

function render(data){

const list=$("list");

$("shown").textContent=data.length;


if(!data.length){

list.innerHTML=`

<div class="empty">

<div class="emptyIcon">
👥
</div>

<strong>
کوئی Customer موجود نہیں
</strong>

<span>
ابھی تک کوئی مستقل Customer محفوظ نہیں کیا گیا۔<br>
اوپر + یا نیچے والے بٹن سے نیا Customer محفوظ کریں۔
</span>

</div>

`;

return;

}


list.innerHTML="";


data.forEach(customer=>{

const card=document.createElement("div");

card.className="customer";


const m=customer.measurements||{};

const d=customer.designs||{};


/* ================= DESIGNS ================= */

const designs=[];

const names={

twoPiece:"ٹو پیس",

band:"بین",

roundDaman:"گول دامن",

squareDaman:"چورس دامن",

bothSides:"دوبغل",

front:"سامنے",

shalwarPocket:"شلوار جیب",

tilaGoot:"تیلا گوٹ",

fitCuff:"فیٹ کف",

simpleSleeve:"سادہ آستین",

cuffed:"کف دار"

};


Object.keys(names).forEach(key=>{

if(d[key]){

designs.push(names[key]);

}

});


/* ================= AVATAR ================= */

let avatar="👤";


if(customer.photo){

avatar=`

<img
src="${escapeHtml(customer.photo)}"
alt="Customer"
onerror="this.style.display='none';this.parentElement.textContent='👤';"
>

`;

}


/* ================= CARD ================= */

card.innerHTML=`

<div class="row">

<div class="avatar">

${avatar}

</div>


<div class="info">

<div class="name">

${escapeHtml(customer.name||"نام نہیں")}

</div>

<div class="meta">

📱 ${escapeHtml(customer.phone||"فون نمبر نہیں")}

<br>

📍 ${escapeHtml(customer.address||"پتہ نہیں")}

</div>

</div>


<div class="number">

#${escapeHtml(customer.accountNo||"-")}

</div>

</div>


<div class="openHint">
▼ تفصیل دیکھنے کے لیے کلک کریں
</div>


<div class="details">


<!-- BASIC INFORMATION -->

<div class="detailTitle">
👤 کسٹمر کی معلومات
</div>

<div class="basicInfo">

<div class="detail">
<b>نام</b>
${escapeHtml(customer.name||"-")}
</div>

<div class="detail">
<b>فون نمبر</b>
${escapeHtml(customer.phone||"-")}
</div>

<div class="detail">
<b>علاقہ / پتہ</b>
${escapeHtml(customer.address||"-")}
</div>

<div class="detail">
<b>Account No.</b>
${escapeHtml(customer.accountNo||"-")}
</div>

</div>


<!-- MEASUREMENTS -->

<div class="detailTitle">
📏 مکمل ناپ
</div>

<div class="measurements">

${measurement("لمبائی",m.length)}

${measurement("تیرا",m.tera)}

${measurement("آستین",m.sleeve)}

${measurement("گلہ",m.neck)}

${measurement("چھاتی",m.chest)}

${measurement("کمر",m.waist)}

${measurement("دامن",m.daman)}

${measurement("شلوار لمبائی مکمل",m.shalwarLength)}

${measurement("پانچہ",m.pancha)}

</div>


<!-- DESIGNS -->

<div class="detailTitle">
✂️ مستقل ڈیزائن / پسند
</div>

<div class="designs">

${
designs.length

?

designs.map(x=>`

<span class="design">
✓ ${escapeHtml(x)}
</span>

`).join("")

:

`<span class="noDesign">
کوئی مستقل ڈیزائن محفوظ نہیں
</span>`

}

</div>


<!-- ACTIONS -->

<div class="actions">

<button
class="actionBtn editBtn"
data-action="edit">
✏️ Edit Customer
</button>


<button
class="actionBtn deleteBtn"
data-action="delete">
🗑️ Delete
</button>

</div>


</div>

`;


/* ================= CARD OPEN / CLOSE ================= */

card.addEventListener("click",event=>{

if(event.target.closest("[data-action]")){

return;

}

card.classList.toggle("open");

const hint=card.querySelector(".openHint");

if(card.classList.contains("open")){

hint.textContent="▲ تفصیل بند کریں";

}else{

hint.textContent="▼ تفصیل دیکھنے کے لیے کلک کریں";

}

});


/* ================= EDIT ================= */

card
.querySelector('[data-action="edit"]')
.addEventListener("click",event=>{

event.stopPropagation();


/*
موجودہ Customer کی Firestore ID
new-user.html کو بھیجی جا رہی ہے۔

new-user.html اس ID کو استعمال کر کے
اسی Customer کو UPDATE کرے گا۔
*/

location.href=
"new-user.html?edit="+
encodeURIComponent(customer.id);

});


/* ================= DELETE ================= */

card
.querySelector('[data-action="delete"]')
.addEventListener("click",event=>{

event.stopPropagation();


customerToDelete=customer;


$("deleteText").textContent=
`کیا آپ "${customer.name||"اس Customer"}" کو مستقل طور پر Delete کرنا چاہتے ہیں؟`;


$("deleteModal")
.classList.add("show");

});


list.appendChild(card);

});

}


/* ================= MEASUREMENT ================= */

function measurement(name,value){

return`

<div class="measurement">

<span class="measurementName">
${name}
</span>

<span class="measurementValue">
${escapeHtml(value||"-")}
</span>

</div>

`;

}


/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* ================= SEARCH ================= */

$("search").addEventListener(
"input",
()=>{

const q=$("search")
.value
.trim()
.toLowerCase();


if(!q){

render(customers);

return;

}


const result=customers.filter(c=>{

return(

String(c.name||"")
.toLowerCase()
.includes(q)

||

String(c.phone||"")
.toLowerCase()
.includes(q)

||

String(c.accountNo||"")
.toLowerCase()
.includes(q)

);

});


render(result);

});


/* ================= ADD CUSTOMER ================= */

$("addCustomerBtn").addEventListener(
"click",
()=>{

location.href="new-user.html";

});


/* ================= CANCEL DELETE ================= */

$("cancelDelete").addEventListener(
"click",
()=>{

customerToDelete=null;

$("deleteModal")
.classList.remove("show");

});


/* ================= CONFIRM DELETE ================= */

$("confirmDelete").addEventListener(
"click",
async()=>{

if(!customerToDelete){

return;

}


const btn=$("confirmDelete");

btn.disabled=true;

btn.textContent="Deleting...";


try{

await deleteDoc(

doc(
db,
"users",
currentUser.uid,
"customers",
customerToDelete.id
)

);


$("msg").textContent=
"✅ Customer کامیابی سے Delete ہوگیا۔";


$("deleteModal")
.classList.remove("show");


customerToDelete=null;


await loadCustomers();


}catch(error){

console.error(error);


$("msg").textContent=
"❌ Delete نہیں ہو سکا: "+
error.message;


$("deleteModal")
.classList.remove("show");


}finally{

btn.disabled=false;

btn.textContent="Delete";

}

});


/* ================= CLOSE MODAL ================= */

$("deleteModal").addEventListener(
"click",
event=>{

if(event.target.id==="deleteModal"){

customerToDelete=null;

$("deleteModal")
.classList.remove("show");

}

});

</script>
