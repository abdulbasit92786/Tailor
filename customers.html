<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="hero"><h2>👥 Customers</h2><p>مستقل محفوظ کسٹمرز — ناپ، ڈیزائن، تاریخ اور نئے آرڈر</p></div><input id="search" class="search" placeholder="🔎 نام، نمبر یا Account No."><div id="list"></div></main><nav><a href="index.html">🏠<span>ہوم</span></a><a href="add-order.html">➕<span>نیا آرڈر</span></a><a class="on" href="customers.html">👥<span>کسٹمرز</span></a><a href="new-users.html">🆕<span>نیو یوزرز</span></a><a href="menu.html">☰<span>مینو</span></a></nav><script type="module">import{requireUser,$,esc,dt,allCustomers,db,MEAS,DES}from'./app.js';import{doc,deleteDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const u=await requireUser();let cs=await allCustomers(u);function render(){const q=$('#search').value.toLowerCase();$('#list').innerHTML=cs.filter(c=>c.status==='active'||c.customerType==='customer').filter(c=>[c.name,c.phone,c.accountNo].some(x=>String(x||'').toLowerCase().includes(q))).map(c=>`<div class="card" style="padding:15px;margin-bottom:10px"><b>${esc(c.name)}</b><div class="muted">📱 ${esc(c.phone)} · #${esc(c.accountNo||'—')} · شامل: ${dt(c.createdAt)}</div><div class="detail">📍 ${esc(c.address||'—')}</div><div class="detail">📏 ${MEAS.map(([k,l])=>`${l}: ${esc(c.measurements?.[k]||'—')}`).join(' · ')}</div><div class="detail">✂️ ${DES.filter(([k])=>c.designs?.[k]).map(x=>x[1]).join(' · ')||'—'}</div><div class="actions"><button class="primary" data-order="${c.id}">➕ Add Order</button><button class="warning" data-edit="${c.id}">✏️ Edit</button><button class="danger" data-del="${c.id}">🗑️ Delete</button></div></div>`).join('')||'<div class="empty">کوئی کسٹمر نہیں</div>'}
$('#search').oninput=render;$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.order)location.href='new-customer.html?customerId='+b.dataset.order;if(b.dataset.edit)location.href='new-user.html?edit='+b.dataset.edit;if(b.dataset.del&&confirm('یہ کسٹمر حذف کریں؟')){await deleteDoc(doc(db,'users',u.uid,'customers',b.dataset.del));cs=await allCustomers(u);render()}};render();</script></body></html>
