<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفوظ کسٹمرز</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,deleteDoc,doc,$,esc,fields,designs,lang,dateText}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>${en?'Saved Customers':'محفوظ کسٹمرز'}</h1><p>${en?'Click a customer to view details.':'کسٹمر پر کلک کریں، پھر اس کی تفصیل کھلے گی۔'}</p></div><div class="card"><div class="row-actions"><button class="primary" id="add">＋ ${en?'Add Customer':'کسٹمر شامل کریں'}</button></div><div class="searchbar"><span>🔎</span><input id="q" placeholder="${en?'Search by name, phone, area or address':'نام، فون، علاقہ یا پتہ تلاش کریں'}"></div></div><div id="list"><div class="loading">${en?'Loading...':'لوڈ ہو رہا ہے...'}</div></div></main>`;bindNav();let all=[];async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'customers'));all=s.docs.map(x=>({id:x.id,...x.data()}));render()}catch(e){$('list').innerHTML=`<div class="card empty">${en?'Could not load customers.':'کسٹمرز لوڈ نہیں ہو سکے۔'}</div>`}}function render(){const q=$('q').value.toLowerCase().trim();const a=all.filter(c=>[c.name,c.phone,c.area,c.address].some(v=>String(v??'').toLowerCase().includes(q)));$('list').innerHTML=a.length?a.map(c=>`<article class="card"><details><summary class="customer-row"><div class="summary-main"><strong>${esc(c.name||'-')}</strong><div class="muted">📞 ${esc(c.phone||'-')} • 📍 ${esc(c.area||'-')}</div></div><div class="count-box"><b>👤</b><span class="muted">${en?'Customer':'کسٹمر'}</span></div></summary><div class="detail">${en?'Phone':'فون'}: ${esc(c.phone||'-')}\n${en?'Area':'علاقہ'}: ${esc(c.area||'-')}\n${en?'Address':'پتہ'}: ${esc(c.address||'-')}</div><div class="detail"><b>${en?'Measurements':'ناپ'}</b>\n${fields.map(([k,ur,eng])=>`${en?eng:ur}: ${esc(c.measurements?.[k]||'-')}`).join('\n')}</div><div class="detail"><b>${en?'Design':'ڈیزائن'}</b>\n${designs.filter(([k])=>c.designs?.[k]).map(([,ur,eng])=>en?eng:ur).join(', ')||'-'}</div><div class="row-actions"><a class="primary" href="new-user.html?customer=${encodeURIComponent(c.id)}">${en?'Create Order':'آرڈر بنائیں'}</a><button class="danger" data-del="${esc(c.id)}">${en?'Delete':'حذف کریں'}</button></div></details></article>`).join(''):`<div class="card empty">${en?'No saved customers found.':'کوئی محفوظ کسٹمر نہیں ملا۔'}</div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm(en?'Delete this customer?':'یہ کسٹمر حذف کریں؟'))return;await deleteDoc(doc(db,'users',u.uid,'customers',b.dataset.del));load()})}$('add').onclick=()=>location.href='save-customer.html';$('q').oninput=render;load()});</script></body></html>
