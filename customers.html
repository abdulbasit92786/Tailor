<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفوظ کسٹمرز</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{db,requireAuth,nav,bindNav,$,collection,getDocs,updateDoc,deleteDoc,doc,esc,fields,designs,detailsHtml}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('customers')+`<main class="wrap"><div class="hero"><h1>محفوظ کسٹمرز</h1><p>کسٹمر کا ناپ اور ڈیزائن مستقل محفوظ رہتا ہے۔</p></div><input id="search" placeholder="نام یا فون نمبر تلاش کریں"><div id="list" style="margin-top:14px"><div class="loading">لوڈ ہو رہا ہے...</div></div></main>`;bindNav();let all=[];async function load(){try{const s=await getDocs(collection(db,'users',u.uid,'customers'));all=s.docs.map(d=>({id:d.id,...d.data()}));render(all)}catch(e){$('list').innerHTML='<div class="card empty">ڈیٹا لوڈ نہیں ہو سکا۔ انٹرنیٹ آنے پر دوبارہ کوشش کریں۔</div>'}}function render(a){$('list').innerHTML=a.length?a.map(c=>`<article class="card order"><div class="customer-head"><div><b style="font-size:21px">${esc(c.name||'-')}</b><div class="muted">${esc(c.phone||'-')} • ${esc(c.area||'-')}</div><div class="muted">${esc(c.address||'-')}</div></div><a class="primary" href="new-user.html?customer=${encodeURIComponent(c.id)}">${'آرڈر'}</a></div>${detailsHtml(c)}<div class="actions"><button class="primary edit" data-id="${esc(c.id)}">ایڈٹ ناپ/ڈیزائن</button><button class="danger del" data-id="${esc(c.id)}">ڈیلیٹ کسٹمر</button></div></article>`).join(''):'<div class="card empty">ابھی کوئی محفوظ کسٹمر نہیں</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('یہ محفوظ کسٹمر حذف کریں؟')){await deleteDoc(doc(db,'users',u.uid,'customers',b.dataset.id));load()}});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>alert('ایڈٹ کے لیے پہلے نیا آرڈر صفحہ استعمال کیا جا سکتا ہے؛ مستقل customer edit فارم اگلے مرحلے میں شامل کیا جا سکتا ہے۔'))}$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();render(all.filter(c=>String(c.name||'').toLowerCase().includes(q)||String(c.phone||'').includes(q)))};load()});</script></body></html>
