<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivered - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;
background:radial-gradient(circle at top left,#0f766e 0%,transparent 35%),
radial-gradient(circle at bottom right,#075985 0%,transparent 40%),
linear-gradient(145deg,#02131a,#062b35);padding:16px 16px 105px}
button,input{font-family:inherit}.app{max-width:480px;margin:auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.back,.searchBtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff20;font-size:20px}
.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#a7f3d0;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat{padding:12px 6px;text-align:center;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff14}
.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#a7f3d0}
.search{width:100%;padding:14px 15px;border-radius:15px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:13px;margin-bottom:10px}
.search::placeholder{color:#7dd3c7}.msg{text-align:center;min-height:20px;color:#a7f3d0;font-size:11px;margin:5px 0 9px}
.card{margin-bottom:12px;border-radius:21px;background:#ffffff0c;border:1px solid #ffffff14;overflow:hidden;box-shadow:0 12px 28px #0005}
.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#14b8a6,#0369a1);font-size:21px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.name{font-size:15px;font-weight:bold;margin-bottom:4px}.meta{font-size:10px;color:#94a3b8;line-height:1.7}
.badge{padding:5px 7px;border-radius:10px;font-size:9px;background:#22c55e22;color:#bbf7d0;white-space:nowrap}
.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 16px}.open .details{display:block}
.st{font-size:13px;font-weight:bold;margin:15px 0 9px}
.order{padding:13px;border-radius:15px;background:#0004;border:1px solid #ffffff0c;margin-bottom:9px}
.orderTop{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.orderTop strong{font-size:12px}.date{font-size:9px;color:#94a3b8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{padding:9px;border-radius:10px;background:#ffffff08;font-size:10px;color:#cbd5e1}.d b{display:block;color:#fff;margin-bottom:3px}
.payment{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay{padding:8px 5px;border-radius:10px;text-align:center;font-size:9px}.total{background:#38bdf822;color:#bae6fd}.received{background:#22c55e22;color:#bbf7d0}.due{background:#ef444422;color:#fecaca}
.delivery{margin-top:9px;padding:9px;border-radius:10px;background:#14b8a615;color:#99f6e4;font-size:10px;text-align:center}
.empty{padding:35px 15px;text-align:center;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:75px;background:#02151bf5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}
.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}
.nav a{color:#94a3b8;text-decoration:none;font-size:9px;text-align:center;min-width:45px;direction:rtl}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}.nav .active i{filter:drop-shadow(0 0 6px #2dd4bf)}
@media(max-width:360px){.grid{grid-template-columns:1fr}.stats{gap:5px}.nav a{font-size:8px;min-width:40px}.nav i{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<a href="index.html" class="back">←</a>
<div class="title"><h1>👕 Delivered</h1><p>Delivered Orders</p></div>
<a href="search.html" class="searchBtn">🔍</a>
</div>

<div class="stats">
<div class="stat"><b id="users">0</b><span>Customers</span></div>
<div class="stat"><b id="orders">0</b><span>Orders</span></div>
<div class="stat"><b id="pieces">0</b><span>Pieces</span></div>
</div>

<input id="search" class="search" type="search" placeholder="🔍 Name, Mobile or Account No." autocomplete="off">
<div id="msg" class="msg">⏳ Delivered data loading...</div>
<div id="list"><div class="empty"><strong>⏳ Loading...</strong>Please wait.</div></div>
</div>

<div class="bottom"><div class="nav">
<a href="index.html"><i>🏠</i>Home</a>
<a href="add-order.html"><i>➕</i>Add Order</a>
<a href="customers.html"><i>👥</i>Customers</a>
<a href="new-users.html"><i>🆕</i>New Users</a>
<a href="menu.html" class="active"><i>☰</i>Menu</a>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
authDomain:"tailor-web-f1f1c.firebaseapp.com",
projectId:"tailor-web-f1f1c",
storageBucket:"tailor-web-f1f1c.firebasestorage.app",
messagingSenderId:"129811668871",
appId:"1:129811668871:web:586357e9e696a9652ffd22"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let all=[];

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

const money=v=>Number(v||0).toLocaleString();
const statusText=s=>{
const x=String(s||"").toLowerCase();
if(x.includes("pending"))return"Pending";
if(x.includes("shop"))return"Ready in Shop";
if(x.includes("paid"))return"Paid";
if(x.includes("deliver"))return"Delivered";
return s||"Delivered";
};

onAuthStateChanged(auth,async user=>{
if(!user){location.replace("login.html");return}
await load(user);
});

async function load(user){
try{
$("msg").textContent="⏳ Delivered data loading...";
const snap=await getDocs(collection(db,"users",user.uid,"orders"));
const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
const delivered=orders.filter(o=>{
const s=String(o.status||o.orderStatus||o.deliveryStatus||"").toLowerCase();
return s.includes("deliver") || o.delivered===true;
});
const customerSnap=await getDocs(collection(db,"users",user.uid,"customers"));
const customers=customerSnap.docs.map(d=>({id:d.id,...d.data()}));
const byCustomer=new Map();
delivered.forEach(o=>{
const c=customers.find(x=>x.id===o.customerId) || {id:o.customerId,name:o.customerName||o.name,phone:o.customerPhone||o.phone,address:o.address||"",photo:o.photo||""};
const key=c.id||`order:${o.id}`;
if(!byCustomer.has(key))byCustomer.set(key,{customer:c,orders:[]});
byCustomer.get(key).orders.push(o);
});
all=[...byCustomer.values()];
$("users").textContent=all.length;
$("orders").textContent=delivered.length;
$("pieces").textContent=delivered.reduce((n,o)=>n+Number(o.quantity||o.qty||o.pieces||1),0);
$("msg").textContent="";
render(all);
}catch(e){
console.error(e);
$("msg").textContent="❌ Data load error: "+e.message;
$("list").innerHTML='<div class="empty"><strong>❌ Data load نہیں ہو سکا</strong>Firestore data/check rules چیک کریں۔</div>';
}
}
function render(data){
$("users").textContent=data.length;
$("orders").textContent=data.reduce((n,x)=>n+x.orders.length,0);
$("pieces").textContent=data.reduce((n,x)=>n+x.orders.reduce((a,o)=>a+Number(o.quantity||o.qty||o.pieces||1),0),0);

if(!data.length){
$("list").innerHTML='<div class="empty"><strong>👕 کوئی Delivered Order نہیں</strong>ابھی کوئی کپڑا Delivered status میں نہیں ہے۔</div>';
return;
}
$("list").innerHTML="";
data.forEach(x=>{
const c=x.customer;
const card=document.createElement("div");
card.className="card";
const photo=c.photo||c.profilePhoto||"";
card.innerHTML=`
<div class="head">
<div class="avatar">${photo?`<img src="${esc(photo)}" onerror="this.style.display='none';this.parentElement.textContent='👤'">`:"👤"}</div>
<div class="info">
<div class="name">${esc(c.name||"-")}</div>
<div class="meta">📱 ${esc(c.phone||"-")}<br>📍 ${esc(c.address||"-")}</div>
</div>
<div class="badge">Delivered</div>
</div>
<div class="details">
<div class="st">📦 Customer Orders</div>
${x.orders.map((o,i)=>{
const total=Number(o.totalAmount??o.total??o.price??0);
const received=Number(o.receivedAmount??o.paidAmount??o.advance??o.paid??0);
const due=Math.max(0,total-received);
const qty=Number(o.quantity||o.qty||o.pieces||1);
const date=o.deliveredAt||o.deliveryDate||o.updatedAt||o.date||o.createdAt||"";
return `<div class="order">
<div class="orderTop"><strong>Order #${esc(o.orderNo||o.accountNo||i+1)} · ${qty} Piece${qty===1?"":"s"}</strong><span class="date">${esc(typeof date==="string"?date:"")}</span></div>
<div class="grid">
<div class="d"><b>Color</b>${esc((o.color&&o.color.name)||o.colour||o.colorName||"-")}</div>
<div class="d"><b>Order Date</b>${esc(o.orderDate||o.date||"-")}</div>
<div class="d"><b>Address</b>${esc(c.address||o.address||"-")}</div>
<div class="d"><b>Quantity</b>${qty} Piece${qty===1?"":"s"}</div>
<div class="d"><b>Delivery</b>Completed</div>
<div class="d"><b>Payment</b>${due<=0?"Complete":"Due"}</div>
</div>
<div class="payment">
<div class="pay total"><b>Total</b><br>${money(total)}</div>
<div class="pay received"><b>Received</b><br>${money(received)}</div>
<div class="pay due"><b>Due</b><br>${money(due)}</div>
</div>
<div class="delivery">✅ Delivered — ${qty} piece${qty===1?"":"s"} handed over</div>
</div>`;
}).join("")}
</div>`;
card.querySelector(".head").onclick=()=>card.classList.toggle("open");
$("list").appendChild(card);
});
}

$("search").oninput=()=>{
const q=$("search").value.toLowerCase().trim();
if(!q){render(all);return}
render(all.filter(x=>[x.customer.name,x.customer.phone,x.customer.accountNo,...x.orders.flatMap(o=>[o.orderNo,o.orderNumber,o.color&&o.color.name,o.colour,o.colorName,o.quantity,o.qty])].some(v=>String(v||"").toLowerCase().includes(q))));
};
</script>
</body>
</html>
