<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivered - Tailor Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;
background:radial-gradient(circle at top left,#0f766e 0%,transparent 35%),
radial-gradient(circle at bottom right,#075985 0%,transparent 40%),
linear-gradient(145deg,#02131a,#062b35);padding:16px 16px 105px}
button,input{font-family:inherit}.app{max-width:480px;margin:auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.back,.searchBtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff20;font-size:20px}
.title{flex:1;text-align:center}.title h1{font-size:21px}.title p{font-size:11px;color:#a7f3d0;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat{padding:12px 6px;text-align:center;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff14}
.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#a7f3d0}
.search{width:100%;padding:14px 15px;border-radius:15px;background:#ffffff0d;border:1px solid #ffffff18;color:#fff;outline:none;font-size:13px;margin-bottom:10px}
.search::placeholder{color:#7dd3c7}.msg{text-align:center;min-height:20px;color:#a7f3d0;font-size:11px;margin:5px 0 9px}
.card{margin-bottom:12px;border-radius:21px;background:#ffffff0c;border:1px solid #ffffff14;overflow:hidden;box-shadow:0 12px 28px #0005}
.head{padding:15px;display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#14b8a6,#0369a1);font-size:21px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.name{font-size:15px;font-weight:bold;margin-bottom:4px}.meta{font-size:10px;color:#94a3b8;line-height:1.7}
.badge{padding:5px 7px;border-radius:10px;font-size:9px;background:#22c55e22;color:#bbf7d0;white-space:nowrap}
.details{display:none;border-top:1px solid #ffffff12;padding:0 15px 16px}.open .details{display:block}
.st{font-size:13px;font-weight:bold;margin:15px 0 9px}
.order{padding:13px;border-radius:15px;background:#0004;border:1px solid #ffffff0c;margin-bottom:9px}
.orderTop{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.orderTop strong{font-size:12px}.date{font-size:9px;color:#94a3b8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{padding:9px;border-radius:10px;background:#ffffff08;font-size:10px;color:#cbd5e1}.d b{display:block;color:#fff;margin-bottom:3px}
.payment{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay{padding:8px 5px;border-radius:10px;text-align:center;font-size:9px}.total{background:#38bdf822;color:#bae6fd}.received{background:#22c55e22;color:#bbf7d0}.due{background:#ef444422;color:#fecaca}
.delivery{margin-top:9px;padding:9px;border-radius:10px;background:#14b8a615;color:#99f6e4;font-size:10px;text-align:center}
.empty{padding:35px 15px;text-align:center;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:75px;background:#02151bf5;border-top:1px solid #ffffff15;backdrop-filter:blur(18px);z-index:999}
.nav{height:100%;max-width:480px;margin:auto;display:flex;align-items:center;justify-content:space-around;direction:ltr}
.nav a{color:#94a3b8;text-decoration:none;font-size:9px;text-align:center;min-width:45px;direction:rtl}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav .active{color:#fff}.nav .active i{filter:drop-shadow(0 0 6px #2dd4bf)}
@media(max-width:360px){.grid{grid-template-columns:1fr}.stats{gap:5px}.nav a{font-size:8px;min-width:40px}.nav i{font-size:18px}}
</style>
<style id="tm-unified-theme-v2">
:root{--ink:#172033;--muted:#475569;--pink:#ec4899;--yellow:#f59e0b;--blue:#2563eb;--green:#059669}
html,body{color:var(--ink)!important}
body{background:radial-gradient(circle at 8% 0%,#fbcfe8 0,transparent 27%),radial-gradient(circle at 100% 12%,#bfdbfe 0,transparent 30%),radial-gradient(circle at 85% 100%,#bbf7d0 0,transparent 28%),linear-gradient(145deg,#fff7ed,#eff6ff 52%,#f0fdf4)!important}
.top,.top-bar{color:var(--ink)!important}
.top-button,.top-btn,.back,.refresh,.search,.card,.section,.info,.stat,.stats .stat,.empty,.bottom,.bottom-navigation,.nav-icon,.details,.payment-box,.payment,.info-grid .box,.box,.d,.measure,.order-detail,.info-box,.time,.timeline,.order,.option label,.meta-box,.field,.sheet,.modal-card{color:var(--ink)!important;background:rgba(255,255,255,.90)!important;border-color:rgba(30,41,59,.12)!important;box-shadow:0 10px 28px rgba(15,23,42,.08)!important}
.name,.title h1,.title-area h1,.heading h2,.hero h2,.section-title,.detail-title,.st,.stat b,.info strong,.card-text h3,.order-no,.d b,.measure b,.order-detail b,.info-box b,.box b,.time b,.payment-box b{color:#111827!important}
.title p,.title-area p,.heading p,.hero p,.meta,.stat span,.info span,label,.d,.measure,.order-detail,.info-box,.box,.time,.timeline,.order-date,.payment-box .d{color:var(--muted)!important}
input,.search,.color-name,textarea,select{background:#fff!important;color:#111827!important;border-color:#cbd5e1!important}
input::placeholder,.search::placeholder{color:#64748b!important}
.option input:checked+label{color:#fff!important}
.card-head,.order-head,.head{color:var(--ink)!important}
.color-dot{border-color:#94a3b8!important}
.bottom,.bottom-navigation{background:rgba(255,255,255,.94)!important}
.nav a,.nav-button{color:#475569!important}.nav .active,.nav-button.active{color:#111827!important}
/* Status cards remain colorful with high-contrast white text */
.status-card{color:#fff!important}.status-card .status-name,.status-card .status-count{color:#fff!important}
.status-card.pending{background:linear-gradient(135deg,#f59e0b,#f97316)!important}.status-card.shop{background:linear-gradient(135deg,#6366f1,#3b82f6)!important}.status-card.delivered{background:linear-gradient(135deg,#10b981,#059669)!important}.status-card.newusers{background:linear-gradient(135deg,#ec4899,#db2777)!important}
button.action,.btn,.confirm,.save,.add,.addUserBtn{color:#fff!important}
.badge{color:#075985!important;background:#dbeafe!important}
.tag{color:#1e3a8a!important;background:#dbeafe!important;border:1px solid #93c5fd!important}
</style></head>
<body>
<div class="app">
<div class="top">
<a href="index.html" class="back">←</a>
<div class="title"><h1>👕 Delivered</h1><p>Delivered Orders</p></div>
<a href="search.html" class="searchBtn">🔍</a>
</div>

<div class="stats">
<div class="stat"><b id="users">0</b><span>Customers</span></div>
<div class="stat"><b id="orders">0</b><span>Orders</span></div>
<div class="stat"><b id="pieces">0</b><span>Pieces</span></div>
</div>

<input id="search" class="search" type="search" placeholder="🔍 Name, Mobile or Account No." autocomplete="off">
<div id="msg" class="msg">⏳ Delivered data loading...</div>
<div id="list"><div class="empty"><strong>⏳ Loading...</strong>Please wait.</div></div>
</div>

<div class="bottom"><div class="nav">
<a href="index.html"><i>🏠</i>Home</a>
<a href="add-order.html"><i>➕</i>Add Order</a>
<a href="customers.html"><i>👥</i>Customers</a>
<a href="new-users.html"><i>🆕</i>New Users</a>
<a href="menu.html" class="active"><i>☰</i>Menu</a>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",authDomain:"tailor-web-f1f1c.firebaseapp.com",projectId:"tailor-web-f1f1c",storageBucket:"tailor-web-f1f1c.firebasestorage.app",messagingSenderId:"129811668871",appId:"1:129811668871:web:586357e9e696a9652ffd22"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let all=[];
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const num=v=>Math.max(0,Number(v)||0);
const date=v=>{if(!v)return"-";if(v?.toDate)return v.toDate().toLocaleString("en-PK");if(v?.seconds)return new Date(v.seconds*1000).toLocaleString("en-PK");return new Date(v).toLocaleString("en-PK")};
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}try{
 const s=await getDocs(collection(db,"users",u.uid,"orders"));all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>String(o.status||o.orderStatus||"").toLowerCase().includes("deliver"));
 render();
}catch(e){$("msg").textContent="❌ Delivered data لوڈ نہیں ہوا: "+e.message}});
function render(){const q=($("search")?.value||"").toLowerCase().trim();const data=q?all.filter(o=>[o.customerName,o.name,o.phone,o.accountNo,o.orderNo,o.id].some(v=>String(v??"").toLowerCase().includes(q))):all;
$("users").textContent=new Set(data.map(o=>o.customerId||o.accountNo||o.phone||o.customerName||o.name)).size;
$("orders").textContent=data.length;$("pieces").textContent=data.reduce((s,o)=>s+Math.max(1,num(o.quantity??o.qty??o.itemsCount??1)),0);
const list=$("list");list.innerHTML="";if(!data.length){list.innerHTML='<div class="empty"><strong>📦 ابھی کوئی Delivered Order نہیں</strong>Ready In Shop سے Delivered کرنے کے بعد یہاں نظر آئے گا۔</div>';return}
data.forEach(o=>{const q=Math.max(1,num(o.quantity??o.qty??o.itemsCount??1));const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="head"><div class="avatar">👤</div><div class="info"><div class="name">${esc(o.customerName||o.name||"-")}</div><div class="meta">📱 ${esc(o.phone||o.mobile||"-")}<br>👕 ${q} کپڑے · ${esc(date(o.deliveredAtIso||o.deliveredAt))}</div></div><div class="badge">✓ Delivered</div></div><div class="details"><div class="st">📦 Delivery Details</div><div class="grid"><div class="d"><b>نام</b>${esc(o.customerName||o.name||"-")}</div><div class="d"><b>پتہ</b>${esc(o.address||"-")}</div><div class="d"><b>Order No.</b>${esc(o.orderNo||o.orderId||o.id)}</div><div class="d"><b>کپڑوں کی تعداد</b>${q}</div><div class="d"><b>کس کو دیا گیا</b>${esc(o.deliveredTo||"-")}</div><div class="d"><b>طریقہ</b>${esc(o.deliveryMethod||"Shop")}</div></div></div>`;c.querySelector(".head").onclick=()=>c.classList.toggle("open");list.appendChild(c)})}
if($("search"))$("search").oninput=render;
</script>
</body>
</html>
