<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ہوم</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,collection,getDocs,db,$}from'./app.js';requireAuth(async u=>{document.getElementById('app').innerHTML=nav('home')+`<main class="wrap"><div class="hero"><h1>درزی مینیجر</h1><p>سادہ اور تیز آرڈر مینجمنٹ</p></div><div class="grid2"><a class="card" href="customers.html" style="text-decoration:none;color:inherit"><div class="stat" id="cc">—</div><h3>محفوظ کسٹمرز</h3><div class="muted">اپنے مستقل کسٹمرز</div></a><a class="card" href="new-user.html" style="text-decoration:none;color:inherit"><div class="stat">＋</div><h3>نیا آرڈر</h3><div class="muted">نئے یا محفوظ کسٹمر کے لیے</div></a><a class="card" href="pending.html" style="text-decoration:none;color:inherit"><div class="stat" id="pc">—</div><h3>پینڈنگ</h3><div class="muted">جاری کپڑے</div></a><a class="card" href="completed.html" style="text-decoration:none;color:inherit"><div class="stat" id="dc">—</div><h3>مکمل</h3><div class="muted">مکمل کیے گئے کپڑے</div></a></div></main>`;bindNav();try{const s=await getDocs(collection(db,'users',u.uid,'customers'));cc.textContent=s.size}catch(e){cc.textContent='0'}try{const s=await getDocs(collection(db,'users',u.uid,'orders'));let p=0,d=0;s.forEach(x=>{const o=x.data();if((o.status||'pending')==='pending')p+=(Number(o.quantity)||1);if((o.status||'')==='ready'||(o.status||'')==='completed')d+=(Number(o.completedQuantity)||0)});pc.textContent=p;dc.textContent=d}catch(e){pc.textContent='0';dc.textContent='0'}});</script></body></html>
