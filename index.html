<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ٹیلر منیجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

<div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-center text-blue-900 mb-6">عدنان ٹیلرز</h1>

    <!-- 1. مین نیویگیشن -->
    <div class="grid grid-cols-3 gap-2 mb-8">
        <button class="bg-yellow-500 text-white p-3 rounded-lg font-bold">پینڈنگ</button>
        <button class="bg-blue-600 text-white p-3 rounded-lg font-bold">ان پیڈ</button>
        <button class="bg-green-600 text-white p-3 rounded-lg font-bold">مکمل پیڈ</button>
    </div>

    <!-- 2. کسٹمر اور ناپ فارم -->
    <form class="space-y-6">
        <!-- ذاتی تفصیل -->
        <div class="space-y-4">
            <input type="text" placeholder="گاہک کا نام" class="w-full p-3 border rounded-lg">
            <input type="number" placeholder="فون نمبر" class="w-full p-3 border rounded-lg">
            <input type="text" placeholder="علاقہ / پتہ" class="w-full p-3 border rounded-lg">
        </div>

        <!-- ناپ کے خانے (ترتیب وار) -->
        <div class="border-t pt-4">
            <h2 class="font-bold text-xl mb-4 text-blue-800">ناپ کی تفصیلات</h2>
            <div class="space-y-3">
                <input type="text" placeholder="لمبائی" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="تیرا" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="استین" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="گلا" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="چھاتی" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="کمر" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="دامن" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="شلوار لمبائی مکمل" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="پانچہ" class="w-full p-3 border rounded-lg">
                <input type="text" placeholder="کپڑے کا رنگ" class="w-full p-3 border rounded-lg">
            </div>
        </div>

        <!-- ڈیزائن چیک باکسز -->
        <div class="border-t pt-4 space-y-4">
            <h2 class="font-bold text-xl text-blue-800">ڈیزائن آپشنز</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>بین</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>گول دامن</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>چورس دامن</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>دوبغل جیب</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>سامنے جیب</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>شلوار جیب</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>تیلا گوٹ</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>فیٹ کف</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>سادہ آستین</span></label>
                <label class="flex items-center space-x-2 space-x-reverse"><input type="checkbox" class="w-5 h-5"> <span>کف دار</span></label>
            </div>
        </div>

        <button type="button" class="w-full bg-blue-900 text-white p-4 rounded-xl font-bold text-lg">آرڈر محفوظ کریں</button>
    </form>
</div>

</body>
</html>
