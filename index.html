<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ٹیلر منیجر پرو</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-md mx-auto bg-white p-5 rounded-2xl shadow-xl">
    <!-- ٹیلر پروفائل -->
    <div id="profileSection" class="text-center mb-6">
        <h1 id="tailorNameDisplay" class="text-2xl font-bold text-blue-900">عدنان ٹیلرز</h1>
        <button onclick="changeName()" class="text-xs text-gray-500">پروفائل تبدیل کریں</button>
    </div>

    <!-- سٹیٹس ڈیش بورڈ -->
    <div class="grid grid-cols-3 gap-2 mb-6">
        <div class="bg-yellow-500 text-white p-3 rounded-lg text-center">
            <span class="block text-xl font-bold" id="pendingCount">0</span>
            <span class="text-[10px]">پینڈنگ</span>
        </div>
        <div class="bg-blue-500 text-white p-3 rounded-lg text-center">
            <span class="block text-xl font-bold" id="unpaidCount">0</span>
            <span class="text-[10px]">ان-پیڈ</span>
        </div>
        <div class="bg-green-600 text-white p-3 rounded-lg text-center">
            <span class="block text-xl font-bold" id="paidCount">0</span>
            <span class="text-[10px]">پیڈ</span>
        </div>
    </div>

    <!-- فارم (مکمل ناپ کے ساتھ) -->
    <div id="formSection" class="space-y-3">
        <input type="text" id="custName" placeholder="گاہک کا نام" class="w-full p-2 border rounded">
        <input type="text" id="custPhone" placeholder="فون نمبر" class="w-full p-2 border rounded">
        
        <h2 class="font-bold border-b pt-2">ناپ کی تفصیلات:</h2>
        <div class="grid grid-cols-2 gap-2">
            <input type="text" id="len" placeholder="لمبائی" class="p-2 border rounded">
            <input type="text" id="tera" placeholder="تیرا" class="p-2 border rounded">
            <input type="text" id="ast" placeholder="آستین" class="p-2 border rounded">
            <input type="text" id="gala" placeholder="گلا" class="p-2 border rounded">
        </div>
        
        <h2 class="font-bold border-b pt-2">ڈیزائن:</h2>
        <div class="grid grid-cols-2 gap-2 text-sm">
            <label><input type="checkbox" class="design" value="بین"> بین</label>
            <label><input type="checkbox" class="design" value="گول دامن"> گول دامن</label>
            <label><input type="checkbox" class="design" value="دوبغل جیب"> دوبغل جیب</label>
            <label><input type="checkbox" class="design" value="سامنے جیب"> سامنے جیب</label>
        </div>
        <button onclick="saveOrder()" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold mt-4">آرڈر محفوظ کریں</button>
    </div>
</div>

<script>
    // ایپ لوڈ ہوتے وقت ڈیٹا اپ ڈیٹ کرنا
    function updateDashboard() {
        let orders = JSON.parse(localStorage.getItem('tailorOrders') || '[]');
        document.getElementById('pendingCount').innerText = orders.filter(o => o.status === 'pending').length;
        document.getElementById('unpaidCount').innerText = orders.filter(o => o.status === 'unpaid').length;
        document.getElementById('paidCount').innerText = orders.filter(o => o.status === 'paid').length;
    }

    function saveOrder() {
        let orders = JSON.parse(localStorage.getItem('tailorOrders') || '[]');
        let newOrder = {
            id: Date.now(),
            name: document.getElementById('custName').value,
            status: 'pending' // ڈیفالٹ
        };
        orders.push(newOrder);
        localStorage.setItem('tailorOrders', JSON.stringify(orders));
        alert("آرڈر پینڈنگ میں محفوظ ہو گیا!");
        updateDashboard();
    }

    function changeName() {
        let name = prompt("اپنا نام درج کریں:");
        if(name) {
            document.getElementById('tailorNameDisplay').innerText = name;
            localStorage.setItem('tailorName', name);
        }
    }

    // شروع میں ڈیٹا لوڈ کریں
    window.onload = () => {
        let storedName = localStorage.getItem('tailorName');
        if(storedName) document.getElementById('tailorNameDisplay').innerText = storedName;
        updateDashboard();
    };
</script>
</body>
</html>
