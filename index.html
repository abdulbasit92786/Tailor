<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tailor Manager</title>


    <!-- =====================================================
         FIREBASE AUTHENTICATION
    ====================================================== -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        /* =====================================================
           YOUR FIREBASE CONFIG
           SAME PROJECT AS login.html
        ====================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",

            authDomain:
                "tailor-web-f1f1c.firebaseapp.com",

            projectId:
                "tailor-web-f1f1c",

            storageBucket:
                "tailor-web-f1f1c.firebasestorage.app",

            messagingSenderId:
                "129811668871",

            appId:
                "1:129811668871:web:586357e9e696a9652ffd22"

        };


        /* =====================================================
           INITIALIZE FIREBASE
        ====================================================== */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        /* =====================================================
           LOGIN CHECK
        ====================================================== */

        onAuthStateChanged(auth, (user) => {

            if (user) {

                /*
                 * User successfully logged in.
                 * Dashboard can now be displayed.
                 */


                console.log(
                    "Firebase User:",
                    user
                );


                /*
                 * IMPORTANT USER DATA
                 *
                 * یہ معلومات آگے Firebase Database
                 * میں User کے ڈیٹا کو جوڑنے کے لیے
                 * استعمال ہوں گی۔
                 */

                window.currentUser = {

                    uid:
                        user.uid,

                    email:
                        user.email || "",

                    name:
                        user.displayName || "",

                    photo:
                        user.photoURL || ""

                };


                /*
                 * User information page پر دکھائیں
                 */

                const userName =
                    document.getElementById(
                        "userName"
                    );


                const userEmail =
                    document.getElementById(
                        "userEmail"
                    );


                const userPhoto =
                    document.getElementById(
                        "userPhoto"
                    );


                if (userName) {

                    userName.textContent =
                        user.displayName ||
                        "Tailor User";

                }


                if (userEmail) {

                    userEmail.textContent =
                        user.email ||
                        "";

                }


                if (
                    userPhoto &&
                    user.photoURL
                ) {

                    userPhoto.src =
                        user.photoURL;

                    userPhoto.style.display =
                        "block";

                }


                /*
                 * User Login ہے۔
                 * اب Dashboard دکھائیں۔
                 */

                document.body.classList.add(
                    "authenticated"
                );


            } else {

                /*
                 * User Login نہیں ہے۔
                 *
                 * Dashboard نہیں دکھائیں۔
                 *
                 * واپس login.html پر بھیج دیں۔
                 */

                window.location.replace(
                    "login.html"
                );

            }

        });

    </script>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================================
           BODY
        ====================================================== */

        body {

            display: none;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at top left,
                    #334155 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    #312e81 0%,
                    transparent 40%
                ),

                linear-gradient(
                    145deg,
                    #020617,
                    #0f172a
                );

            color:
                #ffffff;

            padding-bottom:
                90px;

        }


        /*
         * صرف authenticated User کو
         * Dashboard نظر آئے گا۔
         */

        body.authenticated {

            display: block;

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        /* =====================================================
           MAIN APP
        ====================================================== */

        .app {

            width: 100%;

            max-width: 480px;

            margin: auto;

            padding: 16px;

        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .top-bar {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom:
                18px;

        }


        .top-button {

            width: 48px;

            height: 48px;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);

            backdrop-filter:
                blur(15px);

            font-size:
                22px;

            transition:
                0.2s;

        }


        .top-button:active {

            transform:
                scale(0.92);

        }


        .title-area {

            flex: 1;

            text-align:
                center;

            padding:
                0 10px;

        }


        .title-area h1 {

            font-size:
                21px;

            font-weight:
                700;

        }


        .title-area p {

            margin-top:
                4px;

            font-size:
                12px;

            color:
                #94a3b8;

        }


        /* =====================================================
           USER INFORMATION
        ====================================================== */

        .user-info {

            display: flex;

            align-items: center;

            gap:
                12px;

            padding:
                13px;

            margin-bottom:
                20px;

            border-radius:
                20px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(15px);

        }


        .user-default-icon {

            width:
                45px;

            height:
                45px;

            min-width:
                45px;

            border-radius:
                50%;

            display: flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                linear-gradient(
                    145deg,
                    #6366f1,
                    #4338ca
                );

            font-size:
                21px;

        }


        .user-photo {

            width:
                45px;

            height:
                45px;

            min-width:
                45px;

            border-radius:
                50%;

            object-fit:
                cover;

            display:
                none;

            border:
                2px solid
                rgba(255,255,255,0.3);

        }


        .user-text {

            min-width:
                0;

            overflow:
                hidden;

        }


        .user-text strong {

            display:
                block;

            font-size:
                14px;

            margin-bottom:
                4px;

        }


        .user-text small {

            display:
                block;

            font-size:
                11px;

            color:
                #94a3b8;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =====================================================
           SECTION TITLE
        ====================================================== */

        .section-title {

            font-size:
                17px;

            font-weight:
                700;

            margin:
                5px 2px 14px;

        }


        /* =====================================================
           FIVE MAIN STATUS BUTTONS
        ====================================================== */

        .dashboard {

            display:
                grid;

            grid-template-columns:
                repeat(6, 1fr);

            gap:
                11px;

        }


        .status-card {

            min-height:
                125px;

            border-radius:
                23px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                12px 7px;

            position:
                relative;

            overflow:
                hidden;

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.25);

            transition:
                transform 0.2s;

        }


        .status-card::before {

            content:
                "";

            position:
                absolute;

            width:
                100px;

            height:
                100px;

            border-radius:
                50%;

            background:
                rgba(255,255,255,0.12);

            top:
                -45px;

            right:
                -35px;

        }


        .status-card:active {

            transform:
                scale(0.95);

        }


        /*
         * First three
         */

        .status-card:nth-child(1),
        .status-card:nth-child(2),
        .status-card:nth-child(3) {

            grid-column:
                span 2;

        }


        /*
         * Last two
         */

        .status-card:nth-child(4) {

            grid-column:
                2 / span 2;

        }


        .status-card:nth-child(5) {

            grid-column:
                4 / span 2;

        }


        .status-icon {

            font-size:
                31px;

            margin-bottom:
                9px;

            position:
                relative;

            z-index:
                2;

        }


        .status-name {

            font-size:
                12px;

            font-weight:
                700;

            line-height:
                1.35;

            position:
                relative;

            z-index:
                2;

        }


        .status-count {

            margin-top:
                8px;

            padding:
                4px 9px;

            border-radius:
                20px;

            background:
                rgba(0,0,0,0.18);

            font-size:
                10px;

            color:
                rgba(255,255,255,0.9);

            position:
                relative;

            z-index:
                2;

        }


        /* =====================================================
           STATUS COLORS
        ====================================================== */

        .pending {

            background:
                linear-gradient(
                    145deg,
                    #f59e0b,
                    #b45309
                );

        }


        .unpaid {

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #991b1b
                );

        }


        .paid {

            background:
                linear-gradient(
                    145deg,
                    #10b981,
                    #047857
                );

        }


        .shop {

            background:
                linear-gradient(
                    145deg,
                    #8b5cf6,
                    #5b21b6
                );

        }


        .delivered {

            background:
                linear-gradient(
                    145deg,
                    #0ea5e9,
                    #0369a1
                );

        }


        /* =====================================================
           OVERVIEW
        ====================================================== */

        .overview {

            margin-top:
                22px;

            padding:
                18px;

            border-radius:
                22px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.18);

        }


        .overview h2 {

            font-size:
                16px;

            margin-bottom:
                7px;

        }


        .overview p {

            color:
                #94a3b8;

            font-size:
                12px;

            line-height:
                1.6;

        }


        /* =====================================================
           BOTTOM NAVIGATION
        ====================================================== */

        .bottom-navigation {

            position:
                fixed;

            left:
                0;

            right:
                0;

            bottom:
                0;

            height:
                78px;

            background:
                rgba(2,6,23,0.94);

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(20px);

            z-index:
                999;

        }


        .bottom-inner {

            width:
                100%;

            max-width:
                480px;

            height:
                100%;

            margin:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-around;

        }


        .nav-button {

            width:
                55px;

            text-align:
                center;

            color:
                #94a3b8;

            font-size:
                9px;

            transition:
                0.2s;

        }


        .nav-button:active {

            transform:
                scale(0.92);

        }


        .nav-icon {

            width:
                38px;

            height:
                34px;

            margin:
                0 auto 3px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                12px;

            font-size:
                20px;

        }


        .nav-button.active {

            color:
                #ffffff;

        }


        .nav-button.active
        .nav-icon {

            background:
                rgba(255,255,255,0.12);

        }


        /* =====================================================
           ADD ORDER BUTTON
        ====================================================== */

        .add-order {

            margin-top:
                -25px;

        }


        .add-order .nav-icon {

            width:
                55px;

            height:
                55px;

            border-radius:
                50%;

            background:
                linear-gradient(
                    145deg,
                    #22c55e,
                    #15803d
                );

            box-shadow:
                0 8px 25px
                rgba(34,197,94,0.35);

            border:
                4px solid
                #020617;

            font-size:
                30px;

        }


        .add-order span {

            position:
                relative;

            top:
                2px;

        }


        /* =====================================================
           SMALL MOBILE
        ====================================================== */

        @media (max-width: 360px) {

            .app {

                padding:
                    12px;

            }


            .dashboard {

                gap:
                    8px;

            }


            .status-card {

                min-height:
                    112px;

            }


            .status-icon {

                font-size:
                    26px;

            }


            .status-name {

                font-size:
                    10px;

            }


            .status-count {

                font-size:
                    9px;

            }


            .nav-button {

                width:
                    48px;

                font-size:
                    8px;

            }

        }

    </style>

</head>
