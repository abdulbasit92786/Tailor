<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ہوم</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"></head><body><div id="app"></div><script type="module">import{requireAuth,nav,bindNav,db,collection,getDocs,lang}from'./app.js';requireAuth(async u=>{const en=lang()==='en';document.getElementById('app').innerHTML=nav('home')+`<main class="wrap"><div class="hero"><h1>${en?'Tailor Manager':'درزی مینیجر'}</h1><p>${en?'Simple and fast order management.':'سادہ اور تیز آرڈر مینجمنٹ۔'}</p></div><div class="home-grid"><a class="card home-card" href="customers.html"><div class="stat" id="cc">—</div><h3>${en?'Saved Customers':'محفوظ کسٹمرز'}</h3><div class="muted">${en?'Your permanent customers':'آپ کے مستقل کسٹمرز'}</div></a><a class="card home-card" href="new-user.html"><div class="stat">＋</div><h3>${en?'New Order':'نیا آرڈر'}</h3><div class="muted">${en?'New or saved customer':'نئے یا محفوظ کسٹمر کے لیے'}</div></a><a class="card home-card" href="pending.html"><div class="stat" id="pc">—</div><h3>${en?'Pending':'پینڈنگ'}</h3><div class="muted">${en?'Clothes still in work':'جاری کپڑے'}</div></a><a class="card home-card" href="completed.html"><div class="stat" id="dc">—</div><h3>${en?'Completed':'مکمل'}</h3><div class="muted">${en?'Completed clothes':'مکمل کیے گئے کپڑے'}</div></a></div></main>`;bindNav();try{const [cs,os]=await Promise.all([getDocs(collection(db,'users',u.uid,'customers')),getDocs(collection(db,'users',u.uid,'orders'))]);cc.textContent=cs.size;let p=0,c=0;os.forEach(x=>{const o=x.data();const total=Number(o.quantity)||1,done=Math.min(total,Number(o.completedQuantity)||0);if((o.status||'pending')==='pending')p+=Math.max(0,total-done);c+=done});pc.textContent=p;dc.textContent=c}catch(e){cc.textContent='0';pc.textContent='0';dc.textContent='0'}});</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./pwabuilder-sw.js', {
      scope: './'
    }).then(function () {
      console.log('Service Worker registered');
    }).catch(function (error) {
      console.error('Service Worker registration failed:', error);
    });
  });
}
</script></body></html>
