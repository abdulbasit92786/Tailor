<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tailor - ڈیش بورڈ</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .btn-menu { background: #28a745; color: white; border: none; padding: 20px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .btn-menu:hover { background: #218838; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="userName">خوش آمدید</h2>
        <button id="logoutBtn" class="btn-logout">لاگ آؤٹ</button>
    </div>

    <div class="menu">
        <button class="btn-menu" onclick="location.href='customers.html'">گراہک کا ریکارڈ</button>
        <button class="btn-menu" onclick="location.href='orders.html'">آرڈرز</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsoWnSGzzt3BRuL5fIhq7dfg2fqyibM1U",
            authDomain: "tailor-web-f1f1c.firebaseapp.com",
            projectId: "tailor-web-f1f1c",
            storageBucket: "tailor-web-f1f1c.firebasestorage.app",
            messagingSenderId: "129811668871",
            appId: "1:129811668871:web:586357e9e696a9652ffd22"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // چیک کریں کہ یوزر لاگ ان ہے یا نہیں
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("userName").innerText = "خوش آمدید، " + user.displayName;
            } else {
                window.location.href = "login.html"; // اگر لاگ ان نہیں تو لاگ ان پیج پر بھیج دیں
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
